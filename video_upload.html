<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>GR8SKUL — Publish</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101114;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,520px)}h1{font-size:1.8rem;letter-spacing:.12em;margin:0}p{color:#a9a9ae;line-height:1.5}.head{margin-bottom:35px}.field{margin:22px 0}label{display:block;margin-bottom:9px;font-size:.9rem;color:#c9c9cd}input[type=text],input[type=email],input[type=password],textarea,input[type=file]{width:100%;border:1px solid #3a3b40;border-radius:10px;background:#1c1d21;color:white;padding:14px;font:inherit}textarea{min-height:100px;resize:vertical}input[type=file]{font-size:.85rem}button{border:0;border-radius:10px;padding:15px 18px;font:inherit;font-weight:650;cursor:pointer;background:#f2f2f2;color:#151515;width:100%}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#292a2e;color:#eee;margin-bottom:12px}.small{font-size:.82rem;color:#9b9ba1}.status{min-height:32px;margin-top:20px;white-space:pre-wrap}progress{width:100%;height:9px;margin-top:10px;accent-color:#ddd}footer{margin-top:48px;text-align:center;font-size:.75rem;color:#68696d}.hidden{display:none!important}.error{color:#ffaaaa}.success{color:#c6f4d0}.account-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}.account-row .small{flex:1;overflow-wrap:anywhere}.account-row button{width:auto;padding:10px 13px;font-size:.85rem}.notice{font-size:.82rem;color:#a9a9ae}
</style>
</head>
<body><main>
<div class="head"><h1>GR8SKUL</h1><p>Make something. Publish it. Move on.</p></div>
<section id="login"><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="signIn" type="submit">Sign in</button></form></section>
<section id="protected" class="hidden"><div class="account-row"><span id="signedInAs" class="small"></span><button id="signOut" class="secondary" type="button">Sign out</button></div><section id="setup"><button id="connect" class="secondary" type="button">Connect YouTube</button><div id="account" class="small">Reconnect only if YouTube authorization expires or changes.</div></section>
<form id="form"><div class="field"><label for="file">Video</label><input id="file" type="file" accept="video/*,.mov,.mp4,.m4v,.webm" required></div><div class="field"><label for="title">Title</label><input id="title" type="text" maxlength="100" required autocomplete="off" placeholder="Title"></div><div class="field"><label for="description">Description (optional)</label><textarea id="description" maxlength="5000" placeholder=""></textarea></div><button id="publish" type="submit">Publish privately to YouTube</button><p class="notice">Testing mode: uploads are private on YouTube. Keep this page open until confirmation.</p></form></section>
<div id="status" class="status" role="status" aria-live="polite"></div><progress id="progress" class="hidden" max="100" value="0"></progress><p class="small">No views. No subscribers. No comments. No analytics.</p><footer>GR8SKUL · JUST PUBLISH</footer>
</main>
<script>
const SUPABASE_URL='https://rijzolipyabfggrrhgab.supabase.co';
const SUPABASE_KEY='sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let busy=false;
function say(message,cls=''){$('status').textContent=message;$('status').className='status '+cls;}
function showSignedOut(){$('login').classList.remove('hidden');$('protected').classList.add('hidden');$('signedInAs').textContent='';$('account').textContent='YouTube connection not yet confirmed';$('password').value='';}
function showSignedIn(user){$('login').classList.add('hidden');$('protected').classList.remove('hidden');$('signedInAs').textContent=user.email||'Signed in';}
async function refreshSession(){const {data,error}=await client.auth.getUser();if(error||!data.user){showSignedOut();return;}showSignedIn(data.user);}
async function getToken(){const {data:{session},error}=await client.auth.getSession();if(error||!session?.access_token)throw new Error('Please sign in again.');return session.access_token;}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('signIn').disabled=true;say('Signing in…');try{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;showSignedIn(data.user);say('Signed in.','success');}catch(err){say(err.message||'Sign in failed.','error');}finally{busy=false;$('signIn').disabled=false;}});
$('signOut').addEventListener('click',async()=>{if(busy)return;try{const {error}=await client.auth.signOut();if(error)throw error;showSignedOut();say('Signed out.');}catch(err){say(err.message||'Could not sign out.','error');}});
$('connect').addEventListener('click',async()=>{if(busy)return;busy=true;$('connect').disabled=true;say('Starting YouTube authorization…');try{const token=await getToken();const response=await fetch(SUPABASE_URL+'/functions/v1/publisher-google-start',{method:'POST',headers:{Authorization:'Bearer '+token,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:'{}'});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||result.message||'Authorization could not be started ('+response.status+').');if(typeof result.authorization_url!=='string'||!result.authorization_url.startsWith('https://accounts.google.com/'))throw new Error('Authorization URL missing or unexpected.');$('account').textContent='Continue authorization with Google';window.location.assign(result.authorization_url);}catch(err){say(err.message||'Could not connect YouTube.','error');busy=false;$('connect').disabled=false;}});
function uploadFile(uploadUrl,file){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',uploadUrl,true);xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');xhr.upload.onprogress=e=>{if(e.lengthComputable){const pct=Math.min(100,Math.round(100*e.loaded/e.total));$('progress').value=pct;say('Uploading video… '+pct+'%');}};xhr.onerror=()=>reject(new Error('The browser could not transfer the video to YouTube. This may be a browser/CORS restriction; the video is not confirmed published.'));xhr.onabort=()=>reject(new Error('Upload was interrupted.'));xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){let result;try{result=JSON.parse(xhr.responseText);}catch{result=null;}if(result?.id)resolve(result);else reject(new Error('YouTube returned success without a video ID. Verify in YouTube Studio before retrying.'));}else reject(new Error('YouTube video transfer failed (HTTP '+xhr.status+'). Do not retry until checking YouTube Studio.'));};xhr.send(file);});}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const file=$('file').files?.[0];const title=$('title').value.trim();const description=$('description').value.trim();if(!file||!title){say('Choose a video and enter a title.','error');return;}if(file.size>500*1024*1024){say('This version supports files up to 500 MB.','error');return;}const contentType=file.type||({'mp4':'video/mp4','mov':'video/quicktime','m4v':'video/x-m4v','webm':'video/webm'}[file.name.split('.').pop().toLowerCase()]);if(!contentType||!/^video\/[a-z0-9.+-]+$/i.test(contentType)){say('The video format could not be identified.','error');return;}busy=true;$('publish').disabled=true;$('connect').disabled=true;$('progress').value=0;$('progress').classList.remove('hidden');say('Creating private YouTube upload session…');try{const token=await getToken();const response=await fetch(SUPABASE_URL+'/functions/v1/publisher-youtube-upload',{method:'POST',headers:{Authorization:'Bearer '+token,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({title,description,file_size:file.size,content_type:contentType})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'Could not create upload session (HTTP '+response.status+').');if(typeof result.upload_url!=='string'||!result.upload_url.startsWith('https://www.googleapis.com/'))throw new Error('Unexpected upload session address.');say('Uploading video… 0%');const uploaded=await uploadFile(result.upload_url,file);$('progress').value=100;say('Video uploaded successfully as PRIVATE on YouTube. Video ID: '+uploaded.id,'success');$('form').reset();}catch(err){say((err.message||'Upload failed.')+'\nIf unsure whether the upload finished, check YouTube Studio before retrying.','error');}finally{busy=false;$('publish').disabled=false;$('connect').disabled=false;}});
refreshSession().catch(()=>showSignedOut());
</script></body></html>
