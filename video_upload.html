<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>GR8SKUL — Publish</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101114;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,520px)}h1{font-size:1.8rem;letter-spacing:.12em;margin:0}p{color:#a9a9ae;line-height:1.5}.head{margin-bottom:35px}.field{margin:22px 0}label{display:block;margin-bottom:9px;font-size:.9rem;color:#c9c9cd}input[type=text],textarea,input[type=file]{width:100%;border:1px solid #3a3b40;border-radius:10px;background:#1c1d21;color:white;padding:14px;font:inherit}textarea{min-height:100px;resize:vertical}input[type=file]{font-size:.85rem}button{border:0;border-radius:10px;padding:15px 18px;font:inherit;font-weight:650;cursor:pointer;background:#f2f2f2;color:#151515;width:100%}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#292a2e;color:#eee;margin-bottom:12px}.small{font-size:.82rem;color:#9b9ba1}.status{min-height:32px;margin-top:20px;white-space:pre-wrap}progress{width:100%;height:9px;margin-top:10px;accent-color:#ddd}footer{margin-top:48px;text-align:center;font-size:.75rem;color:#68696d}.hidden{display:none}.error{color:#ffaaaa}.success{color:#c6f4d0}</style></head>
<body><main><div class="head"><h1>GR8SKUL</h1><p>Make something. Publish it. Move on.</p></div>
<section id="setup"><button id="connect" class="secondary">Connect YouTube</button><div id="account" class="small">Not connected</div></section>
<form id="form"><div class="field"><label for="file">Video</label><input id="file" type="file" accept="video/*,.mov,.mp4,.m4v,.webm" required></div><div class="field"><label for="title">Title</label><input id="title" type="text" maxlength="100" required autocomplete="off" placeholder="Title"></div><div class="field"><label for="description">Description (optional)</label><textarea id="description" maxlength="5000" placeholder=""></textarea></div><button id="publish" type="submit" disabled>Publish</button></form>
<div id="status" class="status" role="status" aria-live="polite"></div><progress id="progress" class="hidden" max="100" value="0"></progress><p class="small">No views. No subscribers. No comments. No analytics.</p><footer>GR8SKUL · JUST PUBLISH</footer></main>
<script>
/* CONFIGURATION: replace this with your Google Cloud OAuth 2.0 WEB client ID.
   Configure Authorized JavaScript origins for https://gr8skul.com and your actual Pages origin.
   This page must be hosted on HTTPS (or localhost for development).
   Protect access to this page before using it in production. */
const GOOGLE_CLIENT_ID = 'REPLACE_WITH_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/youtube.upload';
const $=id=>document.getElementById(id);
let token='',expires=0, tokenClient=null, busy=false;
function say(message,cls=''){$('status').textContent=message;$('status').className='status '+cls}
function ready(){ $('publish').disabled=busy||!token||Date.now()>=expires; }
function loadGoogle(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2)return resolve();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=resolve;s.onerror=()=>reject(new Error('Could not load Google authorization.'));document.head.appendChild(s)})}
async function connect(){try{if(GOOGLE_CLIENT_ID.startsWith('REPLACE_'))throw new Error('Setup needed: add your Google OAuth web client ID to this HTML file.');await loadGoogle();tokenClient??=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPE,callback:r=>{if(r.error){say('Google authorization failed: '+r.error,'error');return}token=r.access_token;expires=Date.now()+(Number(r.expires_in||3500)-60)*1000;$('account').textContent='Connected for uploading';$('connect').textContent='Reconnect YouTube';say('Ready to publish.');ready()}});tokenClient.requestAccessToken({prompt:token?'':'consent'})}catch(e){say(e.message,'error')}}
$('connect').addEventListener('click',connect);
function errorFrom(xhr){let msg=xhr.responseText||xhr.statusText||'Request failed';try{const j=JSON.parse(msg);msg=j.error?.message||msg}catch{}return new Error('YouTube error ('+xhr.status+'): '+msg)}
function xhrRequest(method,url,headers,body,onProgress){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open(method,url,true);for(const [k,v] of Object.entries(headers))x.setRequestHeader(k,v);x.onload=()=>x.status>=200&&x.status<300?resolve(x):reject(errorFrom(x));x.onerror=()=>reject(new Error('Network or browser CORS error. Check Google API configuration and connection.'));if(onProgress)x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total)};x.send(body)})}
async function upload(file,title,description){const metadata={snippet:{title,description,categoryId:'22'},status:{privacyStatus:'public',selfDeclaredMadeForKids:false}};
// YouTube's resumable upload endpoint. The browser must be allowed to read the Location response header.
const start=await xhrRequest('POST','https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status',{'Authorization':'Bearer '+token,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':file.type||'application/octet-stream','X-Upload-Content-Length':String(file.size)},JSON.stringify(metadata));
const url=start.getResponseHeader('Location');if(!url)throw new Error('Upload session created but Location header is unavailable to this browser. A small Supabase Edge Function proxy may be required.');
$('progress').classList.remove('hidden');say('Uploading… keep this page open.');
const finish=await xhrRequest('PUT',url,{'Authorization':'Bearer '+token,'Content-Type':file.type||'application/octet-stream'},file,p=>{$('progress').value=Math.round(p*100)});
let result;try{result=JSON.parse(finish.responseText)}catch{throw new Error('Upload finished but YouTube did not return a readable confirmation.')}
if(!result.id)throw new Error('YouTube did not confirm a video ID.');return result}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;if(!token||Date.now()>=expires){say('Connect YouTube again before publishing.','error');ready();return}const file=$('file').files[0],title=$('title').value.trim(),description=$('description').value.trim();if(!file||!title)return say('Choose a video and enter a title.','error');busy=true;ready();$('connect').disabled=true;$('progress').value=0;try{const result=await upload(file,title,description);say(result.status?.privacyStatus==='public'?'Published.':'Uploaded. YouTube reports visibility: '+(result.status?.privacyStatus||'unknown')+'.','success');$('form').reset()}catch(err){say(err.message+'\nIf the upload was interrupted, verify its status before retrying to avoid duplicate videos.','error')}finally{busy=false;ready();$('connect').disabled=false}});
</script></body></html>
