name: Update Music Catalog

on:
  push:
    paths:
      - "music/*.mp3"
      - "music/*.MP3"

permissions:
  contents: write

jobs:

  update-catalog:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Build music catalog
        run: |

          python3 <<'PY'

          import json
          import os
          import subprocess

          MUSIC_FOLDER = "music"
          OUTPUT_FILE = "catalog.json"


          tracks = []


          if os.path.isdir(MUSIC_FOLDER):

              for filename in os.listdir(MUSIC_FOLDER):

                  if not filename.lower().endswith(".mp3"):
                      continue

                  path = os.path.join(
                      MUSIC_FOLDER,
                      filename
                  )


                  if not os.path.isfile(path):
                      continue


                  try:

                      timestamp = int(
                          subprocess.check_output(
                              [
                                  "git",
                                  "log",
                                  "-1",
                                  "--format=%ct",
                                  "--",
                                  path
                              ],
                              text=True
                          ).strip()
                      )

                  except Exception:

                      timestamp = 0


                  tracks.append(
                      {
                          "name": filename,
                          "path": filename
                          if MUSIC_FOLDER == "."
                          else f"{MUSIC_FOLDER}/{filename}",
                          "timestamp": timestamp
                      }
                  )


          tracks.sort(
              key=lambda track: track["timestamp"],
              reverse=True
          )


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  tracks,
                  file,
                  indent=2,
                  ensure_ascii=False
              )


          PY


      - name: Commit updated catalog
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json

          git diff --cached --quiet || git commit -m "Update music catalog"

          git push
