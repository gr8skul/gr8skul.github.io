name: Update Music Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'track-metadata.json'
      - '.github/workflows/update-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-music-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile R2-backed catalog with metadata
        shell: bash
        run: |
          python3 <<'PY'
          import datetime
          import json
          from pathlib import Path
          import re

          metadata_path = Path('track-metadata.json')
          catalog_path = Path('catalog.json')
          if not metadata_path.is_file() or not catalog_path.is_file():
              raise SystemExit('Missing metadata or catalog; refusing to modify catalog.')

          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          if not isinstance(metadata, dict) or not isinstance(catalog, list):
              raise SystemExit('Unexpected metadata or catalog structure; no changes made.')

          # The UUID filename convention is used by upload-work for R2-backed audio.
          # Legacy/non-UUID catalog entries are preserved unchanged.
          pattern = re.compile(r'^music/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.mp3$', re.I)
          for record in catalog:
              if not isinstance(record, dict) or not isinstance(record.get('path'), str):
                  raise SystemExit('Unexpected catalog entry; refusing to modify catalog.')

          valid_paths = {
              path for path, details in metadata.items()
              if isinstance(path, str) and pattern.fullmatch(path) and isinstance(details, dict)
          }
          # Keep the relative order of every surviving entry.
          updated = [
              record for record in catalog
              if not pattern.fullmatch(record['path']) or record['path'] in valid_paths
          ]
          removed = len(catalog) - len(updated)
          existing = {record['path'] for record in updated}

          added = 0
          for path, details in metadata.items():
              if path not in valid_paths or path in existing:
                  continue
              timestamp = 0
              created = details.get('created_at')
              if isinstance(created, str):
                  try:
                      timestamp = int(datetime.datetime.fromisoformat(created.replace('Z', '+00:00')).timestamp())
                  except (ValueError, OverflowError):
                      pass
              updated.append({'name': path.rsplit('/', 1)[-1], 'path': path, 'timestamp': timestamp})
              existing.add(path)
              added += 1

          if updated != catalog:
              catalog_path.write_text(json.dumps(updated, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'Added {added}; removed {removed} orphaned UUID-path entries. Preserved surviving order and legacy paths.')
          PY

      - name: Commit catalog reconciliation, if needed
        shell: bash
        run: |
          if git diff --quiet -- catalog.json; then
            echo 'Catalog already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog.json
          git commit -m 'Synchronize R2-backed music catalog with metadata'
          git push origin HEAD:main
