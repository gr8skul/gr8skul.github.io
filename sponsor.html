<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    background: #ffffff;

    color: #111111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100%;
}

body {

    overflow-x: hidden;
}

.app {

    width: 100%;

    max-width: 700px;

    min-height: 100vh;

    margin: 0 auto;

    padding: 0 20px;

    display: flex;

    flex-direction: column;
}


/* =========================
   HEADER
   ========================= */

.header {

    flex-shrink: 0;

    background: #ffffff;

    padding-top: 35px;
}

h1 {

    margin: 0 0 35px;

    text-align: center;

    font-size: 42px;

    letter-spacing: 6px;

    font-weight: 700;
}

h1 img {

    display: block;

    width: auto;

    height: 42px;

    max-width: 100%;

    margin: 0 auto;
}

.page-title {

    text-align: center;

    font-size: 14px;

    letter-spacing: 2px;

    font-weight: bold;

    margin-bottom: 25px;
}

.header-line {

    border-bottom: 1px solid #cccccc;

    margin-bottom: 0;
}


/* =========================
   PUBLIC TICKER
   ========================= */

.ticker {

    padding: 18px 0 15px;

    border-bottom: 1px solid #cccccc;
}

.ticker-title {

    text-align: center;

    font-size: 11px;

    color: #888888;

    letter-spacing: 1px;

    margin-bottom: 14px;
}

.ticker-grid {

    display: grid;

    grid-template-columns: 1fr;

    gap: 10px;
}

.ticker-item {

    text-align: center;
}

.ticker-value {

    font-size: 20px;

    font-weight: bold;

    min-height: 24px;
}

.ticker-label {

    margin-top: 5px;

    font-size: 9px;

    color: #888888;

    letter-spacing: 0.5px;
}


/* =========================
   MAIN
   ========================= */

.content {

    flex: 1;

    padding: 30px 0 40px;
}

.section-title {

    text-align: center;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-bottom: 25px;
}


/* =========================
   AUTHENTICATION
   ========================= */

.auth-section {

    width: 100%;

    max-width: 420px;

    margin: 0 auto;
}

.auth-divider {

    border-top: 1px solid #cccccc;

    margin: 40px 0;
}

.form {

    width: 100%;

    margin: 0 auto;
}

.field {

    margin-bottom: 15px;
}

label {

    display: block;

    font-size: 11px;

    color: #777777;

    margin-bottom: 6px;

    letter-spacing: 0.5px;
}

input {

    width: 100%;

    height: 46px;

    border: 1px solid #111111;

    background: #ffffff;

    color: #111111;

    padding: 0 12px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;

    outline: none;
}

input:focus {

    background: #f5f5f5;
}

button {

    border: 1px solid #111111;

    background: #ffffff;

    color: #111111;

    cursor: pointer;

    font-size: 14px;

    padding: 12px 18px;

    min-height: 46px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button:hover {

    background: #eeeeee;
}

.primary-button {

    width: 100%;

    font-weight: bold;

    margin-top: 5px;
}

.form-message {

    min-height: 24px;

    margin-top: 15px;

    text-align: center;

    font-size: 12px;

    color: #777777;

    line-height: 1.5;
}

.password-recovery {

    text-align: center;

    margin-top: 15px;

    font-size: 11px;
}

.password-recovery a {

    color: #777777;

    text-decoration: none;

    cursor: pointer;
}

.password-recovery a:hover {

    color: #111111;

    text-decoration: underline;
}

.signup-tagline {

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   FOOTER
   ========================= */

.footer {

    flex-shrink: 0;

    padding: 20px 0 25px;

    text-align: center;

    border-top: 1px solid #cccccc;

    font-size: 10px;

    color: #999999;
}

.footer a {

    color: #777777;

    text-decoration: none;
}

.footer a:hover {

    color: #111111;

    text-decoration: underline;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 500px) {

    .app {

        padding: 0 15px;
    }

    .header {

        padding-top: 25px;
    }

    h1 img {

        height: 34px;
    }

    .ticker-value {

        font-size: 17px;
    }

    .ticker-label {

        font-size: 8px;
    }

    .content {

        padding-top: 25px;
    }

}

<script>


/*
    ============================================================
    GR8SKUL SPONSOR PORTAL
    ============================================================
*/


const SUPABASE_URL =
    "https://rijzolipyabfggrrhgab.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm";


const AUTH_STORAGE_KEY =
    "gr8skul-sponsor-auth";


let accessToken = null;


/*
    ============================================================
    DOM
    ============================================================
*/


const authMessage =
    document.getElementById(
        "authMessage"
    );


/*
    ============================================================
    SUPABASE REQUEST
    ============================================================
*/


async function supabaseRequest(
    endpoint,
    options = {}
) {

    const headers = {

        "apikey":
            SUPABASE_KEY,

        "Content-Type":
            "application/json"

    };


    if (accessToken) {

        headers["Authorization"] =
            "Bearer " +
            accessToken;

    } else {

        headers["Authorization"] =
            "Bearer " +
            SUPABASE_KEY;

    }


    const response =
        await fetch(
            SUPABASE_URL +
            endpoint,
            {
                ...options,

                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );


    return response;

}


/*
    ============================================================
    PUBLIC TICKER
    ============================================================
*/



async function loadPublicTicker() {
    try {
        const data = await supabaseRequest(
            "/rest/v1/rpc/get_public_sponsor_ticker",
            "POST",
            {}
        );

        const ticker = Array.isArray(data) ? data[0] : data;

        const value = ticker && ticker.average_exposure != null
            ? Number(ticker.average_exposure).toFixed(1)
            : "0.0";

        document.getElementById(
            "publicAverageDailyExposures"
        ).textContent = value;

    } catch (error) {
        console.error(
            "Failed to load public sponsor ticker:",
            error
        );

        document.getElementById(
            "publicAverageDailyExposures"
        ).textContent = "0.0";
    }
}


/*
    ============================================================
    SIGN UP
    ============================================================
*/


async function signUp() {

    const companyName =
        document.getElementById(
            "companyName"
        ).value.trim();


    const tagline =
        document.getElementById(
            "signupTagline"
        ).value.trim();


    const website =
        document.getElementById(
            "signupWebsite"
        ).value.trim();


    const email =
        document.getElementById(
            "signUpEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "signUpPassword"
        ).value;


    if (!companyName) {

        authMessage.textContent =
            "Enter your company name.";

        return;

    }


    if (companyName.length > 90) {

        authMessage.textContent =
            "Your company name must be 90 characters or fewer.";

        return;

    }


    if (tagline.length > 90) {

        authMessage.textContent =
            "Your tagline must be 90 characters or fewer.";

        return;

    }


    if (!website) {

        authMessage.textContent =
            "Enter your website address.";

        return;

    }


    let websiteUrl;


    try {

        websiteUrl =
            new URL(
                website
            );

    } catch (error) {

        authMessage.textContent =
            "Enter a valid website address.";

        return;

    }


    if (
        websiteUrl.protocol !==
        "https:"
    ) {

        authMessage.textContent =
            "Your website must use HTTPS.";

        return;

    }


    if (
        !email ||
        !password
    ) {

        authMessage.textContent =
            "Enter an email and create a password.";

        return;

    }


    if (
        password.length < 6
    ) {

        authMessage.textContent =
            "Your password must be at least 6 characters.";

        return;

    }


    authMessage.textContent =
        "Creating sponsor account...";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/signup",
                {
                    method: "POST",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password,

                            data: {

                                business_name:
                                    companyName,

                                tagline:
                                    tagline,

                                website:
                                    websiteUrl.href

                            }

                        })
                }
            );


        const result =
            await response.json();


        console.log(
            "GR8SKUL SIGNUP RESPONSE:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result.msg ||
                result.message ||
                result.error_description ||
                "Sponsor account creation failed."
            );

        }


        if (
            result.access_token
        ) {

            saveSession(
                result
            );


            authMessage.textContent =
                "Sponsor account created.";


            await showDashboard();


            return;

        }


        authMessage.textContent =
            "Account created. Check your email to confirm your account, then sign in.";


        document.getElementById(
            "signInEmail"
        ).value =
            email;


        document.getElementById(
            "signInPassword"
        ).value =
            "";


    } catch (error) {

        console.error(
            "GR8SKUL sponsor signup failed.",
            error
        );


        authMessage.textContent =
            error.message;

    }

}


/*
    ============================================================
    SIGN IN
    ============================================================
*/


async function signIn() {

    const email =
        document.getElementById(
            "signInEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "signInPassword"
        ).value;


    if (
        !email ||
        !password
    ) {

        authMessage.textContent =
            "Enter an email and password.";

        return;

    }


    authMessage.textContent =
        "Signing in...";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error_description ||
                result.msg ||
                result.message ||
                "Sign in failed."
            );

        }


        saveSession(
            result
        );


        authMessage.textContent =
            "";


        await showDashboard();


    } catch (error) {

        authMessage.textContent =
            error.message;

    }

}


/*
    ============================================================
    SAVE SESSION
    ============================================================
*/


function saveSession(
    session
) {

    accessToken =
        session.access_token;


    try {

        localStorage.setItem(
            AUTH_STORAGE_KEY,
            JSON.stringify(
                session
            )
        );

    } catch (error) {

        console.error(
            "GR8SKUL sponsor session could not be saved.",
            error
        );

    }

}


/*
    ============================================================
    LOAD SAVED SESSION
    ============================================================
*/


function loadSavedSession() {

    try {

        const saved =
            localStorage.getItem(
                AUTH_STORAGE_KEY
            );


        if (!saved) {

            return false;

        }


        const session =
            JSON.parse(
                saved
            );


        if (
            !session ||
            !session.access_token
        ) {

            return false;

        }


        accessToken =
            session.access_token;


        return true;


    } catch (error) {

        console.error(
            "GR8SKUL sponsor session could not be loaded.",
            error
        );


        return false;

    }

}


/*
    ============================================================
    DASHBOARD
    ============================================================
*/


async function showDashboard() {

    window.location.href =
        "/sponsor-view.html";

}


/*
    ============================================================
    PASSWORD RECOVERY
    ============================================================
*/


document.getElementById(
    "forgotPasswordLink"
).addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        authMessage.textContent =
            "Password recovery will be available soon.";

    }
);


/*
    ============================================================
    BUTTONS
    ============================================================
*/


document.getElementById(
    "signInButton"
).addEventListener(
    "click",
    signIn
);


document.getElementById(
    "signUpButton"
).addEventListener(
    "click",
    signUp
);


/*
    ============================================================
    ENTER KEY — SIGN IN
    ============================================================
*/


document.getElementById(
    "signInPassword"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            signIn();

        }

    }
);


/*
    ============================================================
    START
    ============================================================
*/


loadPublicTicker();


setInterval(
    loadPublicTicker,
    10000
);


if (
    loadSavedSession()
) {

    showDashboard();

}


</script>
