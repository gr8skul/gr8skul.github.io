<script>


/*
    ============================================================
    GR8SKUL SPONSOR PORTAL
    ============================================================
*/


const SUPABASE_URL =
    "https://rijzolipyabfggrrhgab.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm";


const AUTH_STORAGE_KEY =
    "gr8skul-sponsor-auth";


let accessToken = null;


/*
    ============================================================
    DOM
    ============================================================
*/


const authArea =
    document.getElementById(
        "authArea"
    );


const dashboard =
    document.getElementById(
        "dashboard"
    );


const authMessage =
    document.getElementById(
        "authMessage"
    );


/*
    ============================================================
    SUPABASE REQUEST
    ============================================================
*/


async function supabaseRequest(
    endpoint,
    options = {}
) {

    const headers = {

        "apikey":
            SUPABASE_KEY,

        "Content-Type":
            "application/json"

    };


    if (accessToken) {

        headers["Authorization"] =
            "Bearer " +
            accessToken;

    } else {

        headers["Authorization"] =
            "Bearer " +
            SUPABASE_KEY;

    }


    const response =
        await fetch(
            SUPABASE_URL +
            endpoint,
            {
                ...options,
                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );


    return response;

}


/*
    ============================================================
    PUBLIC TICKER
    ============================================================
*/


async function loadPublicTicker() {

    try {

        const response =
            await supabaseRequest(
                "/rest/v1/rpc/get_public_sponsor_ticker",
                {
                    method: "POST",
                    body: JSON.stringify({})
                }
            );


        if (!response.ok) {

            throw new Error(
                "Public ticker request failed: " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !Array.isArray(result) ||
            result.length === 0
        ) {

            return;

        }


        const data =
            result[0];


        document.getElementById(
            "publicUsers"
        ).textContent =
            Number(
                data.daily_users
            ).toLocaleString();


        document.getElementById(
            "publicSponsors"
        ).textContent =
            Number(
                data.daily_sponsors
            ).toLocaleString();


        document.getElementById(
            "publicExposure"
        ).textContent =
            Number(
                data.average_exposure
            ).toLocaleString(
                undefined,
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );


        document.getElementById(
            "publicClicks"
        ).textContent =
            Number(
                data.daily_clicks
            ).toLocaleString();


    } catch (error) {

        console.error(
            "GR8SKUL public ticker failed.",
            error
        );

    }

}


/*
    ============================================================
    SIGN UP
    ============================================================
*/


async function signUp() {

    authMessage.textContent =
        "Sponsor sign-up will be available soon.";

}


/*
    ============================================================
    SIGN IN
    ============================================================
*/


async function signIn() {

    const email =
        document.getElementById(
            "signInEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "signInPassword"
        ).value;


    if (!email || !password) {

        authMessage.textContent =
            "Enter an email and password.";

        return;

    }


    authMessage.textContent =
        "Signing in...";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email:
                                email,

                            password:
                                password
                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error_description ||
                result.msg ||
                result.message ||
                "Sign in failed."
            );

        }


        saveSession(
            result
        );


        authMessage.textContent =
            "";


        await showDashboard();


    } catch (error) {

        authMessage.textContent =
            error.message;

    }

}


/*
    ============================================================
    SAVE SESSION
    ============================================================
*/


function saveSession(
    session
) {

    accessToken =
        session.access_token;


    try {

        localStorage.setItem(
            AUTH_STORAGE_KEY,
            JSON.stringify(
                session
            )
        );

    } catch (error) {

        console.error(
            "GR8SKUL sponsor session could not be saved.",
            error
        );

    }

}


/*
    ============================================================
    LOAD SAVED SESSION
    ============================================================
*/


function loadSavedSession() {

    try {

        const saved =
            localStorage.getItem(
                AUTH_STORAGE_KEY
            );


        if (!saved) {

            return false;

        }


        const session =
            JSON.parse(
                saved
            );


        if (
            !session ||
            !session.access_token
        ) {

            return false;

        }


        accessToken =
            session.access_token;


        return true;


    } catch (error) {

        console.error(
            "GR8SKUL sponsor session could not be loaded.",
            error
        );


        return false;

    }

}


/*
    ============================================================
    DASHBOARD
    ============================================================
*/


async function showDashboard() {

    authArea.style.display =
        "none";


    dashboard.style.display =
        "block";


    await loadDashboard();


    setDefaultDates();

}


/*
    ============================================================
    LOAD PRIVATE DASHBOARD
    ============================================================
*/


async function loadDashboard() {

    try {

        const response =
            await supabaseRequest(
                "/rest/v1/rpc/get_my_sponsor_dashboard",
                {
                    method: "POST",
                    body: JSON.stringify({})
                }
            );


        if (!response.ok) {

            throw new Error(
                "Sponsor dashboard request failed: " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !Array.isArray(result) ||
            result.length === 0
        ) {

            throw new Error(
                "This login is not connected to a sponsor account."
            );

        }


        const data =
            result[0];


        document.getElementById(
            "sponsorName"
        ).textContent =
            data.sponsor_name;


        document.getElementById(
            "dailyUsers"
        ).textContent =
            Number(
                data.daily_users
            ).toLocaleString();


        document.getElementById(
            "dailyImpressions"
        ).textContent =
            Number(
                data.daily_impressions
            ).toLocaleString();


        document.getElementById(
            "dailyClicks"
        ).textContent =
            Number(
                data.daily_clicks
            ).toLocaleString();


        document.getElementById(
            "dailyCtr"
        ).textContent =
            Number(
                data.daily_ctr_percent
            ).toFixed(2) +
            "%";


        document.getElementById(
            "dashboardDate"
        ).textContent =
            formatDate(
                data.report_date
            );


    } catch (error) {

        console.error(
            "GR8SKUL sponsor dashboard failed.",
            error
        );


        document.getElementById(
            "sponsorName"
        ).textContent =
            "SPONSOR ACCOUNT";


        document.getElementById(
            "dashboardDate"
        ).textContent =
            error.message;

    }

}


/*
    ============================================================
    DEFAULT DATES
    ============================================================
*/


function setDefaultDates() {

    const today =
        new Date();


    const todayString =
        today.toISOString()
            .split("T")[0];


    document.getElementById(
        "startDate"
    ).value =
        todayString;


    document.getElementById(
        "endDate"
    ).value =
        todayString;

}


/*
    ============================================================
    CAMPAIGN REPORT
    ============================================================
*/


async function loadCampaignReport() {

    const startDate =
        document.getElementById(
            "startDate"
        ).value;


    const endDate =
        document.getElementById(
            "endDate"
        ).value;


    if (!startDate || !endDate) {

        return;

    }


    if (startDate > endDate) {

        alert(
            "The start date must be before the end date."
        );

        return;

    }


    try {

        const response =
            await supabaseRequest(
                "/rest/v1/rpc/get_my_sponsor_campaign_summary",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            p_start_date:
                                startDate,

                            p_end_date:
                                endDate
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Campaign report request failed: " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !Array.isArray(result) ||
            result.length === 0
        ) {

            throw new Error(
                "No campaign data found."
            );

        }


        const summary =
            result[0];


        document.getElementById(
            "reportSummary"
        ).style.display =
            "block";


        document.getElementById(
            "reportSponsor"
        ).textContent =
            summary.sponsor_name;


        document.getElementById(
            "reportDays"
        ).textContent =
            Number(
                summary.days_active
            ).toLocaleString();


        document.getElementById(
            "reportImpressions"
        ).textContent =
            Number(
                summary.impressions
            ).toLocaleString();


        document.getElementById(
            "reportClicks"
        ).textContent =
            Number(
                summary.clicks
            ).toLocaleString();


        document.getElementById(
            "reportCtr"
        ).textContent =
            Number(
                summary.ctr_percent
            ).toFixed(2) +
            "%";


        await loadDailyHistory(
            startDate,
            endDate
        );


    } catch (error) {

        console.error(
            "GR8SKUL campaign report failed.",
            error
        );


        alert(
            error.message
        );

    }

}


/*
    ============================================================
    DAILY HISTORY
    ============================================================
*/


async function loadDailyHistory(
    startDate,
    endDate
) {

    try {

        const response =
            await supabaseRequest(
                "/rest/v1/rpc/get_my_sponsor_report",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            p_start_date:
                                startDate,

                            p_end_date:
                                endDate
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Daily report request failed: " +
                response.status
            );

        }


        const result =
            await response.json();


        const historyRows =
            document.getElementById(
                "historyRows"
            );


        historyRows.innerHTML =
            "";


        document.getElementById(
            "dailyHistory"
        ).style.display =
            "block";


        if (
            !Array.isArray(result) ||
            result.length === 0
        ) {

            historyRows.innerHTML =
                "<div style='padding:15px 0; color:#888; font-size:11px;'>No activity for this period.</div>";

            return;

        }


        result.forEach(
            function(day) {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "history-row";


                row.innerHTML =

                    "<div>" +
                    formatDate(
                        day.report_date
                    ) +
                    "</div>" +

                    "<div>" +
                    Number(
                        day.impressions
                    ).toLocaleString() +
                    "</div>" +

                    "<div>" +
                    Number(
                        day.clicks
                    ).toLocaleString() +
                    "</div>" +

                    "<div>" +
                    Number(
                        day.ctr_percent
                    ).toFixed(2) +
                    "%" +
                    "</div>";


                historyRows.appendChild(
                    row
                );

            }
        );


    } catch (error) {

        console.error(
            "GR8SKUL daily history failed.",
            error
        );

    }

}

/*
    ============================================================
    DATE FORMATTING
    ============================================================
*/


function formatDate(
    dateString
) {

    if (!dateString) {

        return "";

    }


    const parts =
        dateString.split(
            "-"
        );


    if (
        parts.length !== 3
    ) {

        return dateString;

    }


    return (
        parts[1] +
        "/" +
        parts[2] +
        "/" +
        parts[0]
    );

}
