<script>

/* =============================================================
   GR8SKUL ARTIST AUTHENTICATION
   ============================================================= */

const SUPABASE_URL =
    "https://rijzolipyabfggrrhgab.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm";

const AUTH_STORAGE_KEY =
    "gr8skul-artist-auth";

const ARTIST_WORKS_PAGE =
    "/upload.html";

let accessToken = null;


/* =============================================================
   ELEMENTS
   ============================================================= */

const authSection =
    document.getElementById("authSection");

const authMessage =
    document.getElementById("authMessage");

const dashboard =
    document.getElementById("dashboard");

const dashboardName =
    document.getElementById("dashboardName");

const passwordResetArea =
    document.getElementById("passwordResetArea");

const passwordResetMessage =
    document.getElementById("passwordResetMessage");


/* =============================================================
   BASIC SUPABASE REQUEST
   ============================================================= */

async function supabaseRequest(
    path,
    options = {}
) {

    const headers = {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    const response = await fetch(
        SUPABASE_URL + path,
        {
            ...options,
            headers
        }
    );

    let result = null;

    try {
        result = await response.json();
    } catch (error) {
        result = null;
    }

    return {
        response,
        result
    };
}


/* =============================================================
   SAVE SESSION
   ============================================================= */

function saveSession(session) {

    if (!session || !session.access_token) {
        return;
    }

    accessToken =
        session.access_token;

    localStorage.setItem(
        AUTH_STORAGE_KEY,
        JSON.stringify(session)
    );
}


/* =============================================================
   LOAD SAVED SESSION
   ============================================================= */

function loadSavedSession() {

    const saved =
        localStorage.getItem(
            AUTH_STORAGE_KEY
        );

    if (!saved) {
        return false;
    }

    try {

        const session =
            JSON.parse(saved);

        if (
            session &&
            session.access_token
        ) {

            accessToken =
                session.access_token;

            showDashboard();

            return true;
        }

    } catch (error) {

        console.error(
            "GR8SKUL saved artist session error:",
            error
        );

        localStorage.removeItem(
            AUTH_STORAGE_KEY
        );
    }

    return false;
}


/* =============================================================
   CURRENT USER
   ============================================================= */

async function getCurrentUser() {

    if (!accessToken) {
        return null;
    }

    const {
        response,
        result
    } = await supabaseRequest(
        "/auth/v1/user",
        {
            method: "GET",
            headers: {
                "Authorization":
                    "Bearer " + accessToken
            }
        }
    );

    if (!response.ok) {

        console.error(
            "GR8SKUL CURRENT USER RESPONSE:",
            response.status,
            result
        );

        return null;
    }

    return result;
}


/* =============================================================
   CURRENT ARTIST
   ============================================================= */

async function getCurrentArtist() {

    const user =
        await getCurrentUser();

    if (!user || !user.id) {
        return null;
    }

    const {
        response,
        result
    } = await supabaseRequest(
        "/rest/v1/gr8skul_artists" +
        "?select=id,user_id,username,display_name,active" +
        "&user_id=eq." +
        encodeURIComponent(user.id),
        {
            method: "GET",
            headers: {
                "Authorization":
                    "Bearer " + accessToken
            }
        }
    );

    console.log(
        "GR8SKUL ARTIST PROFILE RESPONSE:",
        response.status,
        result
    );

    if (!response.ok) {
        return null;
    }

    if (
        Array.isArray(result) &&
        result.length > 0
    ) {
        return result[0];
    }

    return null;
}


/* =============================================================
   CREATE ARTIST RECORD
   ============================================================= */

async function createArtistRecord(
    username,
    displayName
) {

    if (!accessToken) {

        throw new Error(
            "No artist authentication session."
        );
    }

    const {
        response,
        result
    } = await supabaseRequest(
        "/functions/v1/create-artist",
        {
            method: "POST",
            headers: {
                "Authorization":
                    "Bearer " + accessToken
            },
            body: JSON.stringify({
                username: username,
                displayName: displayName
            })
        }
    );

    console.log(
        "GR8SKUL CREATE ARTIST RESPONSE:",
        response.status,
        result
    );

    if (!response.ok) {

        throw new Error(
            result?.error ||
            result?.message ||
            "Unable to create artist account."
        );
    }

    return result;
}


/* =============================================================
   SIGN UP
   ============================================================= */

async function signUp() {

    authMessage.textContent = "";

    const username =
        document
            .getElementById("signUpUsername")
            .value
            .trim();

    const displayName =
        document
            .getElementById("signUpDisplayName")
            .value
            .trim();

    const email =
        document
            .getElementById("signUpEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("signUpPassword")
            .value;


    if (
        !/^[a-zA-Z0-9._-]{3,40}$/.test(username)
    ) {

        authMessage.textContent =
            "Username must be 3–40 characters and may contain letters, numbers, periods, underscores, and hyphens.";

        return;
    }


    if (
        !displayName ||
        displayName.length > 90
    ) {

        authMessage.textContent =
            "Please enter a display name.";

        return;
    }


    if (!email) {

        authMessage.textContent =
            "Please enter your email address.";

        return;
    }


    if (password.length < 6) {

        authMessage.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    const button =
        document.getElementById(
            "signUpButton"
        );

    button.disabled = true;

    button.textContent =
        "CREATING ACCOUNT...";


    try {

        const {
            response,
            result
        } = await supabaseRequest(
            "/auth/v1/signup",
            {
                method: "POST",
                body: JSON.stringify({
                    email: email,
                    password: password,
                    data: {
                        account_type: "artist",
                        username: username,
                        display_name: displayName
                    }
                })
            }
        );


        console.log(
            "GR8SKUL ARTIST SIGN UP RESPONSE:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result?.msg ||
                result?.message ||
                result?.error_description ||
                result?.error ||
                "Unable to create account."
            );
        }


        /*
         * If email confirmation is disabled,
         * Supabase returns a session immediately.
         */

        if (result?.access_token) {

            saveSession(result);

            await createArtistRecord(
                username,
                displayName
            );

            window.location.href =
                ARTIST_WORKS_PAGE;

            return;
        }


        /*
         * Email confirmation is enabled.
         */

        authMessage.textContent =
            "Account created. Check your email to confirm your account, then sign in.";

        document
            .getElementById("signUpPassword")
            .value = "";


    } catch (error) {

        console.error(
            "GR8SKUL artist sign up failed:",
            error
        );

        authMessage.textContent =
            error.message ||
            "Unable to create artist account.";

    } finally {

        button.disabled = false;

        button.textContent =
            "CREATE ARTIST ACCOUNT";
    }
}


/* =============================================================
   SIGN IN
   ============================================================= */

async function signIn() {

    authMessage.textContent = "";

    const email =
        document
            .getElementById("signInEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("signInPassword")
            .value;


    if (!email || !password) {

        authMessage.textContent =
            "Enter your email and password.";

        return;
    }


    const button =
        document.getElementById(
            "signInButton"
        );

    button.disabled = true;

    button.textContent =
        "SIGNING IN...";


    try {

        /*
         * Authenticate with Supabase.
         */

        const {
            response,
            result
        } = await supabaseRequest(
            "/auth/v1/token?grant_type=password",
            {
                method: "POST",
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );


        console.log(
            "GR8SKUL ARTIST SIGN IN RESPONSE:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result?.msg ||
                result?.message ||
                result?.error_description ||
                "Invalid login credentials."
            );
        }


        if (!result?.access_token) {

            throw new Error(
                "Sign-in succeeded but no access token was returned."
            );
        }


        saveSession(result);


        /*
         * Get the actual authenticated user.
         */

        const user =
            await getCurrentUser();


        if (!user) {

            throw new Error(
                "Unable to retrieve the authenticated artist."
            );
        }


        /*
         * Check whether the permanent Artist
         * record already exists.
         */

        const artist =
            await getCurrentArtist();


        if (artist) {

            window.location.href =
                ARTIST_WORKS_PAGE;

            return;
        }


        /*
         * Artist Auth account exists but the
         * permanent Artist record does not.
         *
         * Pull the original signup metadata
         * and create the Artist record.
         */

        const metadata =
            user.user_metadata || {};

        const username =
            metadata.username;

        const displayName =
            metadata.display_name;


        if (!username || !displayName) {

            throw new Error(
                "Artist account metadata is missing username or display name."
            );
        }


        await createArtistRecord(
            username,
            displayName
        );


        /*
         * Artist record now exists.
         */

        window.location.href =
            ARTIST_WORKS_PAGE;


    } catch (error) {

        console.error(
            "GR8SKUL artist sign in failed.",
            error
        );

        authMessage.textContent =
            error.message ||
            "Unable to sign in.";

    } finally {

        button.disabled = false;

        button.textContent =
            "SIGN IN";
    }
}


/* =============================================================
   PASSWORD RECOVERY — REQUEST EMAIL
   ============================================================= */

async function requestPasswordReset() {

    authMessage.textContent = "";

    const email =
        document
            .getElementById("signInEmail")
            .value
            .trim();


    if (!email) {

        authMessage.textContent =
            "Enter your email address first.";

        return;
    }


    const link =
        document.getElementById(
            "forgotPasswordLink"
        );

    link.style.pointerEvents =
        "none";

    link.textContent =
        "Sending reset email...";


    try {

        const {
            response,
            result
        } = await supabaseRequest(
            "/auth/v1/recover",
            {
                method: "POST",
                body: JSON.stringify({
                    email: email,
                    redirect_to:
                        "https://gr8skul.com/artist.html"
                })
            }
        );


        console.log(
            "GR8SKUL PASSWORD RECOVERY RESPONSE:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result?.msg ||
                result?.message ||
                result?.error_description ||
                "Unable to send password reset email."
            );
        }


        authMessage.textContent =
            "Password reset email sent. Check your email and follow the reset link.";


    } catch (error) {

        console.error(
            "GR8SKUL password recovery failed:",
            error
        );

        authMessage.textContent =
            error.message ||
            "Unable to send password reset email.";

    } finally {

        link.style.pointerEvents =
            "";

        link.textContent =
            "Forgot your password?";
    }
}


/* =============================================================
   PASSWORD RECOVERY — HANDLE RESET LINK
   ============================================================= */

async function handlePasswordRecovery() {

    /*
     * Supabase's recovery link returns the session
     * information in the URL hash when using the
     * implicit authentication flow.
     */

    const hash =
        window.location.hash.substring(1);

    if (!hash) {
        return false;
    }


    const params =
        new URLSearchParams(hash);

    const type =
        params.get("type");

    const recoveryAccessToken =
        params.get("access_token");

    const recoveryRefreshToken =
        params.get("refresh_token");


    if (
        type !== "recovery" ||
        !recoveryAccessToken
    ) {
        return false;
    }


    /*
     * Store the recovery session.
     */

    accessToken =
        recoveryAccessToken;


    const recoverySession = {
        access_token:
            recoveryAccessToken,
        refresh_token:
            recoveryRefreshToken || "",
        token_type:
            params.get("token_type") || "bearer",
        expires_in:
            Number(params.get("expires_in") || 3600),
        expires_at:
            Math.floor(Date.now() / 1000) +
            Number(params.get("expires_in") || 3600)
    };


    saveSession(
        recoverySession
    );


    /*
     * Show the password-reset form.
     */

    authSection.style.display =
        "block";

    passwordResetArea.style.display =
        "block";

    passwordResetMessage.textContent =
        "Enter your new password below.";


    /*
     * Hide the normal authentication
     * controls while the user resets.
     */

    const authChildren =
        authSection.children;

    for (
        let i = 0;
        i < authChildren.length;
        i++
    ) {

        const child =
            authChildren[i];

        if (
            child.id !==
            "passwordResetArea"
        ) {
            child.style.display =
                "none";
        }
    }


    /*
     * Remove tokens from the visible URL.
     */

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );


    return true;
}


/* =============================================================
   UPDATE PASSWORD
   ============================================================= */

async function updatePassword() {

    passwordResetMessage.textContent = "";

    const newPassword =
        document
            .getElementById("newPassword")
            .value;

    const confirmPassword =
        document
            .getElementById("confirmNewPassword")
            .value;


    if (newPassword.length < 6) {

        passwordResetMessage.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    if (
        newPassword !==
        confirmPassword
    ) {

        passwordResetMessage.textContent =
            "Passwords do not match.";

        return;
    }


    if (!accessToken) {

        passwordResetMessage.textContent =
            "Password reset session is missing or expired. Request a new reset email.";

        return;
    }


    const button =
        document.getElementById(
            "updatePasswordButton"
        );

    button.disabled = true;

    button.textContent =
        "UPDATING...";


    try {

        const {
            response,
            result
        } = await supabaseRequest(
            "/auth/v1/user",
            {
                method: "PUT",
                headers: {
                    "Authorization":
                        "Bearer " + accessToken
                },
                body: JSON.stringify({
                    password:
                        newPassword
                })
            }
        );


        console.log(
            "GR8SKUL UPDATE PASSWORD RESPONSE:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result?.msg ||
                result?.message ||
                result?.error_description ||
                result?.error ||
                "Unable to update password."
            );
        }


        /*
         * Password has been changed.
         *
         * Make sure the permanent Artist record
         * exists. The +test2 account already has
         * the username/display_name metadata.
         */

        const user =
            result?.user ||
            await getCurrentUser();


        if (!user) {

            throw new Error(
                "Password was updated, but the artist account could not be retrieved."
            );
        }


        let artist =
            await getCurrentArtist();


        /*
         * If the Artist record does not exist,
         * create it now.
         */

        if (!artist) {

            const metadata =
                user.user_metadata || {};

            const username =
                metadata.username;

            const displayName =
                metadata.display_name;


            if (
                !username ||
                !displayName
            ) {

                throw new Error(
                    "Artist account metadata is missing username or display name."
                );
            }


            await createArtistRecord(
                username,
                displayName
            );


            artist =
                await getCurrentArtist();
        }


        passwordResetMessage.textContent =
            "Password updated. Redirecting to your Works...";


        /*
         * Give the message a moment to display.
         */

        setTimeout(
            function() {

                window.location.href =
                    ARTIST_WORKS_PAGE;

            },
            700
        );


    } catch (error) {

        console.error(
            "GR8SKUL password update failed:",
            error
        );

        passwordResetMessage.textContent =
            error.message ||
            "Unable to update password.";

    } finally {

        button.disabled = false;

        button.textContent =
            "UPDATE PASSWORD";
    }
}


/* =============================================================
   SHOW DASHBOARD
   ============================================================= */

async function showDashboard() {

    const artist =
        await getCurrentArtist();


    if (!artist) {

        /*
         * We have a Supabase session but no
         * permanent Artist record.
         *
         * Leave the normal sign-in screen visible.
         */

        return;
    }


    authSection.style.display =
        "none";

    dashboard.style.display =
        "block";


    dashboardName.textContent =
        artist.username ||
        artist.display_name ||
        "ARTIST";
}


/* =============================================================
   SIGN OUT
   ============================================================= */

async function signOut() {

    try {

        if (accessToken) {

            await supabaseRequest(
                "/auth/v1/logout",
                {
                    method: "POST",
                    headers: {
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );
        }

    } catch (error) {

        console.error(
            "GR8SKUL artist sign out error:",
            error
        );

    } finally {

        accessToken = null;

        localStorage.removeItem(
            AUTH_STORAGE_KEY
        );

        window.location.href =
            "/artist.html";
    }
}


/* =============================================================
   BUTTON EVENTS
   ============================================================= */

document
    .getElementById("signInButton")
    .addEventListener(
        "click",
        signIn
    );


document
    .getElementById("signUpButton")
    .addEventListener(
        "click",
        signUp
    );


document
    .getElementById("forgotPasswordLink")
    .addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            requestPasswordReset();
        }
    );


document
    .getElementById("updatePasswordButton")
    .addEventListener(
        "click",
        updatePassword
    );


document
    .getElementById("worksButton")
    .addEventListener(
        "click",
        function() {

            window.location.href =
                ARTIST_WORKS_PAGE;
        }
    );


document
    .getElementById("signOutButton")
    .addEventListener(
        "click",
        signOut
    );


/* =============================================================
   ENTER KEY SUPPORT
   ============================================================= */

document
    .getElementById("signInPassword")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                signIn();
            }
        }
    );


document
    .getElementById("signUpPassword")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                signUp();
            }
        }
    );


document
    .getElementById("confirmNewPassword")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                updatePassword();
            }
        }
    );


/* =============================================================
   STARTUP
   ============================================================= */

(async function() {

    /*
     * First check whether this page was opened
     * from a Supabase password-recovery link.
     */

    const recovery =
        await handlePasswordRecovery();

    if (recovery) {
        return;
    }


    /*
     * Otherwise load a normal saved artist session.
     */

    const hasSavedSession =
        loadSavedSession();

    if (!hasSavedSession) {
        return;
    }


    /*
     * Verify that the saved session still
     * corresponds to an actual Artist record.
     */

    const artist =
        await getCurrentArtist();

    if (!artist) {

        /*
         * Do not leave a stale session sitting
         * around if the Artist record does not exist.
         */

        accessToken = null;

        localStorage.removeItem(
            AUTH_STORAGE_KEY
        );

        dashboard.style.display =
            "none";

        authSection.style.display =
            "block";

        return;
    }


    authSection.style.display =
        "none";

    dashboard.style.display =
        "block";

    dashboardName.textContent =
        artist.username ||
        artist.display_name ||
        "ARTIST";

})();

</script>
