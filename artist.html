<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://rijzolipyabfggrrhgab.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm";

const ARTIST_WORKS_PAGE =
    "/upload.html";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
   ========================================================= */

const authSection =
    document.getElementById(
        "authSection"
    );

const authMessage =
    document.getElementById(
        "authMessage"
    );

const dashboard =
    document.getElementById(
        "dashboard"
    );

const dashboardName =
    document.getElementById(
        "dashboardName"
    );

const passwordResetArea =
    document.getElementById(
        "passwordResetArea"
    );

const passwordResetMessage =
    document.getElementById(
        "passwordResetMessage"
    );


/* =========================================================
   GET CURRENT ARTIST
   ========================================================= */

async function getCurrentArtist() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        return null;

    }


    const result =
        await supabaseClient
            .from("gr8skul_artists")
            .select(
                "id,user_id,username,display_name,active"
            )
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();


    console.log(
        "GR8SKUL ARTIST PROFILE RESPONSE:",
        result
    );


    if (result.error) {

        console.error(
            "GR8SKUL ARTIST PROFILE ERROR:",
            result.error
        );

        return null;

    }


    return result.data || null;

}


/* =========================================================
   CREATE ARTIST RECORD
   ========================================================= */

async function createArtistRecord(
    username,
    displayName
) {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (
        !session ||
        !session.access_token
    ) {

        throw new Error(
            "No artist authentication session."
        );

    }


    const response =
        await fetch(
            SUPABASE_URL +
            "/functions/v1/create-artist",
            {
                method:
                    "POST",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        session.access_token,

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        username:
                            username,

                        displayName:
                            displayName
                    })
            }
        );


    let result = null;

    try {

        result =
            await response.json();

    } catch (error) {

        result = null;

    }


    console.log(
        "GR8SKUL CREATE ARTIST RESPONSE:",
        response.status,
        result
    );


    if (!response.ok) {

        throw new Error(
            result?.error ||
            result?.message ||
            "Unable to create artist account."
        );

    }


    return result;

}


/* =========================================================
   SHOW DASHBOARD
   ========================================================= */

async function showDashboard() {

    const artist =
        await getCurrentArtist();


    if (!artist) {

        authSection.style.display =
            "block";

        dashboard.style.display =
            "none";

        return false;

    }


    authSection.style.display =
        "none";

    dashboard.style.display =
        "block";


    dashboardName.textContent =
        artist.username ||
        artist.display_name ||
        "ARTIST";


    return true;

}


/* =========================================================
   SIGN UP
   ========================================================= */

async function signUp() {

    authMessage.textContent =
        "";


    const username =
        document
            .getElementById(
                "signUpUsername"
            )
            .value
            .trim();


    const displayName =
        document
            .getElementById(
                "signUpDisplayName"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "signUpEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "signUpPassword"
            )
            .value;


    if (
        !/^[a-zA-Z0-9._-]{3,40}$/.test(
            username
        )
    ) {

        authMessage.textContent =
            "Username must be 3–40 characters and may contain letters, numbers, periods, underscores, and hyphens.";

        return;

    }


    if (
        !displayName ||
        displayName.length > 90
    ) {

        authMessage.textContent =
            "Please enter a display name.";

        return;

    }


    if (!email) {

        authMessage.textContent =
            "Please enter your email address.";

        return;

    }


    if (password.length < 6) {

        authMessage.textContent =
            "Password must be at least 6 characters.";

        return;

    }


    const button =
        document.getElementById(
            "signUpButton"
        );


    button.disabled =
        true;

    button.textContent =
        "CREATING ACCOUNT...";


    try {

        const result =
            await supabaseClient.auth.signUp(
                {
                    email:
                        email,

                    password:
                        password,

                    options: {
                        data: {
                            account_type:
                                "artist",

                            username:
                                username,

                            display_name:
                                displayName
                        }
                    }
                }
            );


        console.log(
            "GR8SKUL ARTIST SIGN UP RESPONSE:",
            result
        );


        if (result.error) {

            throw result.error;

        }


        /*
         * If Supabase returned a session,
         * email confirmation is disabled.
         */

        if (
            result.data &&
            result.data.session
        ) {

            await createArtistRecord(
                username,
                displayName
            );


            window.location.href =
                ARTIST_WORKS_PAGE;

            return;

        }


        /*
         * If no session was returned,
         * email confirmation is required.
         */

        authMessage.textContent =
            "Account created. Check your email to confirm your account, then sign in.";

        document
            .getElementById(
                "signUpPassword"
            )
            .value = "";


    } catch (error) {

        console.error(
            "GR8SKUL artist sign up failed:",
            error
        );


        authMessage.textContent =
            error.message ||
            "Unable to create artist account.";

    } finally {

        button.disabled =
            false;

        button.textContent =
            "CREATE ARTIST ACCOUNT";

    }

}


/* =========================================================
   SIGN IN
   ========================================================= */

async function signIn() {

    authMessage.textContent =
        "";


    const email =
        document
            .getElementById(
                "signInEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "signInPassword"
            )
            .value;


    if (
        !email ||
        !password
    ) {

        authMessage.textContent =
            "Enter your email and password.";

        return;

    }


    const button =
        document.getElementById(
            "signInButton"
        );


    button.disabled =
        true;

    button.textContent =
        "SIGNING IN...";


    try {

        /*
         * IMPORTANT:
         *
         * This uses the exact same Supabase
         * Auth client/session mechanism as
         * upload.html.
         */

        const result =
            await supabaseClient.auth.signInWithPassword(
                {
                    email:
                        email,

                    password:
                        password
                }
            );


        console.log(
            "GR8SKUL ARTIST SIGN IN RESPONSE:",
            result
        );


        if (result.error) {

            throw result.error;

        }


        const session =
            result.data &&
            result.data.session
                ? result.data.session
                : null;


        if (!session) {

            throw new Error(
                "Sign-in succeeded but no authentication session was returned."
            );

        }


        /*
         * Check for the permanent Artist record.
         */

        let artist =
            await getCurrentArtist();


        /*
         * If Auth exists but the Artist record
         * doesn't, create it from the Auth metadata.
         */

        if (!artist) {

            const user =
                result.data.user;


            const metadata =
                user?.user_metadata || {};


            const username =
                metadata.username;


            const displayName =
                metadata.display_name;


            if (
                !username ||
                !displayName
            ) {

                throw new Error(
                    "Artist account metadata is missing username or display name."
                );

            }


            await createArtistRecord(
                username,
                displayName
            );


            artist =
                await getCurrentArtist();

        }


        if (!artist) {

            throw new Error(
                "Artist account was authenticated, but the Artist record could not be loaded."
            );

        }


        /*
         * The Supabase client has now stored the
         * same session that upload.html reads.
         */

        window.location.href =
            ARTIST_WORKS_PAGE;


    } catch (error) {

        console.error(
            "GR8SKUL artist sign in failed:",
            error
        );


        authMessage.textContent =
            error.message ||
            "Unable to sign in.";

    } finally {

        button.disabled =
            false;

        button.textContent =
            "SIGN IN";

    }

}


/* =========================================================
   PASSWORD RESET — SEND EMAIL
   ========================================================= */

async function requestPasswordReset() {

    authMessage.textContent =
        "";


    const email =
        document
            .getElementById(
                "signInEmail"
            )
            .value
            .trim();


    if (!email) {

        authMessage.textContent =
            "Enter your email address first.";

        return;

    }


    const link =
        document.getElementById(
            "forgotPasswordLink"
        );


    link.style.pointerEvents =
        "none";

    link.textContent =
        "Sending reset email...";


    try {

        const result =
            await supabaseClient.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        "https://gr8skul.com/artist.html"
                }
            );


        console.log(
            "GR8SKUL PASSWORD RECOVERY RESPONSE:",
            result
        );


        if (result.error) {

            throw result.error;

        }


        authMessage.textContent =
            "Password reset email sent. Check your email and follow the reset link.";


    } catch (error) {

        console.error(
            "GR8SKUL password recovery failed:",
            error
        );


        authMessage.textContent =
            error.message ||
            "Unable to send password reset email.";

    } finally {

        link.style.pointerEvents =
            "";

        link.textContent =
            "Forgot your password?";

    }

}


/* =========================================================
   PASSWORD RESET — HANDLE RECOVERY
   ========================================================= */

async function handlePasswordRecovery() {

    /*
     * Supabase JS handles the recovery session
     * from the URL.
     *
     * We only need to detect whether this page
     * was opened as part of a password recovery.
     */

    const hash =
        window.location.hash.substring(1);


    if (!hash) {

        return false;

    }


    const params =
        new URLSearchParams(hash);


    const type =
        params.get("type");


    if (
        type !== "recovery"
    ) {

        return false;

    }


    passwordResetArea.style.display =
        "block";


    authMessage.textContent =
        "";


    passwordResetMessage.textContent =
        "Enter your new password below.";


    /*
     * Hide normal authentication controls.
     */

    const authChildren =
        authSection.children;


    for (
        let i = 0;
        i < authChildren.length;
        i++
    ) {

        const child =
            authChildren[i];


        if (
            child.id !==
            "passwordResetArea"
        ) {

            child.style.display =
                "none";

        }

    }


    /*
     * Remove the authentication tokens
     * from the visible URL.
     */

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );


    return true;

}


/* =========================================================
   UPDATE PASSWORD
   ========================================================= */

async function updatePassword() {

    passwordResetMessage.textContent =
        "";


    const newPassword =
        document
            .getElementById(
                "newPassword"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmNewPassword"
            )
            .value;


    if (
        newPassword.length < 6
    ) {

        passwordResetMessage.textContent =
            "Password must be at least 6 characters.";

        return;

    }


    if (
        newPassword !==
        confirmPassword
    ) {

        passwordResetMessage.textContent =
            "Passwords do not match.";

        return;

    }


    const button =
        document.getElementById(
            "updatePasswordButton"
        );


    button.disabled =
        true;

    button.textContent =
        "UPDATING...";


    try {

        /*
         * Supabase JS uses the recovery session
         * automatically.
         */

        const result =
            await supabaseClient.auth.updateUser(
                {
                    password:
                        newPassword
                }
            );


        console.log(
            "GR8SKUL UPDATE PASSWORD RESPONSE:",
            result
        );


        if (result.error) {

            throw result.error;

        }


        /*
         * Make sure the permanent Artist record
         * exists after recovery.
         */

        let artist =
            await getCurrentArtist();


        if (!artist) {

            const user =
                result.data?.user ||
                (
                    await supabaseClient.auth.getUser()
                ).data.user;


            const metadata =
                user?.user_metadata || {};


            const username =
                metadata.username;


            const displayName =
                metadata.display_name;


            if (
                !username ||
                !displayName
            ) {

                throw new Error(
                    "Password was updated, but Artist account metadata is missing."
                );

            }


            await createArtistRecord(
                username,
                displayName
            );

        }


        passwordResetMessage.textContent =
            "Password updated. Redirecting to your Works...";


        setTimeout(
            function() {

                window.location.href =
                    ARTIST_WORKS_PAGE;

            },
            700
        );


    } catch (error) {

        console.error(
            "GR8SKUL password update failed:",
            error
        );


        passwordResetMessage.textContent =
            error.message ||
            "Unable to update password.";

    } finally {

        button.disabled =
            false;

        button.textContent =
            "UPDATE PASSWORD";

    }

}


/* =========================================================
   SIGN OUT
   ========================================================= */

async function signOut() {

    try {

        await supabaseClient.auth.signOut();

    } catch (error) {

        console.error(
            "GR8SKUL artist sign out failed:",
            error
        );

    }


    window.location.href =
        "/artist.html";

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

document
    .getElementById(
        "signInButton"
    )
    .addEventListener(
        "click",
        signIn
    );


document
    .getElementById(
        "signUpButton"
    )
    .addEventListener(
        "click",
        signUp
    );


document
    .getElementById(
        "forgotPasswordLink"
    )
    .addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            requestPasswordReset();

        }
    );


document
    .getElementById(
        "updatePasswordButton"
    )
    .addEventListener(
        "click",
        updatePassword
    );


document
    .getElementById(
        "worksButton"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                ARTIST_WORKS_PAGE;

        }
    );


document
    .getElementById(
        "signOutButton"
    )
    .addEventListener(
        "click",
        signOut
    );


/* =========================================================
   ENTER KEY SUPPORT
   ========================================================= */

document
    .getElementById(
        "signInPassword"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                signIn();

            }

        }
    );


document
    .getElementById(
        "signUpPassword"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                signUp();

            }

        }
    );


document
    .getElementById(
        "confirmNewPassword"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                updatePassword();

            }

        }
    );


/* =========================================================
   AUTH STATE
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
    async function(
        event,
        session
    ) {

        console.log(
            "GR8SKUL ARTIST AUTH EVENT:",
            event
        );


        /*
         * Do not redirect on every auth event.
         * The explicit sign-in function handles
         * the redirect to Works.
         */

    }
);


/* =========================================================
   STARTUP
   ========================================================= */

(async function() {

    /*
     * First check for a password-recovery link.
     */

    const recovery =
        await handlePasswordRecovery();


    if (recovery) {

        return;

    }


    /*
     * Check whether Supabase already has a
     * valid authenticated session.
     */

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        return;

    }


    /*
     * If already signed in, verify the Artist
     * record and show the dashboard.
     */

    const artist =
        await getCurrentArtist();


    if (!artist) {

        /*
         * Auth exists but Artist record does not.
         * Leave the login screen available.
         */

        return;

    }


    authSection.style.display =
        "none";

    dashboard.style.display =
        "block";

    dashboardName.textContent =
        artist.username ||
        artist.display_name ||
        "ARTIST";

})();

</script>

</body>
</html>
