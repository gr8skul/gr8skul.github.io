/* =========================

.footer {

<div class="app">

<script>

/*
    ============================================================
    GR8SKUL ARTIST AUTHENTICATION
    ============================================================
*/


const SUPABASE_URL =
    "https://rijzolipyabfggrrhgab.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm";


const AUTH_STORAGE_KEY =
    "gr8skul-artist-auth";


/*
    Artist Works destination.

    We will use the existing Works page for the
    authenticated artist once it has been converted
    to the new artist/work architecture.
*/


const ARTIST_WORKS_PAGE =
    "/upload.html";


let accessToken = null;


/*
    ============================================================
    DOM
    ============================================================
*/


const authMessage =
    document.getElementById(
        "authMessage"
    );


/*
    ============================================================
    SUPABASE REQUEST
    ============================================================
*/


async function supabaseRequest(
    endpoint,
    options = {}
) {

    const headers = {

        "apikey":
            SUPABASE_KEY,

        "Content-Type":
            "application/json"

    };


    if (accessToken) {

        headers["Authorization"] =
            "Bearer " +
            accessToken;

    } else {

        headers["Authorization"] =
            "Bearer " +
            SUPABASE_KEY;

    }


    const response =
        await fetch(
            SUPABASE_URL +
            endpoint,
            {
                ...options,

                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );


    return response;

}


/*
    ============================================================
    SIGN UP
    ============================================================
*/


async function signUp() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();


    const displayName =
        document.getElementById(
            "displayName"
        ).value.trim();


    const email =
        document.getElementById(
            "signUpEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "signUpPassword"
        ).value;


    /*
        ----------------------------
        VALIDATION
        ----------------------------
    */


    if (!username) {

        authMessage.textContent =
            "Enter a username.";

        return;

    }


    if (
        username.length < 3
    ) {

        authMessage.textContent =
            "Your username must be at least 3 characters.";

        return;

    }


    if (
        username.length > 40
    ) {

        authMessage.textContent =
            "Your username must be 40 characters or fewer.";

        return;

    }


    /*
        Keep usernames simple and stable.
    */


    if (
        !/^[a-zA-Z0-9._-]+$/.test(
            username
        )
    ) {

        authMessage.textContent =
            "Username may contain letters, numbers, periods, underscores, and hyphens only.";

        return;

    }


    if (!displayName) {

        authMessage.textContent =
            "Enter your display name.";

        return;

    }


    if (
        displayName.length > 90
    ) {

        authMessage.textContent =
            "Your display name must be 90 characters or fewer.";

        return;

    }


    if (
        !email ||
        !password
    ) {

        authMessage.textContent =
            "Enter an email and create a password.";

        return;

    }


    if (
        password.length < 6
    ) {

        authMessage.textContent =
            "Your password must be at least 6 characters.";

        return;

    }


    authMessage.textContent =
        "Creating artist account...";


    /*
        ========================================================
        CREATE SUPABASE AUTH USER
        ========================================================
    */


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/signup",
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password,

                            data: {

                                account_type:
                                    "artist",

                                username:
                                    username,

                                display_name:
                                    displayName

                            }

                        })

                }
            );


        const result =
            await response.json();


        console.log(
            "GR8SKUL ARTIST SIGNUP RESPONSE:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result.msg ||
                result.message ||
                result.error_description ||
                "Artist account creation failed."
            );

        }


        /*
            ----------------------------------------------------
            If Supabase returns a session immediately,
            we can establish the Artist record.
            ----------------------------------------------------
        */


        if (
            result.access_token
        ) {

            saveSession(
                result
            );


            await createArtistRecord(
                username,
                displayName
            );


            return;

        }


        /*
            ----------------------------------------------------
            Email confirmation is enabled.
            ----------------------------------------------------
        */


        authMessage.textContent =
            "Account created. Check your email to confirm your account, then sign in.";


        document.getElementById(
            "signInEmail"
        ).value =
            email;


        document.getElementById(
            "signInPassword"
        ).value =
            "";


    } catch (error) {

        console.error(
            "GR8SKUL artist signup failed.",
            error
        );


        authMessage.textContent =
            error.message;

    }

}


/*
    ============================================================
    CREATE ARTIST RECORD
    ============================================================
*/


async function createArtistRecord(
username,
displayName
) {


authMessage.textContent =
    "Creating Artist profile...";


try {

    const response =
        await fetch(
            SUPABASE_URL +
            "/functions/v1/create-artist",
            {
                method: "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        username:
                            username,

                        displayName:
                            displayName

                    })

            }
        );


    const result =
        await response.json();


    console.log(
        "GR8SKUL ARTIST PROFILE RESPONSE:",
        response.status,
        result
    );


    if (!response.ok) {

        throw new Error(
            result.error ||
            result.message ||
            "Artist profile creation failed."
        );

    }


    authMessage.textContent =
        "Artist account created.";


    /*
        Give the new Artist account a moment
        to complete before entering Works.
    */

    setTimeout(
        function() {

            showDashboard();

        },
        500
    );


} catch (error) {

    console.error(
        "GR8SKUL Artist profile creation failed.",
        error
    );


    authMessage.textContent =
        error.message;

}


}



    authMessage.textContent =
        "Artist account created. Connecting your Artist profile...";


    /*
        Temporary stop until the backend function
        is created.
    */


    console.log(
        "Artist profile requires backend creation:",
        {
            username,
            displayName
        }
    );


    authMessage.textContent =
        "Artist account created. The Artist profile connection is the next GR8SKUL setup step.";

}


/*
    ============================================================
    SIGN IN
    ============================================================
*/


async function signIn() {

    const email =
        document.getElementById(
            "signInEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "signInPassword"
        ).value;


    if (
        !email ||
        !password
    ) {

        authMessage.textContent =
            "Enter an email and password.";

        return;

    }


    authMessage.textContent =
        "Signing in...";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error_description ||
                result.msg ||
                result.message ||
                "Sign in failed."
            );

        }


        saveSession(
            result
        );


        /*
            Verify that this Auth user actually
            has an Artist record before entering
            the Artist Works area.
        */


        const artist =
            await getCurrentArtist();


        if (!artist) {

            authMessage.textContent =
                "This account does not have an Artist profile.";

            return;

        }


        authMessage.textContent =
            "";


        await showDashboard();


    } catch (error) {

        console.error(
            "GR8SKUL artist sign in failed.",
            error
        );


        authMessage.textContent =
            error.message;

    }

}


/*
    ============================================================
    SAVE SESSION
    ============================================================
*/


function saveSession(
    session
) {

    accessToken =
        session.access_token;


    try {

        localStorage.setItem(
            AUTH_STORAGE_KEY,
            JSON.stringify(
                session
            )
        );

    } catch (error) {

        console.error(
            "GR8SKUL artist session could not be saved.",
            error
        );

    }

}


/*
    ============================================================
    LOAD SAVED SESSION
    ============================================================
*/


function loadSavedSession() {

    try {

        const saved =
            localStorage.getItem(
                AUTH_STORAGE_KEY
            );


        if (!saved) {

            return false;

        }


        const session =
            JSON.parse(
                saved
            );


        if (
            !session ||
            !session.access_token
        ) {

            return false;

        }


        accessToken =
            session.access_token;


        return true;


    } catch (error) {

        console.error(
            "GR8SKUL artist session could not be loaded.",
            error
        );


        return false;

    }

}


/*
    ============================================================
    GET CURRENT ARTIST
    ============================================================
*/


async function getCurrentArtist() {

    if (!accessToken) {

        return null;

    }


    try {

        const response =
            await supabaseRequest(
                "/rest/v1/gr8skul_artists?select=id,user_id,username,display_name,active&user_id=eq." +
                encodeURIComponent(
                    await getCurrentUserId()
                ),
                {
                    method: "GET",

                    headers: {

                        "Accept":
                            "application/json"

                    }
                }
            );


        if (!response.ok) {

            console.error(
                "Artist lookup failed:",
                await response.text()
            );

            return null;

        }


        const artists =
            await response.json();


        if (
            !Array.isArray(artists) ||
            !artists.length
        ) {

            return null;

        }


        const artist =
            artists[0];


        if (
            artist.active === false
        ) {

            authMessage.textContent =
                "This Artist account is currently inactive.";

            return null;

        }


        return artist;


    } catch (error) {

        console.error(
            "Failed to load current Artist:",
            error
        );


        return null;

    }

}


/*
    ============================================================
    GET AUTH USER ID
    ============================================================
*/


async function getCurrentUserId() {

    const response =
        await supabaseRequest(
            "/auth/v1/user",
            {
                method: "GET"
            }
        );


    if (!response.ok) {

        throw new Error(
            "Unable to verify Artist account."
        );

    }


    const user =
        await response.json();


    if (!user.id) {

        throw new Error(
            "Authenticated user ID was not returned."
        );

    }


    return user.id;

}


/*
    ============================================================
    ARTIST WORKS
    ============================================================
*/


async function showDashboard() {

    window.location.href =
        ARTIST_WORKS_PAGE;

}


/*
    ============================================================
    PASSWORD RECOVERY
    ============================================================
*/


document.getElementById(
    "forgotPasswordLink"
).addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        authMessage.textContent =
            "Password recovery will be available soon.";

    }
);


/*
    ============================================================
    BUTTONS
    ============================================================
*/


document.getElementById(
    "signInButton"
).addEventListener(
    "click",
    signIn
);


document.getElementById(
    "signUpButton"
).addEventListener(
    "click",
    signUp
);


/*
    ============================================================
    ENTER KEY — SIGN IN
    ============================================================
*/


document.getElementById(
    "signInPassword"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            signIn();

        }

    }
);


/*
    ============================================================
    START
    ============================================================
*/


if (
    loadSavedSession()
) {

    /*
        Don't automatically redirect here yet.

        The Artist lookup/backend relationship is
        still being established.
    */

}

</script>
