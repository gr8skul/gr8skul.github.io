<!DOCTYPE html>

    <link rel="apple-touch-icon"
          href="https://gr8skul.github.io/gr8skul-icon.PNG">

    <!-- GR8SKUL APP MANIFEST -->
    <link rel="manifest"
          href="https://gr8skul.github.io/manifest.json">


    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
            height: 100%;
        }

        body {
            overflow: hidden;
        }

        .app {
            width: 100%;
            max-width: 700px;
            height: 100vh;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           FIXED HEADER
           ========================= */

        .header {
            flex-shrink: 0;
            background: #ffffff;
            padding-top: 35px;
        }

        h1 {
            margin: 0 0 35px;
            text-align: center;
            font-size: 42px;
            letter-spacing: 6px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            border: 1px solid #111111;
            background: #ffffff;
            color: #111111;
            cursor: pointer;
            font-size: 16px;
            padding: 12px 18px;
            min-height: 46px;
        }

        button:hover {
            background: #eeeeee;
        }

        #playButton {
            min-width: 120px;
            font-weight: bold;
        }

        #backButton,
        #nextButton {
            width: 50px;
            padding: 12px 5px;
            font-size: 24px;
            line-height: 1;
        }

        #shuffleButton.active {
            background: #111111;
            color: #ffffff;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 25px;
            min-height: 24px;
            font-size: 14px;
            color: #555555;
        }

        .header-line {
            border-bottom: 1px solid #cccccc;
        }


        /* =========================
           SCROLLING TRACK AREA
           ========================= */

        .track-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .track {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 90px;
            padding: 12px 0;
            border-bottom: 1px solid #cccccc;
            cursor: pointer;
            user-select: none;
        }

        .track:hover {
            background: #f5f5f5;
        }

        .track.selected {
            background: #eeeeee;
        }

        .track-image {
            width: 65px;
            height: 65px;
            flex-shrink: 0;
            margin-right: 15px;
            background: #dddddd;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 11px;
            color: #777777;
        }

        .track-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info {
            min-width: 0;
            text-align: left;
            flex: 1;
        }

        .track-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .track-artist {
            font-size: 14px;
            color: #666666;
            margin-bottom: 6px;
        }

        .download-link {
            font-size: 11px;
            color: #888888;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .download-link:hover {
            color: #111111;
            text-decoration: underline;
        }


        /* =========================
           FIXED FOOTER
           ========================= */

        .player {
            flex-shrink: 0;
            background: #ffffff;
            padding-top: 20px;
            padding-bottom: 20px;
            width: 100%;
        }

        audio {
            width: 100%;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 500px) {

            .app {
                padding: 0 15px;
            }

            .header {
                padding-top: 25px;
            }

            h1 {
                font-size: 34px;
                letter-spacing: 4px;
            }

            .controls {
                flex-wrap: wrap;
            }

            .track-image {
                width: 55px;
                height: 55px;
            }

            .track {
                min-height: 80px;
            }

        }
    </style>
</head>

<body>

<div class="app">


    <!-- =========================
         FIXED HEADER
         ========================= -->

    <div class="header">

        <h1>gr8skul</h1>


        <div class="controls">

            <button id="backButton"
                    type="button"
                    aria-label="Previous track">
                ←
            </button>

            <button id="playButton"
                    type="button">

            </button>

            <button id="nextButton"
                    type="button"
                    aria-label="Next track">
                →
            </button>

            <button id="shuffleButton"
                    type="button">
                SHUFFLE OFF
            </button>

        </div>


        <div class="now-playing"
             id="nowPlaying">
            Nothing playing
        </div>


        <div class="header-line"></div>

    </div>


    <!-- =========================
         SCROLLING TRACK AREA
         ========================= -->

    <div class="track-list"
         id="trackList">


        <!-- TRACK 1 -->

        <div class="track"
             data-title="aRnt we rich"
             data-artist="gr8skul"
             data-file="https://gr8skul.github.io/Arnt%20We%20Rich%20MP3.mp3"
             data-image="https://gr8skul.github.io/cover%20image.PNG">

            <div class="track-image">
                IMAGE
            </div>

            <div class="track-info">

                <div class="track-title">
                    aRnt we rich
                </div>

                    gr8skul
                </div>

                <a class="download-link"
                   href="https://gr8skul.github.io/Arnt%20We%20Rich%20MP3.mp3"
                   download>
                    DOWNLOAD MP3

        <!-- TRACK 2 -->

             data-image="">

            <div class="track-image">
                IMAGE
            </div>

            <div class="track-info">

                <div class="track-title">
                    Outside Madness (strings)
                </div>

                <div class="track-artist">
                    gr8skul
                </div>

                <a class="download-link"
                   href="https://gr8skul.github.io/Outside%20Madness%20(strings)%20MP3.mp3"
                   download>

                </a>

            </div>

        </div>


        <!-- TRACK 3 -->

        <div class="track"

             data-file="https://gr8skul.github.io/music/track3.mp3"
             data-image="">

            <div class="track-image">

            <div class="track-info">

                <div class="track-title">

                <div class="track-artist">

                </div>

                <a class="download-link"
                   href="https://gr8skul.github.io/music/track3.mp3"
                   download>

                </a>

        <!-- TRACK 4 -->

        <div class="track"
             data-title="Track Four"
             data-artist="gr8skul"
             data-file="https://gr8skul.github.io/music/track4.mp3"
             data-image="">

            <div class="track-image">
                IMAGE
            </div>

            <div class="track-info">

                <div class="track-title">
                    Track Four
                </div>

                <div class="track-artist">
                    gr8skul
                </div>

                <a class="download-link"
                   href="https://gr8skul.github.io/music/track4.mp3"
                   download>
                    DOWNLOAD MP3
                </a>

            </div>

        </div>


        <!-- TRACK 5 -->

        <div class="track"
             data-title="Track Five"
             data-artist="gr8skul"
             data-file="https://gr8skul.github.io/music/track5.mp3"
             data-image="">

            <div class="track-image">
                IMAGE
            </div>

            <div class="track-info">

                <div class="track-title">
                    Track Five
                </div>

                <div class="track-artist">
                    gr8skul
                </div>

                <a class="download-link"
                   href="https://gr8skul.github.io/music/track5.mp3"
                   download>
                    DOWNLOAD MP3
                </a>

            </div>

        </div>


        <!-- TRACK 6 -->

        <div class="track"
             data-title="Track Six"
             data-artist="gr8skul"
             data-file="https://gr8skul.github.io/music/track6.mp3"
             data-image="">

            <div class="track-image">
                IMAGE
            </div>

            <div class="track-info">

                <div class="track-title">
                    Track Six
                </div>

                <div class="track-artist">
                    gr8skul
                </div>

                <a class="download-link"
                   href="https://gr8skul.github.io/music/track6.mp3"
                   download>
                    DOWNLOAD MP3
                </a>

            </div>

        </div>


    </div>


    <!-- =========================
         FIXED FOOTER
         ========================= -->

    <div class="player">

        <audio id="audioPlayer"
               controls
               preload="none"></audio>

    </div>

</div>


<script>

    const tracks =
        Array.from(document.querySelectorAll(".track"));

    const playButton =
        document.getElementById("playButton");

    const backButton =
        document.getElementById("backButton");

    const nextButton =
        document.getElementById("nextButton");

    const shuffleButton =
        document.getElementById("shuffleButton");

    const audioPlayer =
        document.getElementById("audioPlayer");

    const nowPlaying =
        document.getElementById("nowPlaying");

    const trackList =
        document.getElementById("trackList");


    let currentTrack = -1;

    // Shuffle starts OFF.
    let shuffle = false;


    /*
        SHUFFLE SYSTEM

        shuffleQueue contains the tracks
        that have NOT yet been played
        during the current shuffle cycle.

        Every track is placed into the queue
        once and the queue is randomized.

        This guarantees that every available
        track plays once before any track
        repeats.
    */

    let shuffleQueue = [];


    /*
        PLAY HISTORY

        Stores the actual playback order.

        Example:

        8 → 3 → 7 → 2

        History:

        [8, 3, 7]

        Back from 2 goes to 7.
        Back again goes to 3.
        Back again goes to 8.
    */

    let playHistory = [];


    /*
        CREATE A NEW SHUFFLE CYCLE
    */

    function createShuffleQueue() {

        shuffleQueue =
            tracks.map(function(track, index) {
                return index;
            });


        /*
            Fisher-Yates shuffle

            This creates a properly randomized
            order without repeats.
        */

        for (
            let i = shuffleQueue.length - 1;
            i > 0;
            i--
        ) {

            const randomIndex =
                Math.floor(
                    Math.random() * (i + 1)
                );


            const temporary =
                shuffleQueue[i];


            shuffleQueue[i] =
                shuffleQueue[randomIndex];


            shuffleQueue[randomIndex] =
                temporary;

        }

    }


    /*
        GET NEXT SHUFFLE TRACK

        When the queue is empty,
        create a completely new cycle.
    */

    function getNextShuffleTrack() {

        if (shuffleQueue.length === 0) {

            createShuffleQueue();

        }


        /*
            Remove and return the first
            track in the queue.
        */

        return shuffleQueue.shift();

    }


    /*
        LOAD ALL TRACK IMAGES
    */

    tracks.forEach(function(track) {

        const image =
            track.dataset.image;

        const imageBox =
            track.querySelector(".track-image");


        if (image && image.trim() !== "") {

            const img =
                document.createElement("img");


            img.src =
                image;


            img.alt =
                track.dataset.title;


            img.addEventListener(
                "error",
                function() {

                    imageBox.textContent =
                        "IMAGE";

                }
            );


            imageBox.innerHTML =
                "";


            imageBox.appendChild(
                img
            );

        }

    });


    /*
        LOAD TRACK
    */

    function selectTrack(
        index,
        startPlaying = true,
        addToHistory = true
    ) {

        if (
            index < 0 ||
            index >= tracks.length
        ) {

            return;

        }


        /*
            Add the current track to
            history before moving to
            another track.

            This allows the Back button
            to return to it.
        */

        if (
            addToHistory &&
            index !== currentTrack &&
            currentTrack !== -1
        ) {

            playHistory.push(
                currentTrack
            );

        }


        currentTrack =
            index;


        tracks.forEach(function(track) {

            track.classList.remove(
                "selected"
            );

        });


        const track =
            tracks[index];


        track.classList.add(
            "selected"
        );


        const title =
            track.dataset.title;


        const artist =
            track.dataset.artist;


        const file =
            track.dataset.file;


        audioPlayer.src =
            file;


        nowPlaying.textContent =
            "Now playing: " +
            title +
            " — " +
            artist;


        /*
            Keep selected track visible.
        */

        track.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });


        /*
            START PLAYING
        */

        if (startPlaying) {

            audioPlayer.play()

                .then(function() {

                    playButton.textContent =
                        "❚❚ PAUSE";

                })

                .catch(function() {

                    playButton.textContent =
                        "▶ PLAY";

                });

        }

    }


    /*
        CHOOSE TRACK FOR PLAY BUTTON
    */

    function chooseTrackToPlay() {

        if (tracks.length === 0) {

            return;

        }


        let chosenTrack;


        if (shuffle) {

            /*
                Start a fresh shuffle cycle
                and take the first track.
            */

            createShuffleQueue();


            chosenTrack =
                getNextShuffleTrack();

        } else {

            chosenTrack =
                0;

        }


        selectTrack(
            chosenTrack,
            true,
            true
        );

    }


    /*
        NEXT TRACK

        SHUFFLE OFF:
        Move forward through the list.

        SHUFFLE ON:
        Take the next track from the
        shuffle queue.

        Every track is played once
        before the queue starts over.
    */

    function playNext() {

        if (tracks.length === 0) {

            return;

        }


        let nextTrack;


        if (shuffle) {

            nextTrack =
                getNextShuffleTrack();

        } else {

            nextTrack =
                currentTrack + 1;


            if (
                nextTrack >=
                tracks.length
            ) {

                nextTrack = 0;

            }

        }


        selectTrack(
            nextTrack,
            true,
            true
        );

    }


    /*
        PREVIOUS TRACK

        SHUFFLE OFF:
        Move backward through the list.

        SHUFFLE ON:
        Return to the track that was
        actually played immediately before
        the current track.
    */

    function playPrevious() {

        if (tracks.length === 0) {

            return;

        }


        /*
            SHUFFLE ON

            Use playback history.
        */

        if (shuffle) {

            if (
                playHistory.length > 0
            ) {

                const previousTrack =
                    playHistory.pop();


                selectTrack(
                    previousTrack,
                    true,
                    false
                );

            }

            return;

        }


        /*
            SHUFFLE OFF

            Move backward through list.
        */

        let previousTrack =
            currentTrack - 1;


        if (
            previousTrack < 0
        ) {

            previousTrack =
                tracks.length - 1;

        }


        selectTrack(
            previousTrack,
            true,
            true
        );

    }


    /*
        PLAY / PAUSE
    */

    playButton.addEventListener(
        "click",
        function() {

            if (
                currentTrack === -1
            ) {

                chooseTrackToPlay();

                return;

            }


            if (
                audioPlayer.paused
            ) {

                audioPlayer.play()

                    .then(function() {

                        playButton.textContent =
                            "❚❚ PAUSE";

                    });

            } else {

                audioPlayer.pause();


                playButton.textContent =
                    "▶ PLAY";

            }

        }
    );


    /*
        PREVIOUS BUTTON
    */

    backButton.addEventListener(
        "click",
        function() {

            if (
                currentTrack === -1
            ) {

                selectTrack(
                    0,
                    true,
                    true
                );

            } else {

                playPrevious();

            }

        }
    );


    /*
        NEXT BUTTON
    */

    nextButton.addEventListener(
        "click",
        function() {

            if (
                currentTrack === -1
            ) {

                selectTrack(
                    0,
                    true,
                    true
                );

            } else {

                playNext();

            }

        }
    );


    /*
        SHUFFLE BUTTON
    */

    shuffleButton.addEventListener(
        "click",
        function() {

            shuffle =
                !shuffle;


            if (shuffle) {

                shuffleButton.textContent =
                    "SHUFFLE ON";


                shuffleButton.classList.add(
                    "active"
                );


                /*
                    Start a fresh shuffle cycle
                    whenever shuffle is turned ON.
                */

                createShuffleQueue();


                /*
                    Remove the currently playing
                    track from the new queue.

                    This prevents the next song
                    from immediately repeating
                    the current song.
                */

                if (
                    currentTrack !== -1
                ) {

                    shuffleQueue =
                        shuffleQueue.filter(
                            function(index) {

                                return (
                                    index !==
                                    currentTrack
                                );

                            }
                        );

                }

            } else {

                shuffleButton.textContent =
                    "SHUFFLE OFF";


                shuffleButton.classList.remove(
                    "active"
                );


                /*
                    The shuffle queue is no longer
                    needed while shuffle is OFF.
                */

                shuffleQueue = [];

            }

        }
    );


    /*
        CLICKING A TRACK
    */

    tracks.forEach(
        function(track, index) {

            track.addEventListener(
                "click",
                function(event) {

                    /*
                        Don't play the track when
                        the download link is clicked.
                    */

                    if (
                        event.target.closest(
                            ".download-link"
                        )
                    ) {

                        return;

                    }


                    selectTrack(
                        index,
                        true,
                        true
                    );

                }
            );

        }
    );


    /*
        AUDIO PLAYING
    */

    audioPlayer.addEventListener(
        "play",
        function() {

            playButton.textContent =
                "❚❚ PAUSE";

        }
    );


    /*
        AUDIO PAUSED
    */

    audioPlayer.addEventListener(
        "pause",
        function() {

            playButton.textContent =
                "▶ PLAY";

        }
    );


    /*
        AUDIO FINISHED

        Next behavior follows Shuffle.
    */

    audioPlayer.addEventListener(
        "ended",
        function() {

            playNext();

        }
    );


</script>

</body>
</html>
