<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>gr8skul</title>


    <!-- GR8SKUL HOME-SCREEN ICON -->

    <link rel="icon"
          type="image/png"
          href="https://gr8skul.github.io/gr8skul-icon.PNG">

    <link rel="apple-touch-icon"
          href="https://gr8skul.github.io/gr8skul-icon.PNG">


    <!-- GR8SKUL APP MANIFEST -->

    <link rel="manifest"
          href="https://gr8skul.github.io/manifest.json">


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            background: #ffffff;

            color: #111111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            height: 100%;
        }


        body {
            overflow: hidden;
        }


        .app {

            width: 100%;

            max-width: 700px;

            height: 100vh;

            margin: 0 auto;

            padding: 0 20px;

            display: flex;

            flex-direction: column;
        }


        /* =========================
           FIXED HEADER
           ========================= */


        .header {

            flex-shrink: 0;

            background: #ffffff;

            padding-top: 35px;
        }


        h1 {

            margin: 0 0 35px;

            text-align: center;

            font-size: 42px;

            letter-spacing: 6px;

            font-weight: 700;
        }


        h1 img {

            display: block;

            width: auto;

            height: 42px;

            max-width: 100%;

            margin: 0 auto;
        }


        .controls {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            margin-bottom: 25px;
        }


        button {

            border: 1px solid #111111;

            background: #ffffff;

            color: #111111;

            cursor: pointer;

            font-size: 16px;

            padding: 12px 18px;

            min-height: 46px;
        }


        button:hover {

            background: #eeeeee;
        }


        #playButton {

            min-width: 120px;

            font-weight: bold;
        }


        #backButton,
        #nextButton {

            width: 50px;

            padding: 12px 5px;

            font-size: 24px;

            line-height: 1;
        }


        #shuffleButton.active {

            background: #111111;

            color: #ffffff;
        }


        .now-playing {

            text-align: center;

            margin-bottom: 25px;

            min-height: 24px;

            font-size: 14px;

            color: #555555;
        }


        .now-playing-download {

            display: block;

            margin-top: 6px;

            font-size: 11px;

            color: #888888;

            text-decoration: none;

            letter-spacing: 0.5px;
        }


        .now-playing-download:hover {

            color: #111111;

            text-decoration: underline;
        }


        .header-line {

            border-bottom: 1px solid #cccccc;
        }


        /* =========================
           SCROLLING TRACK AREA
           ========================= */


        .track-list {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            overflow-x: hidden;
        }


        .track {

            display: flex;

            align-items: center;

            width: 100%;

            min-height: 75px;

            padding: 12px 0;

            border-bottom: 1px solid #cccccc;

            cursor: pointer;

            user-select: none;
        }


        .track:hover {

            background: #f5f5f5;
        }


        .track.selected {

            background: #eeeeee;
        }


        .track-info {

            min-width: 0;

            text-align: left;

            flex: 1;
        }


        .track-title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 6px;
        }


        .download-link {

            font-size: 11px;

            color: #888888;

            text-decoration: none;

            letter-spacing: 0.5px;
        }


        .download-link:hover {

            color: #111111;

            text-decoration: underline;
        }


        /* =========================
           FIXED FOOTER
           ========================= */


        .player {

            flex-shrink: 0;

            background: #ffffff;

            padding-top: 20px;

            padding-bottom: 20px;

            width: 100%;
        }


        audio {

            width: 100%;
        }


        /* =========================
           MOBILE
           ========================= */


        @media (max-width: 500px) {


            .app {

                padding: 0 15px;
            }


            .header {

                padding-top: 25px;
            }


            h1 img {

                height: 34px;
            }


            .controls {

                flex-wrap: wrap;
            }


            .track {

                min-height: 65px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================
         FIXED HEADER
         ========================= -->


    <div class="header">


        <h1>

            <img
                src="https://gr8skul.github.io/GR8SKUL-HEADER-LOGO.png"
                alt="GR8SKUL">

        </h1>


        <div class="controls">


            <button
                id="backButton"
                type="button"
                aria-label="Previous track">

                ←

            </button>


            <button
                id="playButton"
                type="button">

                ▶ PLAY

            </button>


            <button
                id="nextButton"
                type="button"
                aria-label="Next track">

                →

            </button>


            <button
                id="shuffleButton"
                type="button">

                SHUFFLE OFF

            </button>


        </div>


        <div
            class="now-playing"
            id="nowPlaying">
        </div>


        <div class="header-line"></div>


    </div>


    <!-- =========================
         AUTOMATIC TRACK LIST
         ========================= -->


    <div
        class="track-list"
        id="trackList">

    </div>


    <!-- =========================
         FIXED FOOTER
         ========================= -->


    <div class="player">


        <audio
            id="audioPlayer"
            controls
            preload="none">
        </audio>


    </div>


</div>


<script>


    /*
        ============================================================
        GR8SKUL AUTOMATIC MUSIC CATALOG
        ============================================================

        The GitHub Action creates catalog.json.

        This page reads catalog.json and creates
        the track list automatically.

        You no longer need to add track HTML.
    */


    const tracksContainer =
        document.getElementById("trackList");


    const playButton =
        document.getElementById("playButton");


    const backButton =
        document.getElementById("backButton");


    const nextButton =
        document.getElementById("nextButton");


    const shuffleButton =
        document.getElementById("shuffleButton");


    const audioPlayer =
        document.getElementById("audioPlayer");


    const nowPlaying =
        document.getElementById("nowPlaying");


    let tracks = [];


    let currentTrack = -1;


    let shuffle = false;


    let shuffleQueue = [];


    let playHistory = [];


    /*
        ============================================================
        CLEAN TRACK TITLE
        ============================================================
    */


    function cleanTitle(filename) {

        return filename
            .replace(/\.[^/.]+$/, "")
            .replace(/[_]+/g, " ")
            .trim();

    }


    /*
        ============================================================
        CREATE TRACK HTML
        ============================================================
    */


    function createTrackElement(trackData) {


        const track =
            document.createElement("div");


        track.className =
            "track";


        track.dataset.title =
            cleanTitle(trackData.name);


        track.dataset.file =
            trackData.path;


        const trackInfo =
            document.createElement("div");


        trackInfo.className =
            "track-info";


        const title =
            document.createElement("div");


        title.className =
            "track-title";


        title.textContent =
            cleanTitle(trackData.name);


        const download =
            document.createElement("a");


        download.className =
            "download-link";


        download.href =
            trackData.path;


        download.download =
            "";


        download.textContent =
            "DOWNLOAD MP3";


        trackInfo.appendChild(title);

        trackInfo.appendChild(download);


        track.appendChild(trackInfo);


        return track;

    }


    /*
        ============================================================
        LOAD CATALOG
        ============================================================
    */


    async function loadCatalog() {


        try {


            const response =
                await fetch(
                    "catalog.json?cache=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "Catalog could not be loaded."
                );

            }


            const catalog =
                await response.json();


            tracksContainer.innerHTML =
                "";


            catalog.forEach(function(trackData) {


                const track =
                    createTrackElement(
                        trackData
                    );


                tracksContainer.appendChild(
                    track
                );

            });


            tracks =
                Array.from(
                    document.querySelectorAll(".track")
                );


            attachTrackListeners();


        } catch (error) {


            console.error(error);


            tracksContainer.innerHTML =
                "<div style='padding:20px 0; color:#777;'>Music catalog loading...</div>";


        }

    }


    /*
        ============================================================
        SHUFFLE
        ============================================================
    */


    function createShuffleQueue() {


        shuffleQueue =
            tracks.map(function(track, index) {

                return index;

            });


        for (
            let i = shuffleQueue.length - 1;
            i > 0;
            i--
        ) {


            const randomIndex =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );


            const temporary =
                shuffleQueue[i];


            shuffleQueue[i] =
                shuffleQueue[randomIndex];


            shuffleQueue[randomIndex] =
                temporary;

        }

    }


    function getNextShuffleTrack() {


        if (
            shuffleQueue.length === 0
        ) {

            createShuffleQueue();

        }


        return shuffleQueue.shift();

    }


    /*
        ============================================================
        DOWNLOAD LINK
        ============================================================
    */


    function attachDownloadBehavior(
        downloadLink
    ) {


        downloadLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                const file =
                    downloadLink.href;


                const temporaryLink =
                    document.createElement("a");


                temporaryLink.href =
                    file;


                temporaryLink.download =
                    "";


                document.body.appendChild(
                    temporaryLink
                );


                temporaryLink.click();


                document.body.removeChild(
                    temporaryLink
                );

            }
        );

    }


    /*
        ============================================================
        LOAD TRACK
        ============================================================
    */


    function selectTrack(
        index,
        startPlaying = true,
        addToHistory = true
    ) {


        if (
            index < 0 ||
            index >= tracks.length
        ) {

            return;

        }


        if (
            addToHistory &&
            index !== currentTrack &&
            currentTrack !== -1
        ) {

            playHistory.push(
                currentTrack
            );

        }


        currentTrack =
            index;


        tracks.forEach(
            function(track) {

                track.classList.remove(
                    "selected"
                );

            }
        );


        const track =
            tracks[index];


        track.classList.add(
            "selected"
        );


        const title =
            track.dataset.title;


        const file =
            track.dataset.file;


        audioPlayer.src =
            file;


        /*
            NOW PLAYING

            Includes download link.
        */


        nowPlaying.innerHTML =
            "";


        const nowPlayingText =
            document.createElement("div");


        nowPlayingText.textContent =
            "Now playing: " +
            title;


        const download =
            document.createElement("a");


        download.className =
            "now-playing-download";


        download.href =
            file;


        download.download =
            "";


        download.textContent =
            "DOWNLOAD MP3";


        attachDownloadBehavior(
            download
        );


        nowPlaying.appendChild(
            nowPlayingText
        );


        nowPlaying.appendChild(
            download
        );


        /*
            Keep selected track visible.
        */


        track.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });


        if (startPlaying) {


            audioPlayer.play()

                .then(function() {

                    playButton.textContent =
                        "❚❚ PAUSE";

                })

                .catch(function() {

                    playButton.textContent =
                        "▶ PLAY";

                });

        }

    }


    /*
        ============================================================
        FIRST PLAY
        ============================================================
    */


    function chooseTrackToPlay() {


        if (
            tracks.length === 0
        ) {

            return;

        }


        let chosenTrack;


        if (shuffle) {


            createShuffleQueue();


            chosenTrack =
                getNextShuffleTrack();


        } else {


            chosenTrack =
                0;

        }


        selectTrack(
            chosenTrack,
            true,
            true
        );

    }


    /*
        ============================================================
        NEXT
        ============================================================
    */


    function playNext() {


        if (
            tracks.length === 0
        ) {

            return;

        }


        let nextTrack;


        if (shuffle) {


            nextTrack =
                getNextShuffleTrack();


        } else {


            nextTrack =
                currentTrack + 1;


            if (
                nextTrack >= tracks.length
            ) {

                nextTrack = 0;

            }

        }


        selectTrack(
            nextTrack,
            true,
            true
        );

    }


    /*
        ============================================================
        PREVIOUS
        ============================================================
    */


    function playPrevious() {


        if (
            tracks.length === 0
        ) {

            return;

        }


        if (shuffle) {


            if (
                playHistory.length > 0
            ) {


                const previousTrack =
                    playHistory.pop();


                selectTrack(
                    previousTrack,
                    true,
                    false
                );

            }


            return;

        }


        let previousTrack =
            currentTrack - 1;


        if (
            previousTrack < 0
        ) {

            previousTrack =
                tracks.length - 1;

        }


        selectTrack(
            previousTrack,
            true,
            true
        );

    }


    /*
        ============================================================
        PLAY / PAUSE
        ============================================================
    */


    playButton.addEventListener(
        "click",
        function() {


            if (
                currentTrack === -1
            ) {


                chooseTrackToPlay();


                return;

            }


            if (
                audioPlayer.paused
            ) {


                audioPlayer.play()

                    .then(function() {

                        playButton.textContent =
                            "❚❚ PAUSE";

                    });


            } else {


                audioPlayer.pause();


                playButton.textContent =
                    "▶ PLAY";

            }

        }
    );


    /*
        ============================================================
        BACK
        ============================================================
    */


    backButton.addEventListener(
        "click",
        function() {


            if (
                currentTrack === -1
            ) {


                selectTrack(
                    0,
                    true,
                    true
                );


            } else {


                playPrevious();

            }

        }
    );


    /*
        ============================================================
        NEXT
        ============================================================
    */


    nextButton.addEventListener(
        "click",
        function() {


            if (
                currentTrack === -1
            ) {


                selectTrack(
                    0,
                    true,
                    true
                );


            } else {


                playNext();

            }

        }
    );


    /*
        ============================================================
        SHUFFLE
        ============================================================
    */


    shuffleButton.addEventListener(
        "click",
        function() {


            shuffle =
                !shuffle;


            if (shuffle) {


                shuffleButton.textContent =
                    "SHUFFLE ON";


                shuffleButton.classList.add(
                    "active"
                );


                createShuffleQueue();


                /*
                    Don't immediately repeat
                    the current song.
                */


                if (
                    currentTrack !== -1
                ) {


                    shuffleQueue =
                        shuffleQueue.filter(
                            function(index) {

                                return (
                                    index !==
                                    currentTrack
                                );

                            }
                        );

                }


            } else {


                shuffleButton.textContent =
                    "SHUFFLE OFF";


                shuffleButton.classList.remove(
                    "active"
                );


                shuffleQueue = [];

            }

        }
    );


    /*
        ============================================================
        TRACK CLICKS
        ============================================================
    */


    function attachTrackListeners() {


        tracks.forEach(
            function(track, index) {


                const downloadLink =
                    track.querySelector(
                        ".download-link"
                    );


                attachDownloadBehavior(
                    downloadLink
                );


                track.addEventListener(
                    "click",
                    function(event) {


                        if (
                            event.target.closest(
                                ".download-link"
                            )
                        ) {

                            return;

                        }


                        selectTrack(
                            index,
                            true,
                            true
                        );

                    }
                );

            }
        );

    }


    /*
        ============================================================
        AUDIO PLAYING
        ============================================================
    */


    audioPlayer.addEventListener(
        "play",
        function() {

            playButton.textContent =
                "❚❚ PAUSE";

        }
    );


    /*
        ============================================================
        AUDIO PAUSED
        ============================================================
    */


    audioPlayer.addEventListener(
        "pause",
        function() {

            playButton.textContent =
                "▶ PLAY";

        }
    );


    /*
        ============================================================
        AUDIO FINISHED
        ============================================================
    */


    audioPlayer.addEventListener(
        "ended",
        function() {

            playNext();

        }
    );


    /*
        ============================================================
        START THE APP
        ============================================================
    */


    loadCatalog();


</script>


</body>
</html>
