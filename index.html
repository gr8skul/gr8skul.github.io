<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta

>

<title>GR8SKUL</title>

<link

    href="/gr8skul-icon.PNG"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
   ========================= */

header {

    height: 62px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    padding: 0 14px;

    border-bottom: 1px solid #222;

    background: #050505;
}

.logo {

    width: 120px;

    height: auto;

    margin-right: 14px;
}

.controls {

    display: flex;

    align-items: center;

    gap: 8px;
}

.control-button {

    width: 34px;

    height: 34px;

    border: 1px solid #333;

    border-radius: 4px;

    background: #111;

    color: #fff;

    font-size: 17px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;
}

.control-button:hover {

    background: #1c1c1c;
}

.control-button.active {

    background: #222;

    border-color: #666;
}

.now-playing {

    margin-left: 18px;

    min-width: 0;

    flex: 1;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 14px;

    color: #ccc;
}

.now-playing-title {

    color: #fff;
}

.now-playing-artist {

    color: #777;

    margin-left: 8px;
}

.sponsor-line {

    margin-left: 12px;

    white-space: nowrap;

    font-size: 11px;

    color: #555;
}

.sponsor-line a {

    color: #777;

    text-decoration: none;
}

.sponsor-line a:hover {

    color: #aaa;
}

/* =========================
   TRACK LIST
   ========================= */

#track-list {

    flex: 1;

    overflow-y: auto;

    padding: 8px 0 90px 0;
}

.track {

    display: flex;

    align-items: center;

    min-height: 44px;

    padding: 7px 14px;

    border-bottom: 1px solid #111;

    cursor: pointer;
}

.track:hover {

    background: #0d0d0d;
}

.track.active {

    background: #151515;
}

.track-number {

    width: 38px;

    flex-shrink: 0;

    color: #444;

    font-size: 12px;

    text-align: right;

    margin-right: 12px;
}

.track-info {

    min-width: 0;

    flex: 1;

    overflow: hidden;
}

.track-title {

    color: #ddd;

    font-size: 14px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.track-artist {

    color: #666;

    font-size: 11px;

    margin-top: 2px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.track.active .track-title {

    color: #fff;
}

.track-mute {

    width: 30px;

    flex-shrink: 0;

    border: 0;

    background: transparent;

    color: #555;

    cursor: pointer;

    font-size: 14px;
}

.track-mute:hover {

    color: #aaa;
}

/* =========================
   AUDIO FOOTER
   ========================= */

.audio-footer {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    height: 70px;

    background: #050505;

    border-top: 1px solid #222;

    display: flex;

    align-items: center;

    padding: 0 14px;

    z-index: 20;
}

audio {

    width: 100%;

    height: 42px;
}

</style>

</head>

<body>

<header>

    <img
        src="/gr8skul-logo.PNG"
        class="logo"
        alt="GR8SKUL"
    >

    <div class="controls">

        <button
            id="back-button"
            class="control-button"
            type="button"
            aria-label="Previous"
        >
            ◀
        </button>

        <button
            id="play-button"
            class="control-button"
            type="button"
            aria-label="Play"
        >
            ▶
        </button>

        <button
            id="next-button"
            class="control-button"
            type="button"
            aria-label="Next"
        >
            ▶
        </button>

        <button
            id="shuffle-button"
            class="control-button"
            type="button"
            aria-label="Shuffle"
        >
            🔀
        </button>

    </div>

    <div class="now-playing">

        <span
            id="now-playing-title"
            class="now-playing-title"
        >
            Nothing playing
        </span>

        <span
            id="now-playing-artist"
            class="now-playing-artist"
        ></span>

    </div>

    <div
        id="sponsor-line"
        class="sponsor-line"
    ></div>

</header>


<div id="track-list"></div>


<div class="audio-footer">

    <audio
        id="audio"
        controls
        preload="metadata"
    ></audio>

</div>


<script>

const SUPABASE_URL =
    "https://rijzolipyabfggrrhgab.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm";


/* =========================================================
   ELEMENTS
   ========================================================= */

const audio =
    document.getElementById("audio");

const trackList =
    document.getElementById("track-list");

const playButton =
    document.getElementById("play-button");

const backButton =
    document.getElementById("back-button");

const nextButton =
    document.getElementById("next-button");

const shuffleButton =
    document.getElementById("shuffle-button");

const nowPlayingTitle =
    document.getElementById("now-playing-title");

const nowPlayingArtist =
    document.getElementById("now-playing-artist");

const sponsorLine =
    document.getElementById("sponsor-line");


/* =========================================================
   STATE
   ========================================================= */

let tracks = [];

let currentIndex = -1;

let shuffleMode = false;

let playStartedAt = null;

let qualified = false;

let listened30 = false;


/* =========================================================
   TITLE FALLBACK
   ========================================================= */

function cleanTitle(filename) {

    return filename
        .replace(/^music\//i, "")
        .replace(/\.[^/.]+$/, "")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   NORMALIZE PATH
   ========================================================= */

function normalizePath(path) {

    if (!path) {
        return "";
    }

    return decodeURIComponent(
        String(path)
            .replace(/^https?:\/\/[^/]+/i, "")
            .replace(/^\/+/, "")
    )
    .trim();
}


/* =========================================================
   METADATA LOOKUP
   ========================================================= */

function getMetadataForTrack(
    trackPath,
    metadata
) {

    const normalizedTrackPath =
        normalizePath(trackPath);

    /*
     * First try the exact key.
     */

    if (
        metadata &&
        metadata[normalizedTrackPath]
    ) {

        return metadata[
            normalizedTrackPath
        ];

    }


    /*
     * Second try every metadata key after
     * normalization.
     *
     * This protects us against harmless
     * differences such as a leading slash
     * or encoded characters.
     */

    if (metadata) {

        for (
            const key of Object.keys(metadata)
        ) {

            if (
                normalizePath(key) ===
                normalizedTrackPath
            ) {

                return metadata[key];

            }

        }

    }


    return null;
}


/* =========================================================
   CREATE TRACK ELEMENT
   ========================================================= */

function createTrackElement(
    trackData,
    index
) {

    const track =
        document.createElement("div");

    track.className = "track";

    track.dataset.index = index;

    track.dataset.title =
        trackData.title;

    track.dataset.artist =
        trackData.artist;

    track.dataset.file =
        trackData.path;


    const number =
        document.createElement("div");

    number.className =
        "track-number";

    number.textContent =
        String(index + 1);


    const info =
        document.createElement("div");

    info.className =
        "track-info";


    const title =
        document.createElement("div");

    title.className =
        "track-title";

    title.textContent =
        trackData.title;


    const artist =
        document.createElement("div");

    artist.className =
        "track-artist";

    artist.textContent =
        trackData.artist;


    const mute =
        document.createElement("button");

    mute.className =
        "track-mute";

    mute.type =
        "button";

    mute.textContent =
        "🔊";


    info.appendChild(title);

    if (trackData.artist) {

        info.appendChild(artist);

    }


    track.appendChild(number);

    track.appendChild(info);

    track.appendChild(mute);


    track.addEventListener(
        "click",
        function () {

            selectTrack(index);

        }
    );


    mute.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            const muted =
                track.dataset.muted === "true";

            track.dataset.muted =
                muted ? "false" : "true";

            mute.textContent =
                muted ? "🔊" : "🔇";

            if (
                currentIndex === index
            ) {

                audio.muted =
                    !muted;

            }

            localStorage.setItem(
                "gr8skul-muted-" +
                trackData.path,
                String(!muted)
            );

        }
    );


    const savedMute =
        localStorage.getItem(
            "gr8skul-muted-" +
            trackData.path
        );

    if (savedMute === "true") {

        track.dataset.muted =
            "true";

        mute.textContent =
            "🔇";

    }


    return track;
}


/* =========================================================
   LOAD CATALOG + METADATA + ORDER
   ========================================================= */

async function loadCatalog() {

    try {

        const [
            catalogResponse,
            metadataResponse,
            orderResponse
        ] = await Promise.all([

            fetch(
                "catalog.json?cache=" +
                Date.now()
            ),

            fetch(
                "track-metadata.json?cache=" +
                Date.now()
            ),

            fetch(
                "track-order.json?cache=" +
                Date.now()
            )

        ]);


        if (!catalogResponse.ok) {

            throw new Error(
                "Could not load catalog.json"
            );

        }

        if (!metadataResponse.ok) {

            throw new Error(
                "Could not load track-metadata.json"
            );

        }

        if (!orderResponse.ok) {

            throw new Error(
                "Could not load track-order.json"
            );

        }


        const catalog =
            await catalogResponse.json();

        const metadata =
            await metadataResponse.json();

        const order =
            await orderResponse.json();


        console.log(
            "GR8SKUL catalog:",
            catalog
        );

        console.log(
            "GR8SKUL metadata:",
            metadata
        );

        console.log(
            "GR8SKUL order:",
            order
        );


        /*
         * Build a lookup of catalog entries
         * by their normalized path.
         */

        const catalogByPath = {};

        catalog.forEach(
            function (trackData) {

                catalogByPath[
                    normalizePath(
                        trackData.path
                    )
                ] = trackData;

            }
        );


        /*
         * track-order.json contains the actual
         * playlist paths.
         *
         * For each path:
         *
         * order path
         *      ↓
         * catalog entry
         *      ↓
         * metadata entry
         */

        tracks = [];


        order.forEach(
            function (orderedPath) {

                const normalizedPath =
                    normalizePath(
                        orderedPath
                    );

                const catalogTrack =
                    catalogByPath[
                        normalizedPath
                    ];


                if (!catalogTrack) {

                    console.warn(
                        "No catalog entry for:",
                        orderedPath
                    );

                    return;

                }


                const meta =
                    getMetadataForTrack(
                        orderedPath,
                        metadata
                    );


                if (!meta) {

                    console.warn(
                        "NO METADATA FOUND FOR:",
                        orderedPath
                    );

                } else {

                    console.log(
                        "METADATA MATCH:",
                        orderedPath,
                        meta
                    );

                }


                const title =
                    meta &&
                    meta.title
                        ? meta.title
                        : cleanTitle(
                            catalogTrack.name
                        );


                let artist = "";


                if (
                    meta &&
                    Array.isArray(meta.artists)
                ) {

                    artist =
                        meta.artists.join(", ");

                } else if (
                    meta &&
                    meta.artists
                ) {

                    artist =
                        String(
                            meta.artists
                        );

                }


                tracks.push({

                    ...catalogTrack,

                    title:
                        title,

                    artist:
                        artist,

                    metadata:
                        meta || null

                });

            }
        );


        /*
         * Clear and rebuild the visible playlist.
         */

        trackList.innerHTML = "";


        tracks.forEach(
            function (trackData, index) {

                trackList.appendChild(
                    createTrackElement(
                        trackData,
                        index
                    )
                );

            }
        );


        console.log(
            "GR8SKUL FINAL TRACKS:",
            tracks
        );


    } catch (error) {

        console.error(
            "GR8SKUL playlist error:",
            error
        );

        trackList.innerHTML =
            '<div style="padding:20px;color:#777;">' +
            'Unable to load playlist.' +
            '</div>';

    }

}


/* =========================================================
   SELECT TRACK
   ========================================================= */

function selectTrack(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }


    currentIndex =
        index;


    const track =
        tracks[index];


    document
        .querySelectorAll(".track")
        .forEach(
            function (element) {

                element.classList.remove(
                    "active"
                );

            }
        );


    const activeElement =
        document.querySelector(
            '.track[data-index="' +
            index +
            '"]'
        );


    if (activeElement) {

        activeElement.classList.add(
            "active"
        );

    }


    nowPlayingTitle.textContent =
        track.title;


    nowPlayingArtist.textContent =
        track.artist
            ? "— " + track.artist
            : "";


    audio.src =
        track.path;


    const savedMute =
        localStorage.getItem(
            "gr8skul-muted-" +
            track.path
        );

    audio.muted =
        savedMute === "true";


    playStartedAt = null;

    qualified = false;

    listened30 = false;


    audio.play()
        .then(
            function () {

                playStartedAt =
                    Date.now();

            }
        )
        .catch(
            function (error) {

                console.warn(
                    "Playback did not start:",
                    error
                );

            }
        );

}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

playButton.addEventListener(
    "click",
    function () {

        if (currentIndex === -1) {

            if (tracks.length > 0) {

                selectTrack(0);

            }

            return;

        }


        if (audio.paused) {

            audio.play();

        } else {

            audio.pause();

        }

    }
);


audio.addEventListener(
    "play",
    function () {

        playButton.textContent =
            "❚❚";

        if (!playStartedAt) {

            playStartedAt =
                Date.now();

        }

    }
);


audio.addEventListener(
    "pause",
    function () {

        playButton.textContent =
            "▶";

    }
);


/* =========================================================
   NEXT
   ========================================================= */

nextButton.addEventListener(
    "click",
    function () {

        if (!tracks.length) {

            return;

        }


        let nextIndex;


        if (shuffleMode) {

            nextIndex =
                Math.floor(
                    Math.random() *
                    tracks.length
                );

        } else {

            nextIndex =
                currentIndex + 1;

            if (
                nextIndex >=
                tracks.length
            ) {

                nextIndex = 0;

            }

        }


        selectTrack(nextIndex);

    }
);


/* =========================================================
   PREVIOUS
   ========================================================= */

backButton.addEventListener(
    "click",
    function () {

        if (!tracks.length) {

            return;

        }


        let previousIndex =
            currentIndex - 1;


        if (
            previousIndex < 0
        ) {

            previousIndex =
                tracks.length - 1;

        }


        selectTrack(
            previousIndex
        );

    }
);


/* =========================================================
   SHUFFLE
   ========================================================= */

shuffleButton.addEventListener(
    "click",
    function () {

        shuffleMode =
            !shuffleMode;

        shuffleButton.classList.toggle(
            "active",
            shuffleMode
        );

    }
);


/* =========================================================
   QUALIFICATION
   ========================================================= */

function qualifyUser() {

    if (qualified) {

        return;

    }


    qualified = true;


    console.log(
        "GR8SKUL qualified user"
    );

}


/* =========================================================
   30 SECOND LISTENER
   ========================================================= */

audio.addEventListener(
    "timeupdate",
    function () {

        if (
            listened30 ||
            !playStartedAt ||
            audio.paused
        ) {

            return;

        }


        if (
            audio.currentTime >= 30
        ) {

            listened30 = true;

            console.log(
                "GR8SKUL 30-second listener"
            );

        }

    }
);


/* =========================================================
   SCROLL QUALIFICATION
   ========================================================= */

trackList.addEventListener(
    "scroll",
    function () {

        if (
            trackList.scrollTop >= 50
        ) {

            qualifyUser();

        }

    }
);


/* =========================================================
   SPONSOR
   ========================================================= */

async function loadSponsor() {

    /*
     * Existing sponsor behavior belongs here.
     *
     * This section intentionally does not
     * affect playlist metadata.
     */

}


/* =========================================================
   INITIALIZE
   ========================================================= */

loadCatalog();

loadSponsor();

</script>

</body>

</html>
