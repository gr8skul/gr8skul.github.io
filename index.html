<!-- GR8SKUL APP MANIFEST -->

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {

        margin: 0;

        background: #ffffff;

        color: #111111;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        height: 100%;
    }

    body {
        overflow: hidden;
    }

    .app {

        width: 100%;

        max-width: 700px;

        height: 100vh;

        margin: 0 auto;

        padding: 0 20px;

        display: flex;

        flex-direction: column;
    }

    /* =========================
       FIXED HEADER
       ========================= */

    .header {

        flex-shrink: 0;

        background: #ffffff;

        padding-top: 35px;
    }

    h1 {

        margin: 0 0 35px;

        text-align: center;

        font-size: 42px;

        letter-spacing: 6px;

        font-weight: 700;
    }

    h1 img {

        display: block;

        width: auto;

        height: 42px;

        max-width: 100%;

        margin: 0 auto;
    }

    .controls {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 10px;

        margin-bottom: 25px;
    }

    button {

        border: 1px solid #111111;

        background: #ffffff;

        color: #111111;

        cursor: pointer;

        font-size: 16px;

        padding: 12px 18px;

        min-height: 46px;
    }

    button:hover {

        background: #eeeeee;
    }

    #playButton {

        min-width: 120px;

        font-weight: bold;
    }

    #backButton,
    #nextButton {

        width: 50px;

        padding: 12px 5px;

        font-size: 24px;

        line-height: 1;
    }

    #shuffleButton.active {

        background: #111111;

        color: #ffffff;
    }

    .now-playing {

        text-align: center;

        margin-bottom: 10px;

        min-height: 24px;

        font-size: 14px;

        color: #555555;
    }

    .now-playing-actions {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 12px;

        margin-top: 6px;
    }

    .now-playing-mute {

        font-size: 11px;

        color: #888888;

        text-decoration: none;

        letter-spacing: 0.5px;

        cursor: pointer;
    }

    .now-playing-mute:hover {

        color: #111111;

        text-decoration: underline;
    }

    /* =========================
       SPONSOR
       ========================= */

    .sponsor {

        text-align: center;

        min-height: 24px;

        margin-bottom: 15px;

        font-size: 12px;

        color: #888888;
    }

    .sponsor a {

        color: #555555;

        text-decoration: none;

        font-weight: normal;
    }

    .sponsor a:hover {

        color: #111111;

        text-decoration: underline;
    }

    .header-line {

        border-bottom: 1px solid #cccccc;
    }

    .sponsor-tagline {

        display: block;

        margin-top: 2px;

        font-size: 11px;

        color: #888888;

        text-decoration: none;

        font-weight: normal;
    }

    /* =========================
       SCROLLING TRACK AREA
       ========================= */

    .track-list {

        flex: 1;

        min-height: 0;

        overflow-y: auto;

        overflow-x: hidden;
    }

    .track {

        display: flex;

        align-items: center;

        width: 100%;

        min-height: 75px;

        padding: 12px 0;

        border-bottom: 1px solid #cccccc;

        cursor: pointer;

        user-select: none;
    }

    .track:hover {

        background: #f5f5f5;
    }

    .track.selected {

        background: #eeeeee;
    }

    .track-info {

        min-width: 0;

        text-align: left;

        flex: 1;
    }

    .track-title {

        font-size: 17px;

        font-weight: bold;

        margin-bottom: 4px;
    }

    .track-artist {

        font-size: 12px;

        color: #777777;

        margin-bottom: 6px;
    }

    .track-actions {

        display: flex;

        align-items: center;

        gap: 12px;
    }

    .mute-toggle {

        font-size: 11px;

        color: #888888;

        text-decoration: none;

        letter-spacing: 0.5px;

        cursor: pointer;
    }

    .mute-toggle:hover {

        color: #111111;

        text-decoration: underline;
    }

    /* =========================
       FIXED FOOTER
       ========================= */

    .player {

        flex-shrink: 0;

        background: #ffffff;

        padding-top: 20px;

        padding-bottom: 20px;

        width: 100%;
    }

    audio {

        width: 100%;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 500px) {

        .app {

            padding: 0 15px;
        }

        .header {

            padding-top: 25px;
        }

        h1 img {

            height: 34px;
        }

        .controls {

            flex-wrap: wrap;
        }

        .track {

            min-height: 65px;
        }

        .track-actions {

            gap: 9px;
        }
    }

</style>

</head>

<body>

<div class="app">

<!-- =========================
     FIXED HEADER
     ========================= -->

<div class="header">

<h1>

    <img
        src="https://gr8skul.github.io/GR8SKUL-HEADER-LOGO.png"
        alt="GR8SKUL">

</h1>

<div class="controls">

    <button
        id="backButton"
        type="button"
        aria-label="Previous track">

        ←

    </button>

    <button
        id="playButton"
        type="button">

    </button>

    <button

    class="sponsor"

<div class="header-line"></div>

</div>

     ========================= -->

    id="trackList">

     FIXED FOOTER
     ========================= -->

<audio

    preload="none">
</audio>

</div>

<script>

/*
    ============================================================
    GR8SKUL AUTOMATIC MUSIC CATALOG
    ============================================================

    The GitHub Action creates catalog.json.

    This page reads catalog.json and creates
    the track list automatically.

    track-metadata.json supplies the public title
    and artist information for each work.
*/


/*
    ============================================================
    SESSION ID
    ============================================================
*/

let sessionId =
    localStorage.getItem(
        "gr8skul-session-id"
    );

if (!sessionId) {

    sessionId =
        crypto.randomUUID();

    localStorage.setItem(
        "gr8skul-session-id",
        sessionId
    );

}


/*
    ============================================================
    GR8SKUL QUALIFIED USER
    ============================================================
*/

async function qualifyUserByPlay() {

    const today =
        new Date().toLocaleDateString(
            "en-CA",
            {
                timeZone: "America/Chicago"
            }
        );

    const lastQualifiedDate =
        localStorage.getItem(
            "gr8skul-qualified-play-date"
        );

    if (
        lastQualifiedDate === today
    ) {

        return;

    }

    try {

        const response =
            await fetch(
                "https://rijzolipyabfggrrhgab.supabase.co/rest/v1/rpc/qualify_gr8skul_user",
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                        "Authorization":
                            "Bearer sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            p_visitor_id:
                                sessionId,

                            p_activity_type:
                                "play"

                        })

                }
            );

        if (!response.ok) {

            throw new Error(
                "User qualification failed: " +
                response.status
            );

        }

        localStorage.setItem(
            "gr8skul-qualified-play-date",
            today
        );

        console.log(
            "GR8SKUL: visitor qualified by play."
        );

    } catch (error) {

        console.error(
            "GR8SKUL user qualification failed.",
            error
        );

    }

}


/*
    ============================================================
    QUALIFY USER BY MEANINGFUL SCROLL
    ============================================================
*/

async function qualifyUserByScroll() {

    const today =
        new Date().toLocaleDateString(
            "en-CA",
            {
                timeZone: "America/Chicago"
            }
        );

    const lastQualifiedDate =
        localStorage.getItem(
            "gr8skul-qualified-scroll-date"
        );

    if (
        lastQualifiedDate === today
    ) {

        return;

    }

    try {

        const response =
            await fetch(
                "https://rijzolipyabfggrrhgab.supabase.co/rest/v1/rpc/qualify_gr8skul_user",
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                        "Authorization":
                            "Bearer sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            p_visitor_id:
                                sessionId,

                            p_activity_type:
                                "scroll"

                        })

                }
            );

        if (!response.ok) {

            throw new Error(
                "Scroll qualification failed: " +
                response.status
            );

        }

        localStorage.setItem(
            "gr8skul-qualified-scroll-date",
            today
        );

        console.log(
            "GR8SKUL: visitor qualified by scroll."
        );

    } catch (error) {

        console.error(
            "GR8SKUL scroll qualification failed.",
            error
        );

    }

}


/*
    ============================================================
    GR8SKUL LISTENER
    ============================================================
*/

const LISTENER_THRESHOLD_SECONDS = 30;

let playbackStartedAt = null;

function getTodayChicagoDate() {

    return new Date().toLocaleDateString(
        "en-CA",
        {
            timeZone: "America/Chicago"
        }
    );

}

function getStoredListenSeconds() {

    const today =
        getTodayChicagoDate();

    const savedDate =
        localStorage.getItem(
            "gr8skul-listen-date"
        );

    if (
        savedDate !== today
    ) {

        localStorage.setItem(
            "gr8skul-listen-date",
            today
        );

        localStorage.setItem(
            "gr8skul-listen-seconds",
            "0"
        );

        localStorage.removeItem(
            "gr8skul-listener-qualified-date"
        );

        return 0;

    }

    return parseFloat(
        localStorage.getItem(
            "gr8skul-listen-seconds"
        ) || "0"
    );

}

function storeListenSeconds(seconds) {

    localStorage.setItem(
        "gr8skul-listen-date",
        getTodayChicagoDate()
    );

    localStorage.setItem(
        "gr8skul-listen-seconds",
        String(seconds)
    );

}

async function qualifyListener() {

    const today =
        getTodayChicagoDate();

    const alreadyQualified =
        localStorage.getItem(
            "gr8skul-listener-qualified-date"
        );

    if (
        alreadyQualified === today
    ) {

        return;

    }

    try {

        const response =
            await fetch(
                "https://rijzolipyabfggrrhgab.supabase.co/rest/v1/rpc/qualify_gr8skul_listener",
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                        "Authorization":
                            "Bearer sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            p_visitor_id:
                                sessionId

                        })

                }
            );

        if (!response.ok) {

            throw new Error(
                "Listener qualification failed: " +
                response.status
            );

        }

        const result =
            await response.json();

        if (result === false) {

            console.warn(
                "GR8SKUL: listener threshold reached, but visitor was not yet a qualified user."
            );

            return;

        }

        localStorage.setItem(
            "gr8skul-listener-qualified-date",
            today
        );

        console.log(
            "GR8SKUL: visitor qualified as a listener."
        );

    } catch (error) {

        console.error(
            "GR8SKUL listener qualification failed.",
            error
        );

    }

}

function recordPlaybackTime() {

    if (
        playbackStartedAt === null
    ) {

        return;

    }

    const elapsedSeconds =
        (Date.now() -
         playbackStartedAt) / 1000;

    playbackStartedAt =
        Date.now();

    if (
        elapsedSeconds <= 0
    ) {

        return;

    }

    let totalSeconds =
        getStoredListenSeconds();

    totalSeconds +=
        elapsedSeconds;

    storeListenSeconds(
        totalSeconds
    );

    if (
        totalSeconds >=
        LISTENER_THRESHOLD_SECONDS
    ) {

        qualifyListener();

    }

}

function startPlaybackClock() {

    if (
        playbackStartedAt === null
    ) {

        playbackStartedAt =
            Date.now();

    }

}

function stopPlaybackClock() {

    recordPlaybackTime();

    playbackStartedAt = null;

}


const tracksContainer =
    document.getElementById("trackList");

const playButton =
    document.getElementById("playButton");

const backButton =
    document.getElementById("backButton");

const nextButton =
    document.getElementById("nextButton");

const shuffleButton =
    document.getElementById("shuffleButton");

const audioPlayer =
    document.getElementById("audioPlayer");

const nowPlaying =
    document.getElementById("nowPlaying");

const sponsor =
    document.getElementById("sponsor");


/*
    ============================================================
    MEANINGFUL TRACK-LIST SCROLL
    ============================================================
*/

tracksContainer.addEventListener(
    "scroll",
    function() {

        if (
            tracksContainer.scrollTop >= 50
        ) {

            qualifyUserByScroll();

        }

    }
);


/*
    ============================================================
    SPONSOR ASSIGNMENT
    ============================================================
*/

let sponsorRotationTimer = null;

function startSponsorRotation() {

    if (sponsorRotationTimer !== null) {

        clearInterval(
            sponsorRotationTimer
        );

    }

    sponsorRotationTimer =
        setInterval(
            function() {

                loadSponsors();

            },
            60000
        );

}

async function loadSponsors() {

    try {

        const response =
            await fetch(
                "https://rijzolipyabfggrrhgab.supabase.co/rest/v1/rpc/assign_sponsor",
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                        "Authorization":
                            "Bearer sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            p_session_id:
                                sessionId
                        })

                }
            );

        if (!response.ok) {

            throw new Error(
                "Supabase sponsor assignment failed: " +
                response.status
            );

        }

        const assignment =
            await response.json();

        if (
            !Array.isArray(assignment) ||
            assignment.length === 0
        ) {

            sponsor.innerHTML = "";

            console.warn(
                "GR8SKUL: No sponsor assignment returned."
            );

            return;

        }

        const ad =
            assignment[0];

        sponsor.innerHTML = "";

        const prefix =
            document.createTextNode(
                "Brought to you by: "
            );

        const link =
            document.createElement(
                "a"
            );

        link.textContent =
            ad.sponsor_name;

        link.href =
            ad.sponsor_url;

        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

        link.addEventListener(
            "click",
            function() {

                fetch(
                    "https://rijzolipyabfggrrhgab.supabase.co/rest/v1/rpc/record_sponsor_click",
                    {
                        method: "POST",

                        headers: {

                            "apikey":
                                "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                            "Authorization":
                                "Bearer sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({
                                p_session_id:
                                    sessionId
                            }),

                        keepalive:
                            true

                    }
                )

                .catch(
                    function(error) {

                        console.error(
                            "GR8SKUL sponsor click tracking failed.",
                            error
                        );

                    }
                );

            }
        );

        const tagline =
            document.createElement(
                "span"
            );

        tagline.textContent =
            ad.sponsor_tagline;

        tagline.className =
            "sponsor-tagline";

        sponsor.appendChild(
            prefix
        );

        sponsor.appendChild(
            link
        );

        if (
            ad.sponsor_tagline
        ) {

            sponsor.appendChild(
                tagline
            );

        }

    } catch (error) {

        console.error(
            "GR8SKUL sponsor system could not connect to Supabase.",
            error
        );

        sponsor.innerHTML = "";

    }

}


/*
    ============================================================
    USER MUTE STORAGE
    ============================================================
*/

const MUTE_STORAGE_KEY =
    "gr8skul-muted-tracks";

let mutedTracks = {};

try {

    const savedMuteSettings =
        localStorage.getItem(
            MUTE_STORAGE_KEY
        );

    if (savedMuteSettings) {

        mutedTracks =
            JSON.parse(
                savedMuteSettings
            ) || {};

    }

} catch (error) {

    console.error(
        "GR8SKUL mute settings could not be loaded.",
        error
    );

    mutedTracks = {};

}

function saveMuteSettings() {

    try {

        localStorage.setItem(
            MUTE_STORAGE_KEY,
            JSON.stringify(mutedTracks)
        );

    } catch (error) {

        console.error(
            "GR8SKUL mute settings could not be saved.",
            error
        );

    }

}

function isTrackMuted(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return false;

    }

    const file =
        tracks[index].dataset.file;

    return mutedTracks[file] === true;

}

function setTrackMuted(
    index,
    muted
) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }

    const file =
        tracks[index].dataset.file;

    if (muted) {

        mutedTracks[file] = true;

    } else {

        delete mutedTracks[file];

    }

    saveMuteSettings();

    updateTrackMuteButton(index);

    updateNowPlayingMuteButton();

    if (muted) {

        shuffleQueue =
            shuffleQueue.filter(
                function(queueIndex) {

                    return !isTrackMuted(
                        queueIndex
                    );

                }
            );

    }

}


/*
    ============================================================
    TRACK DATA
    ============================================================
*/

let tracks = [];

let currentTrack = -1;

let shuffle = false;

let shuffleQueue = [];

let playHistory = [];


/*
    ============================================================
    CLEAN TRACK TITLE
    ============================================================
*/

function cleanTitle(filename) {

    return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/[\_]+/g, " ")
        .trim();

}


/*
    ============================================================
    CREATE TRACK HTML
    ============================================================

    Metadata has already been matched by loadCatalog().

    trackData.title is the public title.

    trackData.artist is the public artist string.

    trackData.path remains the actual MP3 path.
*/

function createTrackElement(trackData) {

    const track =
        document.createElement("div");

    track.className =
        "track";

    const displayTitle =
        trackData.title ||
        cleanTitle(trackData.name);

    const displayArtist =
        trackData.artist ||
        "";

    track.dataset.title =
        displayTitle;

    track.dataset.artist =
        displayArtist;

    track.dataset.file =
        trackData.path;

    const trackInfo =
        document.createElement("div");

    trackInfo.className =
        "track-info";

    const title =
        document.createElement("div");

    title.className =
        "track-title";

    title.textContent =
        displayTitle;

    trackInfo.appendChild(
        title
    );

    if (displayArtist) {

        const artist =
            document.createElement("div");

        artist.className =
            "track-artist";

        artist.textContent =
            displayArtist;

        trackInfo.appendChild(
            artist
        );

    }

    const trackActions =
        document.createElement("div");

    trackActions.className =
        "track-actions";

    const muteButton =
        document.createElement("a");

    muteButton.className =
        "mute-toggle";

    muteButton.href =
        "#";

    muteButton.textContent =
        "MUTE";

    trackActions.appendChild(
        muteButton
    );

    trackInfo.appendChild(
        trackActions
    );

    track.appendChild(
        trackInfo
    );

    return track;

}


/*
    ============================================================
    UPDATE TRACK MUTE BUTTON
    ============================================================
*/

function updateTrackMuteButton(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }

    const track =
        tracks[index];

    const muteButton =
        track.querySelector(
            ".mute-toggle"
        );

    if (!muteButton) {

        return;

    }

    if (
        isTrackMuted(index)
    ) {

        muteButton.textContent =
            "UNMUTE";

    } else {

        muteButton.textContent =
            "MUTE";

    }

}


/*
    ============================================================
    UPDATE ALL TRACK MUTE BUTTONS
    ============================================================
*/

function updateAllTrackMuteButtons() {

    tracks.forEach(
        function(track, index) {

            updateTrackMuteButton(
                index
            );

        }
    );

}


/*
    ============================================================
    LOAD CATALOG + ORDER + METADATA
    ============================================================
*/

async function loadCatalog() {

    try {

        /*
            ========================================================
            LOAD ALL THREE DATA FILES
            ========================================================
        */

        const [
            catalogResponse,
            metadataResponse,
            orderResponse
        ] = await Promise.all([

            fetch(
                "catalog.json?cache=" +
                Date.now()
            ),

            fetch(
                "track-metadata.json?cache=" +
                Date.now()
            ),

            fetch(
                "track-order.json?cache=" +
                Date.now()
            )

        ]);


        /*
            ========================================================
            VERIFY CATALOG
            ========================================================
        */

        if (!catalogResponse.ok) {

            throw new Error(
                "Catalog could not be loaded."
            );

        }


        /*
            ========================================================
            VERIFY METADATA
            ========================================================
        */

        if (!metadataResponse.ok) {

            throw new Error(
                "Track metadata could not be loaded."
            );

        }


        const catalog =
            await catalogResponse.json();

        const metadata =
            await metadataResponse.json();


        /*
            ========================================================
            LOAD PERMANENT TRACK ORDER
            ========================================================
        */

        let trackOrder = [];

        if (orderResponse.ok) {

            const orderData =
                await orderResponse.json();

            if (Array.isArray(orderData)) {

                trackOrder =
                    orderData;

            }

        }


        /*
            ========================================================
            ARRANGE CATALOG USING track-order.json
            ========================================================
        */

        const catalogByPath =
            new Map();

        catalog.forEach(
            function(trackData) {

                if (
                    trackData &&
                    trackData.path
                ) {

                    catalogByPath.set(
                        trackData.path,
                        trackData
                    );

                }

            }
        );


        const orderedCatalog = [];


        trackOrder.forEach(
            function(path) {

                if (
                    catalogByPath.has(path)
                ) {

                    orderedCatalog.push(
                        catalogByPath.get(path)
                    );

                    catalogByPath.delete(path);

                }

            }
        );


        /*
            Add any newly discovered tracks that
            are not yet in track-order.json.
        */

        catalog.forEach(
            function(trackData) {

                if (
                    trackData &&
                    trackData.path &&
                    catalogByPath.has(
                        trackData.path
                    )
                ) {

                    orderedCatalog.push(
                        trackData
                    );

                    catalogByPath.delete(
                        trackData.path
                    );

                }

            }
        );


        /*
            ========================================================
            MATCH METADATA TO EACH TRACK
            ========================================================

            IMPORTANT:

            The metadata keys are exactly:

            music/<filename>.mp3

            catalog.json supplies the same value as
            trackData.path.

            Therefore this is an exact path match.
        */

        const tracksWithMetadata =
            orderedCatalog.map(
                function(trackData) {

                    const meta =
                        metadata[
                            trackData.path
                        ];


                    if (!meta) {

                        console.warn(
                            "GR8SKUL: No metadata found for:",
                            trackData.path
                        );

                    } else {

                        console.log(
                            "GR8SKUL: Metadata matched:",
                            trackData.path,
                            meta
                        );

                    }


                    let artist = "";


                    if (
                        meta &&
                        Array.isArray(
                            meta.artists
                        )
                    ) {

                        artist =
                            meta.artists.join(
                                ", "
                            );

                    }


                    return {

                        ...trackData,

                        title:
                            meta &&
                            meta.title
                                ? meta.title
                                : cleanTitle(
                                    trackData.name
                                ),

                        artist:
                            artist

                    };

                }
            );


        /*
            ========================================================
            RENDER TRACK LIST
            ========================================================
        */

        tracksContainer.innerHTML =
            "";


        tracksWithMetadata.forEach(
            function(trackData) {

                const track =
                    createTrackElement(
                        trackData
                    );

                tracksContainer.appendChild(
                    track
                );

            }
        );


        /*
            ========================================================
            CREATE DOM TRACK ARRAY
            ========================================================
        */

        tracks =
            Array.from(
                document.querySelectorAll(
                    ".track"
                )
            );


        updateAllTrackMuteButtons();

        attachTrackListeners();


        console.log(
            "GR8SKUL: metadata loaded:",
            Object.keys(metadata).length
        );


        console.log(
            "GR8SKUL: tracks loaded:",
            tracksWithMetadata
        );


    } catch (error) {

        console.error(
            "GR8SKUL catalog loading failed:",
            error
        );


        tracksContainer.innerHTML =
            "<div style='padding:20px 0; color:#777;'>" +
            "Music catalog loading..." +
            "</div>";

    }

}


/*
    ============================================================
    FIND NEXT ELIGIBLE TRACK
    ============================================================
*/

function findNextUnmutedTrack(
    startIndex
) {

    if (
        tracks.length === 0
    ) {

        return -1;

    }

    let index =
        startIndex;

    for (
        let count = 0;
        count < tracks.length;
        count++
    ) {

        if (
            index >= tracks.length
        ) {

            index = 0;

        }

        if (
            index < 0
        ) {

            index =
                tracks.length - 1;

        }

        if (
            !isTrackMuted(index)
        ) {

            return index;

        }

        index++;

    }

    return -1;

}


/*
    ============================================================
    FIND PREVIOUS ELIGIBLE TRACK
    ============================================================
*/

function findPreviousUnmutedTrack(
    startIndex
) {

    if (
        tracks.length === 0
    ) {

        return -1;

    }

    let index =
        startIndex;

    for (
        let count = 0;
        count < tracks.length;
        count++
    ) {

        if (
            index < 0
        ) {

            index =
                tracks.length - 1;

        }

        if (
            index >= tracks.length
        ) {

            index = 0;

        }

        if (
            !isTrackMuted(index)
        ) {

            return index;

        }

        index--;

    }

    return -1;

}


/*
    ============================================================
    SHUFFLE
    ============================================================
*/

function createShuffleQueue() {

    shuffleQueue =
        tracks
            .map(
                function(track, index) {

                    return index;

                }
            )
            .filter(
                function(index) {

                    return !isTrackMuted(
                        index
                    );

                }
            );


    for (
        let i = shuffleQueue.length - 1;
        i > 0;
        i--
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        const temporary =
            shuffleQueue[i];

        shuffleQueue[i] =
            shuffleQueue[randomIndex];

        shuffleQueue[randomIndex] =
            temporary;

    }

}

function getNextShuffleTrack() {

    shuffleQueue =
        shuffleQueue.filter(
            function(index) {

                return !isTrackMuted(
                    index
                );

            }
        );


    if (
        shuffleQueue.length === 0
    ) {

        createShuffleQueue();

    }


    if (
        shuffleQueue.length === 0
    ) {

        return -1;

    }


    return shuffleQueue.shift();

}


/*
    ============================================================
    NOW PLAYING MUTE BUTTON
    ============================================================
*/

function updateNowPlayingMuteButton() {

    const muteButton =
        nowPlaying.querySelector(
            ".now-playing-mute"
        );

    if (!muteButton) {

        return;

    }

    if (
        isTrackMuted(currentTrack)
    ) {

        muteButton.textContent =
            "UNMUTE";

    } else {

        muteButton.textContent =
            "MUTE";

    }

}


/*
    ============================================================
    MUTE CURRENT TRACK
    ============================================================
*/

function muteCurrentTrack() {

    if (
        currentTrack < 0 ||
        currentTrack >= tracks.length
    ) {

        return;

    }

    setTrackMuted(
        currentTrack,
        true
    );

    playNext();

}


/*
    ============================================================
    TOGGLE TRACK MUTE
    ============================================================
*/

function toggleTrackMute(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }

    const currentlyMuted =
        isTrackMuted(index);


    if (currentlyMuted) {

        setTrackMuted(
            index,
            false
        );

        return;

    }


    setTrackMuted(
        index,
        true
    );


    if (
        index === currentTrack
    ) {

        playNext();

    }

}


/*
    ============================================================
    LOAD TRACK
    ============================================================
*/

function selectTrack(
    index,
    startPlaying = true,
    addToHistory = true
) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }


    if (
        addToHistory &&
        index !== currentTrack &&
        currentTrack !== -1
    ) {

        playHistory.push(
            currentTrack
        );

    }


    currentTrack =
        index;


    tracks.forEach(
        function(track) {

            track.classList.remove(
                "selected"
            );

        }
    );


    const track =
        tracks[index];


    track.classList.add(
        "selected"
    );


    const title =
        track.dataset.title;


    const artist =
        track.dataset.artist;


    const file =
        track.dataset.file;


    audioPlayer.src =
        file;


    /*
        ========================================================
        NOW PLAYING
        ========================================================
    */

    nowPlaying.innerHTML =
        "";


    const nowPlayingText =
        document.createElement(
            "div"
        );


    nowPlayingText.textContent =
        "Now playing: " +
        title +
        (
            artist
                ? " — " + artist
                : ""
        );


    const nowPlayingActions =
        document.createElement(
            "div"
        );


    nowPlayingActions.className =
        "now-playing-actions";


    const muteButton =
        document.createElement(
            "a"
        );


    muteButton.className =
        "now-playing-mute";


    muteButton.href =
        "#";


    muteButton.textContent =
        isTrackMuted(index)
            ? "UNMUTE"
            : "MUTE";


    muteButton.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            if (
                isTrackMuted(
                    currentTrack
                )
            ) {

                setTrackMuted(
                    currentTrack,
                    false
                );

            } else {

                muteCurrentTrack();

            }

        }
    );


    nowPlayingActions.appendChild(
        muteButton
    );


    nowPlaying.appendChild(
        nowPlayingText
    );


    nowPlaying.appendChild(
        nowPlayingActions
    );


    track.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });


    if (startPlaying) {

        audioPlayer.play()

            .then(
                function() {

                    playButton.textContent =
                        "❚❚ PAUSE";

                }
            )

            .catch(
                function() {

                    playButton.textContent =
                        "▶ PLAY";

                }
            );

    }

}


/*
    ============================================================
    FIRST PLAY
    ============================================================
*/

function chooseTrackToPlay() {

    if (
        tracks.length === 0
    ) {

        return;

    }

    let chosenTrack;


    if (shuffle) {

        createShuffleQueue();

        chosenTrack =
            getNextShuffleTrack();

    } else {

        chosenTrack =
            findNextUnmutedTrack(0);

    }


    if (
        chosenTrack === -1
    ) {

        return;

    }


    selectTrack(
        chosenTrack,
        true,
        true
    );

}


/*
    ============================================================
    NEXT
    ============================================================
*/

function playNext() {

    if (
        tracks.length === 0
    ) {

        return;

    }

    let nextTrack;


    if (shuffle) {

        nextTrack =
            getNextShuffleTrack();

    } else {

        nextTrack =
            findNextUnmutedTrack(
                currentTrack + 1
            );

    }


    if (
        nextTrack === -1
    ) {

        audioPlayer.pause();

        playButton.textContent =
            "▶ PLAY";

        return;

    }


    selectTrack(
        nextTrack,
        true,
        true
    );

}


/*
    ============================================================
    PREVIOUS
    ============================================================
*/

function playPrevious() {

    if (
        tracks.length === 0
    ) {

        return;

    }


    if (shuffle) {

        while (
            playHistory.length > 0
        ) {

            const previousTrack =
                playHistory.pop();


            if (
                !isTrackMuted(
                    previousTrack
                )
            ) {

                selectTrack(
                    previousTrack,
                    true,
                    false
                );

                return;

            }

        }

        return;

    }


    const previousTrack =
        findPreviousUnmutedTrack(
            currentTrack - 1
        );


    if (
        previousTrack === -1
    ) {

        return;

    }


    selectTrack(
        previousTrack,
        true,
        true
    );

}


/*
    ============================================================
    PLAY / PAUSE
    ============================================================
*/

playButton.addEventListener(
    "click",
    function() {

        if (
            currentTrack === -1
        ) {

            chooseTrackToPlay();

            return;

        }


        if (
            audioPlayer.paused
        ) {

            audioPlayer.play()

                .then(
                    function() {

                        playButton.textContent =
                            "❚❚ PAUSE";

                    }
                );

        } else {

            audioPlayer.pause();

            playButton.textContent =
                "▶ PLAY";

        }

    }
);


/*
    ============================================================
    BACK
    ============================================================
*/

backButton.addEventListener(
    "click",
    function() {

        if (
            currentTrack === -1
        ) {

            chooseTrackToPlay();

        } else {

            playPrevious();

        }

    }
);


/*
    ============================================================
    NEXT
    ============================================================
*/

nextButton.addEventListener(
    "click",
    function() {

        if (
            currentTrack === -1
        ) {

            chooseTrackToPlay();

        } else {

            playNext();

        }

    }
);


/*
    ============================================================
    SHUFFLE
    ============================================================
*/

shuffleButton.addEventListener(
    "click",
    function() {

        shuffle =
            !shuffle;


        if (shuffle) {

            shuffleButton.textContent =
                "SHUFFLE ON";


            shuffleButton.classList.add(
                "active"
            );


            createShuffleQueue();


            if (
                currentTrack !== -1
            ) {

                shuffleQueue =
                    shuffleQueue.filter(
                        function(index) {

                            return (
                                index !==
                                currentTrack
                            );

                        }
                    );

            }


        } else {

            shuffleButton.textContent =
                "SHUFFLE OFF";


            shuffleButton.classList.remove(
                "active"
            );


            shuffleQueue = [];

        }

    }
);


/*
    ============================================================
    TRACK CLICKS
    ============================================================
*/

function attachTrackListeners() {

    tracks.forEach(
        function(track, index) {

            const muteButton =
                track.querySelector(
                    ".mute-toggle"
                );


            muteButton.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    toggleTrackMute(
                        index
                    );

                }
            );


            track.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target.closest(
                            ".mute-toggle"
                        )
                    ) {

                        return;

                    }


                    /*
                        Manual track selection always works,
                        even if the track is muted.
                    */

                    selectTrack(
                        index,
                        true,
                        true
                    );

                }
            );

        }
    );

}


/*
    ============================================================
    AUDIO PLAYING
    ============================================================
*/

audioPlayer.addEventListener(
    "play",
    function() {

        playButton.textContent =
            "❚❚ PAUSE";


        qualifyUserByPlay();

        startPlaybackClock();

    }
);


/*
    ============================================================
    AUDIO PAUSED
    ============================================================
*/

audioPlayer.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶ PLAY";


        stopPlaybackClock();

    }
);


/*
    ============================================================
    AUDIO FINISHED
    ============================================================
*/

audioPlayer.addEventListener(
    "ended",
    function() {

        stopPlaybackClock();

        playNext();

    }
);


/*
    ============================================================
    PAGE HIDDEN / CLOSED
    ============================================================
*/

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            recordPlaybackTime();

            playbackStartedAt =
                Date.now();

        } else if (
            !audioPlayer.paused &&
            playbackStartedAt === null
        ) {

            playbackStartedAt =
                Date.now();

        }

    }
);


/*
    ============================================================
    START THE APP
    ============================================================
*/

loadCatalog();

loadSponsors();

startSponsorRotation();

</script>
