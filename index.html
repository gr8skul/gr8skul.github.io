
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>gr8skul</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 35px 20px 50px;
        }

        h1 {
            margin: 0 0 35px;
            text-align: center;
            font-size: 42px;
            letter-spacing: 6px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            border: 1px solid #111111;
            background: #ffffff;
            color: #111111;
            cursor: pointer;
            font-size: 16px;
            padding: 12px 18px;
            min-height: 46px;
        }

        button:hover {
            background: #eeeeee;
        }

        #playButton {
            min-width: 120px;
            font-weight: bold;
        }

        #backButton,
        #nextButton {
            width: 50px;
            padding: 12px 5px;
            font-size: 24px;
            line-height: 1;
        }

        #shuffleButton.active {
            background: #111111;
            color: #ffffff;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 25px;
            min-height: 24px;
            font-size: 14px;
            color: #555555;
        }

        .track-list {
            border-top: 1px solid #cccccc;
        }

        .track {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 12px 0;
            border-bottom: 1px solid #cccccc;
            cursor: pointer;
            user-select: none;
        }

        .track:hover {
            background: #f5f5f5;
        }

        .track.selected {
            background: #eeeeee;
        }

        .track-image {
            width: 65px;
            height: 65px;
            flex-shrink: 0;
            margin-right: 15px;
            object-fit: cover;
            background: #dddddd;
        }

        .track-info {
            min-width: 0;
            text-align: left;
        }

        .track-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .track-artist {
            font-size: 14px;
            color: #666666;
        }

        .player {
            margin-top: 30px;
            width: 100%;
        }

        audio {
            width: 100%;
        }

        @media (max-width: 500px) {

            .app {
                padding: 25px 15px 40px;
            }

            h1 {
                font-size: 34px;
                letter-spacing: 4px;
            }

            .controls {
                flex-wrap: wrap;
            }

            .track-image {
                width: 55px;
                height: 55px;
            }

        }
    </style>
</head>

<body>

<div class="app">

    <h1>gr8skul</h1>


    <!-- MAIN CONTROLS -->

    <div class="controls">

        <button id="backButton" type="button" aria-label="Previous track">
            ←
        </button>

        <button id="playButton" type="button">
            ▶ PLAY
        </button>

        <button id="nextButton" type="button"
