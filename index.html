<html lang="en">

<!-- GR8SKUL APP MANIFEST -->

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {

        margin: 0;

        background: #ffffff;

        color: #111111;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        height: 100%;
    }

    body {
        overflow: hidden;
    }

    .app {

        width: 100%;

        max-width: 700px;

        height: 100vh;

        margin: 0 auto;

        padding: 0 20px;

        display: flex;

        flex-direction: column;
    }

    /* =========================
       FIXED HEADER
       ========================= */

    .header {

        flex-shrink: 0;

        background: #ffffff;

        padding-top: 35px;
    }

    h1 {

        margin: 0 0 35px;

        text-align: center;

        font-size: 42px;

        letter-spacing: 6px;

        font-weight: 700;
    }

    h1 img {

        display: block;

        width: auto;

        height: 42px;

        max-width: 100%;

        margin: 0 auto;
    }

    .controls {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 10px;

        margin-bottom: 25px;
    }

    button {

        border: 1px solid #111111;

        background: #ffffff;

        color: #111111;

        cursor: pointer;

        font-size: 16px;

        padding: 12px 18px;

        min-height: 46px;
    }

    button:hover {

        background: #eeeeee;
    }

    #playButton {

        min-width: 120px;

        font-weight: bold;
    }

    #backButton,
    #nextButton {

        width: 50px;

        padding: 12px 5px;

        font-size: 24px;

        line-height: 1;
    }

    #shuffleButton.active {

        background: #111111;

        color: #ffffff;
    }

    .now-playing {

        text-align: center;

        margin-bottom: 10px;

        min-height: 24px;

        font-size: 14px;

        color: #555555;
    }

    .now-playing-actions {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 12px;

        margin-top: 6px;
    }

    .now-playing-mute {

        font-size: 11px;

        color: #888888;

        text-decoration: none;

        letter-spacing: 0.5px;

        cursor: pointer;
    }

    .now-playing-mute:hover {

        color: #111111;

        text-decoration: underline;
    }

    /* =========================
       SPONSOR
       ========================= */

    .sponsor {

        text-align: center;

        min-height: 24px;

        margin-bottom: 15px;

        font-size: 12px;

        color: #888888;
    }

    .sponsor a {

        color: #555555;

        text-decoration: none;

        font-weight: normal;
    }

    .sponsor a:hover {

        color: #111111;

        text-decoration: underline;
    }

    .header-line {

        border-bottom: 1px solid #cccccc;
    }

    /* =========================
       SCROLLING TRACK AREA
       ========================= */

    .track-list {

        flex: 1;

        min-height: 0;

        overflow-y: auto;

        overflow-x: hidden;
    }

    .track {

        display: flex;

        align-items: center;

        width: 100%;

        min-height: 75px;

        padding: 12px 0;

        border-bottom: 1px solid #cccccc;

        cursor: pointer;

        user-select: none;
    }

    .track:hover {

        background: #f5f5f5;
    }

    .track.selected {

        background: #eeeeee;
    }

    .track-info {

        min-width: 0;

        text-align: left;

        flex: 1;
    }

    .track-title {

        font-size: 17px;

        font-weight: bold;

        margin-bottom: 6px;
    }

    .track-actions {

        display: flex;

        align-items: center;

        gap: 12px;
    }

    .mute-toggle {

        font-size: 11px;

        color: #888888;

        text-decoration: none;

        letter-spacing: 0.5px;

        cursor: pointer;
    }

    .mute-toggle:hover {

        color: #111111;

        text-decoration: underline;
    }

    /* =========================
       FIXED FOOTER
       ========================= */

    .player {

        flex-shrink: 0;

        background: #ffffff;

        padding-top: 20px;

        padding-bottom: 20px;

        width: 100%;
    }

    audio {

        width: 100%;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 500px) {

        .app {

            padding: 0 15px;
        }

        .header {

            padding-top: 25px;
        }

        h1 img {

            height: 34px;
        }

        .controls {

            flex-wrap: wrap;
        }

        .track {

            min-height: 65px;
        }

        .track-actions {

            gap: 9px;
        }

    }

</style>

<body>

<div class="app">

<!-- =========================
     FIXED HEADER
     ========================= -->

<div class="header">

    <h1>

        <img
            src="https://gr8skul.github.io/GR8SKUL-HEADER-LOGO.png"
            alt="GR8SKUL">

    </h1>

    <div class="controls">

        <button
            id="backButton"
            type="button"
            aria-label="Previous track">

            ←

        </button>

        <button
            id="playButton"
            type="button">

            ▶ PLAY

        </button>

        <button
            id="nextButton"
            type="button"
            aria-label="Next track">

            →

        </button>

        <button
            id="shuffleButton"
            type="button">

            SHUFFLE OFF

        </button>

    </div>

    <div
        class="now-playing"
        id="nowPlaying">
    </div>

    <!-- =========================
         SPONSOR
         ========================= -->

    <div
        class="sponsor"
        id="sponsor">
    </div>

    <div class="header-line"></div>

</div>

<!-- =========================
     AUTOMATIC TRACK LIST
     ========================= -->

<div
    class="track-list"
    id="trackList">

</div>

<!-- =========================
     FIXED FOOTER
     ========================= -->

<div class="player">

    <audio
        id="audioPlayer"
        controls
        preload="none">
    </audio>

</div>

</div>

<script>

    /*
        ============================================================
        GR8SKUL AUTOMATIC MUSIC CATALOG
        ============================================================

        The GitHub Action creates catalog.json.

        This page reads catalog.json and creates
        the track list automatically.

        You no longer need to add track HTML.
    */


    /*
        ============================================================
        SESSION ID
        ============================================================
    */


    let sessionId =
        localStorage.getItem(
            "gr8skul-session-id"
        );


    if (!sessionId) {

        sessionId =
            crypto.randomUUID();

        localStorage.setItem(
            "gr8skul-session-id",
            sessionId
        );

    }


    const tracksContainer =
        document.getElementById("trackList");


    const playButton =
        document.getElementById("playButton");


    const backButton =
        document.getElementById("backButton");


    const nextButton =
        document.getElementById("nextButton");


    const shuffleButton =
        document.getElementById("shuffleButton");


    const audioPlayer =
        document.getElementById("audioPlayer");


    const nowPlaying =
        document.getElementById("nowPlaying");


    const sponsor =
        document.getElementById("sponsor");


    /*
        ============================================================
        SPONSOR ASSIGNMENT
        ============================================================

        Supabase assigns one sponsor to this browser session.

        The assignment lasts 60 seconds.

        Refreshing the page during that 60-second period
        returns the same sponsor assignment.
    */


    async function loadSponsors() {

        try {

            const response =
                await fetch(
                    "https://rijzolipyabfggrrhgab.supabase.co/rest/v1/rpc/assign_sponsor",
                    {
                        method: "POST",

                        headers: {

                            "apikey":
                                "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                            "Authorization":
                                "Bearer sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm",

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({
                                p_session_id:
                                    sessionId
                            })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Supabase sponsor assignment failed: " +
                    response.status
                );

            }


            const assignment =
                await response.json();


            if (
                !Array.isArray(assignment) ||
                assignment.length === 0
            ) {

                sponsor.innerHTML =
                    "";

                console.warn(
                    "GR8SKUL: No sponsor assignment returned."
                );

                return;

            }


            const ad =
                assignment[0];


            sponsor.innerHTML =
                "";


            const prefix =
                document.createTextNode(
                    "Brought to you by: "
                );


            const link =
                document.createElement(
                    "a"
                );


            link.textContent =
                ad.sponsor_name;


            link.href =
                ad.sponsor_url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            sponsor.appendChild(
                prefix
            );


            sponsor.appendChild(
                link
            );


        } catch (error) {

            console.error(
                "GR8SKUL sponsor assignment could not connect to Supabase.",
                error
            );


            sponsor.innerHTML =
                "";

        }

    }


    /*
        ============================================================
        USER MUTE STORAGE
        ============================================================
    */


    const MUTE_STORAGE_KEY =
        "gr8skul-muted-tracks";


    let mutedTracks = {};


    try {

        const savedMuteSettings =
            localStorage.getItem(
                MUTE_STORAGE_KEY
            );


        if (savedMuteSettings) {

            mutedTracks =
                JSON.parse(
                    savedMuteSettings
                ) || {};

        }

    } catch (error) {

        console.error(
            "GR8SKUL mute settings could not be loaded.",
            error
        );

        mutedTracks = {};

    }


    function saveMuteSettings() {

        try {

            localStorage.setItem(
                MUTE_STORAGE_KEY,
                JSON.stringify(mutedTracks)
            );

        } catch (error) {

            console.error(
                "GR8SKUL mute settings could not be saved.",
                error
            );

        }

    }


    function isTrackMuted(index) {

        if (
            index < 0 ||
            index >= tracks.length
        ) {

            return false;

        }


        const file =
            tracks[index].dataset.file;


        return mutedTracks[file] === true;

    }


    function setTrackMuted(
        index,
        muted
    ) {

        if (
            index < 0 ||
            index >= tracks.length
        ) {

            return;

        }


        const file =
            tracks[index].dataset.file;


        if (muted) {

            mutedTracks[file] = true;

        } else {

            delete mutedTracks[file];

        }


        saveMuteSettings();

        updateTrackMuteButton(index);

        updateNowPlayingMuteButton();


        /*
            Remove newly muted tracks from any
            shuffle queue that already exists.
        */

        if (muted) {

            shuffleQueue =
                shuffleQueue.filter(
                    function(queueIndex) {

                        return !isTrackMuted(
                            queueIndex
                        );

                    }
                );

        }

    }


    /*
        ============================================================
        TRACK DATA
        ============================================================
    */


    let tracks = [];


    let currentTrack = -1;


    let shuffle = false;


    let shuffleQueue = [];


    let playHistory = [];


    /*
        ============================================================
        CLEAN TRACK TITLE
        ============================================================
    */


    function cleanTitle(filename) {

        return filename
            .replace(/\.[^/.]+$/, "")
            .replace(/[_]+/g, " ")
            .trim();

    }


    /*
        ============================================================
        CREATE TRACK HTML
        ============================================================
    */


    function createTrackElement(trackData) {

        const track =
            document.createElement("div");


        track.className =
            "track";


        track.dataset.title =
            cleanTitle(trackData.name);


        track.dataset.file =
            trackData.path;


        const trackInfo =
            document.createElement("div");


        trackInfo.className =
            "track-info";


        const title =
            document.createElement("div");


        title.className =
            "track-title";


        title.textContent =
            cleanTitle(trackData.name);


        const trackActions =
            document.createElement("div");


        trackActions.className =
            "track-actions";


        const muteButton =
            document.createElement("a");


        muteButton.className =
            "mute-toggle";


        muteButton.href =
            "#";


        muteButton.textContent =
            "MUTE";


        trackActions.appendChild(
            muteButton
        );


        trackInfo.appendChild(
            title
        );


        trackInfo.appendChild(
            trackActions
        );


        track.appendChild(
            trackInfo
        );


        return track;

    }


    /*
        ============================================================
        UPDATE TRACK MUTE BUTTON
        ============================================================
    */


    function updateTrackMuteButton(index) {

        if (
            index < 0 ||
            index >= tracks.length
        ) {

            return;

        }


        const track =
            tracks[index];


        const muteButton =
            track.querySelector(
                ".mute-toggle"
            );


        if (!muteButton) {

            return;

        }


        if (
            isTrackMuted(index)
        ) {

            muteButton.textContent =
                "UNMUTE";

        } else {

            muteButton.textContent =
                "MUTE";

        }

    }


    /*
        ============================================================
        UPDATE ALL TRACK MUTE BUTTONS
        ============================================================
    */


    function updateAllTrackMuteButtons() {

        tracks.forEach(
            function(track, index) {

                updateTrackMuteButton(
                    index
                );

            }
        );

    }


    /*
        ============================================================
        LOAD CATALOG
        ============================================================
    */


    async function loadCatalog() {

        try {

            const response =
                await fetch(
                    "catalog.json?cache=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "Catalog could not be loaded."
                );

            }


            const catalog =
                await response.json();


            tracksContainer.innerHTML =
                "";


            catalog.forEach(
                function(trackData) {

                    const track =
                        createTrackElement(
                            trackData
                        );


                    tracksContainer.appendChild(
                        track
                    );

                }
            );


            tracks =
                Array.from(
                    document.querySelectorAll(
                        ".track"
                    )
                );


            updateAllTrackMuteButtons();


            attachTrackListeners();


        } catch (error) {

            console.error(error);


            tracksContainer.innerHTML =
                "<div style='padding:20px 0; color:#777;'>Music catalog loading...</div>";

        }

    }


    /*
        ============================================================
        FIND NEXT ELIGIBLE TRACK
        ============================================================
    */


    function findNextUnmutedTrack(
        startIndex
    ) {

        if (
            tracks.length === 0
        ) {

            return -1;

        }


        let index =
            startIndex;


        for (
            let count = 0;
            count < tracks.length;
            count++
        ) {

            if (
                index >= tracks.length
            ) {

                index = 0;

            }


            if (
                index < 0
            ) {

                index =
                    tracks.length - 1;

            }


            if (
                !isTrackMuted(index)
            ) {

                return index;

            }


            index++;

        }


        return -1;

    }


    /*
        ============================================================
        FIND PREVIOUS ELIGIBLE TRACK
        ============================================================
    */


    function findPreviousUnmutedTrack(
        startIndex
    ) {

        if (
            tracks.length === 0
        ) {

            return -1;

        }


        let index =
            startIndex;


        for (
            let count = 0;
            count < tracks.length;
            count++
        ) {

            if (
                index < 0
            ) {

                index =
                    tracks.length - 1;

            }


            if (
                index >= tracks.length
            ) {

                index = 0;

            }


            if (
                !isTrackMuted(index)
            ) {

                return index;

            }


            index--;

        }


        return -1;

    }


    /*
        ============================================================
        SHUFFLE
        ============================================================
    */


    function createShuffleQueue() {

        shuffleQueue =
            tracks
                .map(
                    function(track, index) {

                        return index;

                    }
                )
                .filter(
                    function(index) {

                        return !isTrackMuted(
                            index
                        );

                    }
                );


        for (
            let i = shuffleQueue.length - 1;
            i > 0;
            i--
        ) {

            const randomIndex =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );


            const temporary =
                shuffleQueue[i];


            shuffleQueue[i] =
                shuffleQueue[randomIndex];


            shuffleQueue[randomIndex] =
                temporary;

        }

    }


    function getNextShuffleTrack() {

        /*
            Remove any tracks that may have been
            muted after the queue was created.
        */

        shuffleQueue =
            shuffleQueue.filter(
                function(index) {

                    return !isTrackMuted(
                        index
                    );

                }
            );


        if (
            shuffleQueue.length === 0
        ) {

            createShuffleQueue();

        }


        if (
            shuffleQueue.length === 0
        ) {

            return -1;

        }


        return shuffleQueue.shift();

    }


    /*
        ============================================================
        NOW PLAYING MUTE BUTTON
        ============================================================
    */


    function updateNowPlayingMuteButton() {

        const muteButton =
            nowPlaying.querySelector(
                ".now-playing-mute"
            );


        if (!muteButton) {

            return;

        }


        if (
            isTrackMuted(currentTrack)
        ) {

            muteButton.textContent =
                "UNMUTE";

        } else {

            muteButton.textContent =
                "MUTE";

        }

    }


    /*
        ============================================================
        MUTE CURRENT TRACK
        ============================================================
    */


    function muteCurrentTrack() {

        if (
            currentTrack < 0 ||
            currentTrack >= tracks.length
        ) {

            return;

        }


        setTrackMuted(
            currentTrack,
            true
        );


        /*
            The current track has just been excluded
            from automatic playback.

            Immediately move to the next eligible track.
        */

        playNext();

    }


    /*
        ============================================================
        TOGGLE TRACK MUTE
        ============================================================
    */


    function toggleTrackMute(index) {

        if (
            index < 0 ||
            index >= tracks.length
        ) {

            return;

        }


        const currentlyMuted =
            isTrackMuted(index);


        /*
            UNMUTE
        */

        if (currentlyMuted) {

            setTrackMuted(
                index,
                false
            );


            /*
                Do not force a currently playing track
                to change simply because it was unmuted.
            */

            return;

        }


        /*
            MUTE
        */

        setTrackMuted(
            index,
            true
        );


        /*
            If the user muted the track that is currently
            playing, immediately move to the next eligible track.
        */

        if (
            index === currentTrack
        ) {

            playNext();

        }

    }


    /*
        ============================================================
        LOAD TRACK
        ============================================================
    */


    function selectTrack(
        index,
        startPlaying = true,
        addToHistory = true
    ) {

        if (
            index < 0 ||
            index >= tracks.length
        ) {

            return;

        }


        if (
            addToHistory &&
            index !== currentTrack &&
            currentTrack !== -1
        ) {

            playHistory.push(
                currentTrack
            );

        }


        currentTrack =
            index;


        tracks.forEach(
            function(track) {

                track.classList.remove(
                    "selected"
                );

            }
        );


        const track =
            tracks[index];


        track.classList.add(
            "selected"
        );


        const title =
            track.dataset.title;


        const file =
            track.dataset.file;


        audioPlayer.src =
            file;


        /*
            ========================================================
            NOW PLAYING
            ========================================================
        */


        nowPlaying.innerHTML =
            "";


        const nowPlayingText =
            document.createElement(
                "div"
            );


        nowPlayingText.textContent =
            "Now playing: " +
            title;


        const nowPlayingActions =
            document.createElement(
                "div"
            );


        nowPlayingActions.className =
            "now-playing-actions";


        const muteButton =
            document.createElement(
                "a"
            );


        muteButton.className =
            "now-playing-mute";


        muteButton.href =
            "#";


        muteButton.textContent =
            isTrackMuted(index)
                ? "UNMUTE"
                : "MUTE";


        muteButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                if (
                    isTrackMuted(
                        currentTrack
                    )
                ) {

                    /*
                        UNMUTE current track.
                    */

                    setTrackMuted(
                        currentTrack,
                        false
                    );

                } else {

                    /*
                        MUTE current track and
                        immediately continue.
                    */

                    muteCurrentTrack();

                }

            }
        );


        nowPlayingActions.appendChild(
            muteButton
        );


        nowPlaying.appendChild(
            nowPlayingText
        );


        nowPlaying.appendChild(
            nowPlayingActions
        );


        /*
            Keep selected track visible.
        */


        track.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });


        if (startPlaying) {

            audioPlayer.play()

                .then(
                    function() {

                        playButton.textContent =
                            "❚❚ PAUSE";

                    }
                )

                .catch(
                    function() {

                        playButton.textContent =
                            "▶ PLAY";

                    }
                );

        }

    }


    /*
        ============================================================
        FIRST PLAY
        ============================================================
    */


    function chooseTrackToPlay() {

        if (
            tracks.length === 0
        ) {

            return;

        }


        let chosenTrack;


        if (shuffle) {

            createShuffleQueue();


            chosenTrack =
                getNextShuffleTrack();

        } else {

            /*
                Start with the first unmuted track.
            */

            chosenTrack =
                findNextUnmutedTrack(0);

        }


        if (
            chosenTrack === -1
        ) {

            return;

        }


        selectTrack(
            chosenTrack,
            true,
            true
        );

    }


    /*
        ============================================================
        NEXT
        ============================================================
    */


    function playNext() {

        if (
            tracks.length === 0
        ) {

            return;

        }


        let nextTrack;


        if (shuffle) {

            nextTrack =
                getNextShuffleTrack();

        } else {

            nextTrack =
                findNextUnmutedTrack(
                    currentTrack + 1
                );

        }


        if (
            nextTrack === -1
        ) {

            /*
                Every track is muted.
            */

            audioPlayer.pause();

            playButton.textContent =
                "▶ PLAY";

            return;

        }


        selectTrack(
            nextTrack,
            true,
            true
        );

    }


    /*
        ============================================================
        PREVIOUS
        ============================================================
    */


    function playPrevious() {

        if (
            tracks.length === 0
        ) {

            return;

        }


        if (shuffle) {

            /*
                Walk backward through playback history
                until an unmuted track is found.
            */

            while (
                playHistory.length > 0
            ) {

                const previousTrack =
                    playHistory.pop();


                if (
                    !isTrackMuted(
                        previousTrack
                    )
                ) {

                    selectTrack(
                        previousTrack,
                        true,
                        false
                    );


                    return;

                }

            }


            return;

        }


        const previousTrack =
            findPreviousUnmutedTrack(
                currentTrack - 1
            );


        if (
            previousTrack === -1
        ) {

            return;

        }


        selectTrack(
            previousTrack,
            true,
            true
        );

    }


    /*
        ============================================================
        PLAY / PAUSE
        ============================================================
    */


    playButton.addEventListener(
        "click",
        function() {

            if (
                currentTrack === -1
            ) {

                chooseTrackToPlay();

                return;

            }


            if (
                audioPlayer.paused
            ) {

                audioPlayer.play()

                    .then(
                        function() {

                            playButton.textContent =
                                "❚❚ PAUSE";

                        }
                    );

            } else {

                audioPlayer.pause();

                playButton.textContent =
                    "▶ PLAY";

            }

        }
    );


    /*
        ============================================================
        BACK
        ============================================================
    */


    backButton.addEventListener(
        "click",
        function() {

            if (
                currentTrack === -1
            ) {

                chooseTrackToPlay();

            } else {

                playPrevious();

            }

        }
    );


    /*
        ============================================================
        NEXT
        ============================================================
    */


    nextButton.addEventListener(
        "click",
        function() {

            if (
                currentTrack === -1
            ) {

                chooseTrackToPlay();

            } else {

                playNext();

            }

        }
    );


    /*
        ============================================================
        SHUFFLE
        ============================================================
    */


    shuffleButton.addEventListener(
        "click",
        function() {

            shuffle =
                !shuffle;


            if (shuffle) {

                shuffleButton.textContent =
                    "SHUFFLE ON";


                shuffleButton.classList.add(
                    "active"
                );


                createShuffleQueue();


                /*
                    Don't immediately repeat
                    the current song.
                */


                if (
                    currentTrack !== -1
                ) {

                    shuffleQueue =
                        shuffleQueue.filter(
                            function(index) {

                                return (
                                    index !==
                                    currentTrack
                                );

                            }
                        );

                }


            } else {

                shuffleButton.textContent =
                    "SHUFFLE OFF";


                shuffleButton.classList.remove(
                    "active"
                );


                shuffleQueue = [];

            }

        }
    );


    /*
        ============================================================
        TRACK CLICKS
        ============================================================
    */


    function attachTrackListeners() {

        tracks.forEach(
            function(track, index) {

                const muteButton =
                    track.querySelector(
                        ".mute-toggle"
                    );


                muteButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();


                        toggleTrackMute(
                            index
                        );

                    }
                );


                track.addEventListener(
                    "click",
                    function(event) {

                        if (
                            event.target.closest(
                                ".mute-toggle"
                            )
                        ) {

                            return;

                        }


                        /*
                            IMPORTANT:
                            Manual track selection always works,
                            even if the track is muted.
                        */

                        selectTrack(
                            index,
                            true,
                            true
                        );

                    }
                );

            }
        );

    }


    /*
        ============================================================
        AUDIO PLAYING
        ============================================================
    */


    audioPlayer.addEventListener(
        "play",
        function() {

            playButton.textContent =
                "❚❚ PAUSE";

        }
    );


    /*
        ============================================================
        AUDIO PAUSED
        ============================================================
    */


    audioPlayer.addEventListener(
        "pause",
        function() {

            playButton.textContent =
                "▶ PLAY";

        }
    );


    /*
        ============================================================
        AUDIO FINISHED
        ============================================================
    */


    audioPlayer.addEventListener(
        "ended",
        function() {

            playNext();

        }
    );


    /*
        ============================================================
        START THE APP
        ============================================================
    */


    loadCatalog();

    loadSponsors();

</script>

</body>
</html>
