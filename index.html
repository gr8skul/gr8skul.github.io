<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<title>gr8skul</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #111111;
        height: 100%;
    }

    body {
        padding-bottom: 105px;
    }

    header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #ffffff;
        z-index: 1000;
        padding: 18px 20px 14px;
    }

    .header-inner {
        max-width: 700px;
        margin: 0 auto;
        text-align: center;
    }

    .logo {
        width: 190px;
        height: auto;
        display: block;
        margin: 0 auto 12px;
    }

    .header-line {
        border: 0;
        border-top: 1px solid #111111;
        margin: 0;
    }

    main {
        max-width: 700px;
        margin: 0 auto;
        padding: 135px 20px 30px;
    }

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin-bottom: 20px;
    }

    button {
        border: none;
        background: none;
        color: #111111;
        cursor: pointer;
        font-size: 22px;
        padding: 5px 8px;
    }

    button:hover {
        opacity: 0.6;
    }

    #playPause {
        font-size: 30px;
    }

    #shuffleButton {
        font-size: 12px;
        letter-spacing: 0.5px;
        min-width: 90px;
    }

    .now-playing {
        text-align: center;
        margin-bottom: 24px;
        min-height: 72px;
    }

    .now-playing-title {
        font-size: 18px;
        margin-bottom: 10px;
    }

    .now-playing-download {
        font-size: 11px;
        color: #111111;
        text-decoration: none;
        letter-spacing: 0.3px;
    }

    .now-playing-download:hover {
        text-decoration: underline;
    }

    .track-list {
        max-height: 285px;
        overflow-y: auto;
        border-top: 1px solid #dddddd;
        border-bottom: 1px solid #dddddd;
    }

    .track {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 8px;
        border-bottom: 1px solid #eeeeee;
        cursor: pointer;
    }

    .track:last-child {
        border-bottom: none;
    }

    .track.selected {
        background: #f1f1f1;
    }

    .track-title {
        flex: 1;
        min-width: 0;
        font-size: 15px;
    }

    .download {
        flex-shrink: 0;
        font-size: 10px;
        color: #111111;
        text-decoration: none;
        letter-spacing: 0.3px;
        cursor: pointer;
    }

    .download:hover {
        text-decoration: underline;
    }

    .loading {
        text-align: center;
        padding: 30px 10px;
        color: #777777;
        font-size: 14px;
    }

    footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #ffffff;
        border-top: 1px solid #dddddd;
        z-index: 1000;
        padding: 12px 20px 15px;
    }

    .player {
        max-width: 700px;
        margin: 0 auto;
    }

    audio {
        width: 100%;
        height: 40px;
    }

    @media (max-width: 600px) {
        header {
            padding-top: 14px;
        }

        .logo {
            width: 170px;
        }

        main {
            padding-top: 125px;
        }

        .track-list {
            max-height: 285px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <img
            src="GR8SKUL-HEADER-LOGO.png"
            alt="gr8skul"
            class="logo"
        >
        <hr class="header-line">
    </div>
</header>

<main>

    <div class="controls">
        <button id="previousButton" aria-label="Previous track">⏮</button>

        <button id="playPause" aria-label="Play or pause">▶</button>

        <button id="nextButton" aria-label="Next track">⏭</button>

        <button id="shuffleButton" aria-label="Shuffle">
            SHUFFLE OFF
        </button>
    </div>

    <div class="now-playing" id="nowPlaying"></div>

    <div class="track-list" id="trackList">
        <div class="loading">Music catalog loading...</div>
    </div>

</main>

<footer>
    <div class="player">
        <audio id="audioPlayer" controls preload="metadata"></audio>
    </div>
</footer>

<script>
const audio = document.getElementById("audioPlayer");
const playPauseButton = document.getElementById("playPause");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const shuffleButton = document.getElementById("shuffleButton");
const trackList = document.getElementById("trackList");
const nowPlaying = document.getElementById("nowPlaying");

let tracks = [];
let currentIndex = -1;
let shuffleOn = false;

let shuffleQueue = [];
let playHistory = [];
let historyPosition = -1;


/* -----------------------------
   CLEAN TRACK TITLE
----------------------------- */

function cleanTitle(filename) {
    return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/[_]+/g, " ")
        .trim();
}


/* -----------------------------
   SHUFFLE
----------------------------- */

function makeShuffleQueue() {
    shuffleQueue = tracks.map((_, index) => index);

    for (let i = shuffleQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [shuffleQueue[i], shuffleQueue[j]] =
            [shuffleQueue[j], shuffleQueue[i]];
    }
}


/* -----------------------------
   PLAY TRACK
----------------------------- */

function playTrack(index, addToHistory = true) {

    if (index < 0 || index >= tracks.length) {
        return;
    }

    currentIndex = index;

    const track = tracks[index];

    audio.src = track.path;
    audio.play();

    playPauseButton.textContent = "⏸";

    updateNowPlaying();
    updateSelectedTrack();

    if (addToHistory) {

        if (
            historyPosition >= 0 &&
            playHistory[historyPosition] === index
        ) {
            return;
        }

        playHistory =
            playHistory.slice(0, historyPosition + 1);

        playHistory.push(index);

        historyPosition =
            playHistory.length - 1;
    }

    if (shuffleOn) {

        const queuePosition =
            shuffleQueue.indexOf(index);

        if (queuePosition !== -1) {
            shuffleQueue.splice(queuePosition, 1);
        }
    }
}


/* -----------------------------
   NEXT TRACK
----------------------------- */

function nextTrack() {

    if (!tracks.length) {
        return;
    }

    if (shuffleOn) {

        if (shuffleQueue.length === 0) {
            makeShuffleQueue();
        }

        const nextIndex = shuffleQueue.shift();

        playTrack(nextIndex);

    } else {

        let nextIndex = currentIndex + 1;

        if (nextIndex >= tracks.length) {
            nextIndex = 0;
        }

        playTrack(nextIndex);
    }
}


/* -----------------------------
   PREVIOUS TRACK
----------------------------- */

function previousTrack() {

    if (!tracks.length) {
        return;
    }

    if (shuffleOn) {

        if (historyPosition > 0) {

            historyPosition--;

            const previousIndex =
                playHistory[historyPosition];

            playTrack(previousIndex, false);
        }

    } else {

        let previousIndex = currentIndex - 1;

        if (previousIndex < 0) {
            previousIndex = tracks.length - 1;
        }

        playTrack(previousIndex);
    }
}


/* -----------------------------
   UPDATE NOW PLAYING
----------------------------- */

function updateNowPlaying() {

    if (currentIndex < 0) {
        nowPlaying.innerHTML = "";
        return;
    }

    const track = tracks[currentIndex];

    const title = cleanTitle(track.name);

    /*
       IMPORTANT:
       This download link uses the exact same
       download behavior as the track-list links.
    */

    nowPlaying.innerHTML = `
        <div class="now-playing-title">
            Now playing: "${title}"
        </div>

        <a
            class="now-playing-download"
            href="${track.path}"
            download
            onclick="event.stopPropagation();"
        >
            DOWNLOAD MP3
        </a>
    `;
}


/* -----------------------------
   UPDATE SELECTED TRACK
----------------------------- */

function updateSelectedTrack() {

    document
        .querySelectorAll(".track")
        .forEach((element, index) => {

            element.classList.toggle(
                "selected",
                index === currentIndex
            );

        });
}


/* -----------------------------
   BUILD TRACK LIST
----------------------------- */

function buildTrackList() {

    trackList.innerHTML = "";

    tracks.forEach((track, index) => {

        const row = document.createElement("div");

        row.className = "track";

        row.innerHTML = `
            <div class="track-title">
                ${cleanTitle(track.name)}
            </div>

            <a
                class="download"
                href="${track.path}"
                download
                onclick="event.stopPropagation();"
            >
                DOWNLOAD MP3
            </a>
        `;

        row.addEventListener("click", () => {

            if (shuffleOn) {
                playTrack(index);
            } else {
                playTrack(index);
            }

        });

        trackList.appendChild(row);
    });

    updateSelectedTrack();
}


/* -----------------------------
   LOAD CATALOG
----------------------------- */

fetch("catalog.json?cache=" + Date.now())
    .then(response => {

        if (!response.ok) {
            throw new Error("Catalog not found");
        }

        return response.json();

    })
    .then(catalog => {

        tracks = catalog;

        buildTrackList();

    })
    .catch(error => {

        console.error(error);

        trackList.innerHTML =
            '<div class="loading">Music catalog loading...</div>';
    });


/* -----------------------------
   PLAY / PAUSE
----------------------------- */

playPauseButton.addEventListener("click", () => {

    if (!tracks.length) {
        return;
    }

    if (currentIndex === -1) {

        if (shuffleOn) {

            if (shuffleQueue.length === 0) {
                makeShuffleQueue();
            }

            const firstIndex = shuffleQueue.shift();

            playTrack(firstIndex);

        } else {

            playTrack(0);
        }

        return;
    }

    if (audio.paused) {

        audio.play();

    } else {

        audio.pause();
    }
});


/* -----------------------------
   AUDIO PLAY / PAUSE DISPLAY
----------------------------- */

audio.addEventListener("play", () => {
    playPauseButton.textContent = "⏸";
});

audio.addEventListener("pause", () => {
    playPauseButton.textContent = "▶";
});


/* -----------------------------
   NEXT / PREVIOUS BUTTONS
----------------------------- */

nextButton.addEventListener("click", nextTrack);

previousButton.addEventListener("click", previousTrack);


/* -----------------------------
   AUTO ADVANCE
----------------------------- */

audio.addEventListener("ended", () => {

    nextTrack();

});


/* -----------------------------
   SHUFFLE BUTTON
----------------------------- */

shuffleButton.addEventListener("click", () => {

    shuffleOn = !shuffleOn;

    if (shuffleOn) {

        shuffleButton.textContent = "SHUFFLE ON";

        makeShuffleQueue();

        /*
           The currently playing track should not
           immediately appear again in the new cycle.
        */

        if (currentIndex !== -1) {

            const position =
                shuffleQueue.indexOf(currentIndex);

            if (position !== -1) {
                shuffleQueue.splice(position, 1);
            }
        }

    } else {

        shuffleButton.textContent = "SHUFFLE OFF";

        shuffleQueue = [];
    }
});

</script>

</body>
</html>
