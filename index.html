/* ============================================================
   IS TRACK MUTED
   ============================================================ */

function isTrackMuted(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return false;

    }

    const file =
        tracks[index].dataset.file;

    return mutedTracks[file] === true;

}


/* ============================================================
   SET TRACK MUTED
   ============================================================ */

function setTrackMuted(
    index,
    muted
) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }

    const file =
        tracks[index].dataset.file;

    if (muted) {

        mutedTracks[file] = true;

    } else {

        delete mutedTracks[file];

    }

    saveMuteSettings();

    updateTrackMuteButton(
        index
    );

    updateNowPlayingMuteButton();

    if (muted) {

        shuffleQueue =
            shuffleQueue.filter(
                function(queueIndex) {

                    return !isTrackMuted(
                        queueIndex
                    );

                }
            );

    }

}


/* ============================================================
   UPDATE TRACK MUTE BUTTON
   ============================================================ */

function updateTrackMuteButton(
    index
) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }

    const track =
        tracks[index];

    const muteButton =
        track.querySelector(
            ".mute-toggle"
        );

    if (!muteButton) {
        return;
    }

    if (isTrackMuted(index)) {

        muteButton.textContent =
            "UNMUTE";

    } else {

        muteButton.textContent =
            "MUTE";

    }

}


/* ============================================================
   UPDATE ALL TRACK MUTE BUTTONS
   ============================================================ */

function updateAllTrackMuteButtons() {

    tracks.forEach(
        function(track, index) {

            updateTrackMuteButton(
                index
            );

        }
    );

}


/* ============================================================
   RENDER FILTERED TRACK LIST
   ============================================================ */

function renderFilteredTracks() {

    const previousFile =
        currentTrackFile;

    const wasPlaying =
        !audioPlayer.paused;


    const filteredData =
        allTrackData.filter(
            function(trackData) {

                return trackMatchesCurrentFilters(
                    trackData
                );

            }
        );


    tracksContainer.innerHTML = "";


    if (
        filteredData.length === 0
    ) {

        const emptyMessage =
            document.createElement("div");

        emptyMessage.className =
            "empty-filter-message";

        emptyMessage.textContent =
            "NO WORKS MATCH THE CURRENT FILTERS.";

        tracksContainer.appendChild(
            emptyMessage
        );

    } else {

        filteredData.forEach(
            function(trackData) {

                const track =
                    createTrackElement(
                        trackData
                    );

                tracksContainer.appendChild(
                    track
                );

            }
        );

    }


    tracks =
        Array.from(
            tracksContainer.querySelectorAll(
                ".track"
            )
        );


    updateAllTrackMuteButtons();

    attachTrackListeners();


    let preservedIndex = -1;


    if (previousFile) {

        preservedIndex =
            tracks.findIndex(
                function(track) {

                    return (
                        track.dataset.file ===
                        previousFile
                    );

                }
            );

    }


    if (
        preservedIndex !== -1
    ) {

        currentTrack =
            preservedIndex;

        tracks.forEach(
            function(track) {

                track.classList.remove(
                    "selected"
                );

            }
        );

        tracks[currentTrack].classList.add(
            "selected"
        );

        updateNowPlayingMuteButton();


        if (
            wasPlaying &&
            audioPlayer.src
        ) {

            audioPlayer.play()
                .catch(
                    function() {

                        playButton.textContent =
                            "▶ PLAY";

                    }
                );

        }

    } else {

        if (wasPlaying) {
            audioPlayer.pause();
        }

        audioPlayer.removeAttribute(
            "src"
        );

        audioPlayer.load();

        currentTrack = -1;

        currentTrackFile = "";

        playHistory = [];

        shuffleQueue = [];

        nowPlaying.innerHTML = "";

    }


    updateFilterStatus(
        filteredData.length
    );

}


/* ============================================================
   APPLY FILTERS
   ============================================================ */

function applyFilters() {

    renderFilteredTracks();

}


/* ============================================================
   LOAD CATALOG + ORDER + METADATA
   ============================================================ */

async function loadCatalog() {

    try {

        const [
            catalogResponse,
            metadataResponse,
            orderResponse
        ] = await Promise.all([

            fetch(
                "catalog.json?cache=" +
                Date.now()
            ),

            fetch(
                "track-metadata.json?cache=" +
                Date.now()
            ),

            fetch(
                "track-order.json?cache=" +
                Date.now()
            )

        ]);


        if (!catalogResponse.ok) {

            throw new Error(
                "Catalog could not be loaded."
            );

        }


        if (!metadataResponse.ok) {

            throw new Error(
                "Track metadata could not be loaded."
            );

        }


        const catalog =
            await catalogResponse.json();

        const metadata =
            await metadataResponse.json();


        let trackOrder = [];


        if (orderResponse.ok) {

            const orderData =
                await orderResponse.json();

            if (Array.isArray(orderData)) {

                trackOrder =
                    orderData;

            }

        }


        const catalogByPath =
            new Map();


        catalog.forEach(
            function(trackData) {

                if (
                    trackData &&
                    trackData.path
                ) {

                    catalogByPath.set(
                        trackData.path,
                        trackData
                    );

                }

            }
        );


        const orderedCatalog = [];


        trackOrder.forEach(
            function(path) {

                if (
                    catalogByPath.has(path)
                ) {

                    orderedCatalog.push(
                        catalogByPath.get(path)
                    );

                    catalogByPath.delete(
                        path
                    );

                }

            }
        );


        catalog.forEach(
            function(trackData) {

                if (
                    trackData &&
                    trackData.path &&
                    catalogByPath.has(
                        trackData.path
                    )
                ) {

                    orderedCatalog.push(
                        trackData
                    );

                    catalogByPath.delete(
                        trackData.path
                    );

                }

            }
        );


        const tracksWithMetadata =
            orderedCatalog.map(
                function(trackData) {

                    const meta =
                        metadata[
                            trackData.path
                        ];


                    if (!meta) {

                        console.warn(
                            "GR8SKUL: No metadata found for:",
                            trackData.path
                        );

                    } else {

                        console.log(
                            "GR8SKUL: Metadata matched:",
                            trackData.path,
                            meta
                        );

                    }


                    let artist = "";


                    if (
                        meta &&
                        Array.isArray(
                            meta.artists
                        )
                    ) {

                        artist =
                            meta.artists.join(
                                ", "
                            );

                    }


                    return {

                        ...trackData,

                        title:
                            meta &&
                            meta.title
                                ? meta.title
                                : cleanTitle(
                                    trackData.name
                                ),

                        artist:
                            artist,

                        genres:
                            meta &&
                            Array.isArray(
                                meta.genres
                            )
                                ? meta.genres
                                : [],

                        genreTypes:
                            meta &&
                            Array.isArray(
                                meta.genreTypes
                            )
                                ? meta.genreTypes
                                : [],

                        moods:
                            meta &&
                            Array.isArray(
                                meta.moods
                            )
                                ? meta.moods
                                : [],

                        moodTypes:
                            meta &&
                            Array.isArray(
                                meta.moodTypes
                            )
                                ? meta.moodTypes
                                : [],

                        eras:
                            meta &&
                            Array.isArray(
                                meta.eras
                            )
                                ? meta.eras
                                : [],

                        eraYears:
                            meta &&
                            Array.isArray(
                                meta.eraYears
                            )
                                ? meta.eraYears
                                : [],

                        regions:
                            meta &&
                            (
                                Array.isArray(
                                    meta.regions
                                ) ||
                                typeof meta.regions ===
                                "string"
                            )
                                ? meta.regions
                                : []

                    };

                }
            );


        allTrackData =
            tracksWithMetadata;


        renderFilteredTracks();


        console.log(
            "GR8SKUL: metadata loaded:",
            Object.keys(metadata).length
        );

        console.log(
            "GR8SKUL: tracks loaded:",
            tracksWithMetadata
        );

    } catch (error) {

        console.error(
            "GR8SKUL catalog loading failed:",
            error
        );

        tracksContainer.innerHTML =
            "<div style='padding:20px 0; color:#777;'>" +
            "Music catalog loading..." +
            "</div>";

    }

}


/* ============================================================
   FIND NEXT ELIGIBLE TRACK
   ============================================================ */

function findNextUnmutedTrack(
    startIndex
) {

    if (tracks.length === 0) {
        return -1;
    }

    let index =
        startIndex;


    for (
        let count = 0;
        count < tracks.length;
        count++
    ) {

        if (
            index >= tracks.length
        ) {

            index = 0;

        }

        if (index < 0) {

            index =
                tracks.length - 1;

        }

        if (
            !isTrackMuted(index)
        ) {

            return index;

        }

        index++;

    }

    return -1;

}


/* ============================================================
   FIND PREVIOUS ELIGIBLE TRACK
   ============================================================ */

function findPreviousUnmutedTrack(
    startIndex
) {

    if (tracks.length === 0) {
        return -1;
    }

    let index =
        startIndex;


    for (
        let count = 0;
        count < tracks.length;
        count++
    ) {

        if (index < 0) {

            index =
                tracks.length - 1;

        }

        if (
            index >= tracks.length
        ) {

            index = 0;

        }

        if (
            !isTrackMuted(index)
        ) {

            return index;

        }

        index--;

    }

    return -1;

}


/* ============================================================
   SHUFFLE
   ============================================================ */

function createShuffleQueue() {

    shuffleQueue =
        tracks
            .map(
                function(track, index) {
                    return index;
                }
            )
            .filter(
                function(index) {

                    return !isTrackMuted(
                        index
                    );

                }
            );


    for (
        let i =
            shuffleQueue.length - 1;
        i > 0;
        i--
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        const temporary =
            shuffleQueue[i];

        shuffleQueue[i] =
            shuffleQueue[randomIndex];

        shuffleQueue[randomIndex] =
            temporary;

    }

}


function getNextShuffleTrack() {

    shuffleQueue =
        shuffleQueue.filter(
            function(index) {

                return !isTrackMuted(
                    index
                );

            }
        );


    if (
        shuffleQueue.length === 0
    ) {

        createShuffleQueue();

    }


    if (
        shuffleQueue.length === 0
    ) {

        return -1;

    }


    return shuffleQueue.shift();

}


/* ============================================================
   NOW PLAYING MUTE BUTTON
   ============================================================ */

function updateNowPlayingMuteButton() {

    const muteButton =
        nowPlaying.querySelector(
            ".now-playing-mute"
        );

    if (!muteButton) {
        return;
    }

    if (
        isTrackMuted(
            currentTrack
        )
    ) {

        muteButton.textContent =
            "UNMUTE";

    } else {

        muteButton.textContent =

    }

}


/* ============================================================
   MUTE CURRENT TRACK
   ============================================================ */

function muteCurrentTrack() {

    if (
        currentTrack < 0 ||
        currentTrack >= tracks.length
    ) {

        return;

    }

    setTrackMuted(
        currentTrack,
        true
    );

    playNext();

}


/* ============================================================
   TOGGLE TRACK MUTE
   ============================================================ */

function toggleTrackMute(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }

    const currentlyMuted =
        isTrackMuted(index);


    if (currentlyMuted) {

        setTrackMuted(
            index,
            false
        );

        return;

    }


    setTrackMuted(
        index,
        true
    );


    if (
        index === currentTrack
    ) {

        playNext();

    }

}


/* ============================================================
   LOAD TRACK
   ============================================================ */

function selectTrack(
    index,
    startPlaying = true,
    addToHistory = true
) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {

        return;

    }


    if (
        addToHistory &&
        index !== currentTrack &&
        currentTrack !== -1
    ) {

        playHistory.push(
            currentTrack
        );

    }


    currentTrack =
        index;


    const track =
        tracks[index];


    currentTrackFile =
        track.dataset.file;


    tracks.forEach(
        function(track) {

            track.classList.remove(
                "selected"
            );

        }
    );


    track.classList.add(
        "selected"
    );


    const title =
        track.dataset.title;

    const artist =
        track.dataset.artist;

    const file =
        track.dataset.file;


    audioPlayer.src =
        file;


    nowPlaying.innerHTML = "";


    const nowPlayingText =
        document.createElement("div");

    nowPlayingText.textContent =
        "Now playing: " +
        title +
        (
            artist
                ? " — " + artist
                : ""
        );


    const nowPlayingActions =
        document.createElement("div");

    nowPlayingActions.className =
        "now-playing-actions";


    const muteButton =
        document.createElement("a");

    muteButton.className =
        "now-playing-mute";

    muteButton.href =
        "#";

    muteButton.textContent =
        isTrackMuted(index)
            ? "UNMUTE"
            : "MUTE";


    muteButton.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            if (
                isTrackMuted(
                    currentTrack
                )
            ) {

                setTrackMuted(
                    currentTrack,
                    false
                );

            } else {

                muteCurrentTrack();

            }

        }
    );


    nowPlayingActions.appendChild(
        muteButton
    );

    nowPlaying.appendChild(
        nowPlayingText
    );

    nowPlaying.appendChild(
        nowPlayingActions
    );


    track.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });


    if (startPlaying) {

        audioPlayer.play()
            .then(
                function() {

                    playButton.textContent =
                        "❚❚ PAUSE";

                }
            )
            .catch(
                function() {

                    playButton.textContent =
                        "▶ PLAY";

                }
            );

    }

}


/* ============================================================
   FIRST PLAY
   ============================================================ */

function chooseTrackToPlay() {

    if (tracks.length === 0) {
        return;
    }

    let chosenTrack;


    if (shuffle) {

        createShuffleQueue();

        chosenTrack =
            getNextShuffleTrack();

    } else {

        chosenTrack =
            findNextUnmutedTrack(0);

    }


    if (
        chosenTrack === -1
    ) {

        return;

    }


    selectTrack(
        chosenTrack,
        true,
        true
    );

}


/* ============================================================
   NEXT
   ============================================================ */

function playNext() {

    if (tracks.length === 0) {
        return;
    }

    let nextTrack;


    if (shuffle) {

        nextTrack =
            getNextShuffleTrack();

    } else {

        nextTrack =
            findNextUnmutedTrack(
                currentTrack + 1
            );

    }


    if (
        nextTrack === -1
    ) {

        audioPlayer.pause();

        playButton.textContent =
            "▶ PLAY";

        return;

    }


    selectTrack(
        nextTrack,
        true,
        true
    );

}


/* ============================================================
   PREVIOUS
   ============================================================ */

function playPrevious() {

    if (tracks.length === 0) {
        return;
    }


    if (shuffle) {

        while (
            playHistory.length > 0
        ) {

            const previousTrack =
                playHistory.pop();

            if (
                !isTrackMuted(
                    previousTrack
                )
            ) {

                selectTrack(
                    previousTrack,
                    true,
                    false
                );

                return;

            }

        }

        return;

    }


    const previousTrack =
        findPreviousUnmutedTrack(
            currentTrack - 1
        );


    if (
        previousTrack === -1
    ) {

        return;

    }


    selectTrack(
        previousTrack,
        true,
        true
    );

}


/* ============================================================
   PLAY / PAUSE
   ============================================================ */

playButton.addEventListener(
    "click",
    function() {

        if (
            currentTrack === -1
        ) {

            chooseTrackToPlay();

            return;

        }


        if (

        ) {

            audioPlayer.play()
                .then(
                    function() {

                        playButton.textContent =
                            "❚❚ PAUSE";

                    }
                );

        } else {

            audioPlayer.pause();

            playButton.textContent =
                "▶ PLAY";

        }

    }
);

backButton.addEventListener(

        } else {

        }

    }
);


/* ============================================================
   NEXT
   ============================================================ */

nextButton.addEventListener(
    "click",
    function() {

        if (
            currentTrack === -1
        ) {

            chooseTrackToPlay();

        } else {

        }

    }
);


/* ============================================================
   SHUFFLE
   ============================================================ */

shuffleButton.addEventListener(
    "click",
    function() {

        shuffle =
            !shuffle;


        if (shuffle) {

            shuffleButton.textContent =
                "SHUFFLE ON";

            shuffleButton.classList.add(
                "active"
            );

            createShuffleQueue();


            if (
                currentTrack !== -1
            ) {

                shuffleQueue =
                    shuffleQueue.filter(
                        function(index) {

                            return (
                                index !==
                                currentTrack
                            );

                        }
                    );

            }

        } else {

            shuffleButton.textContent =
                "SHUFFLE OFF";

            shuffleButton.classList.remove(
                "active"
            );

            shuffleQueue = [];

        }

    }
);


/* ============================================================
   TRACK CLICKS
   ============================================================ */

function attachTrackListeners() {

    tracks.forEach(
        function(track, index) {

            const muteButton =
                track.querySelector(
                    ".mute-toggle"
                );


            muteButton.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();

                    toggleTrackMute(
                        index
                    );

                }
            );


            track.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target.closest(
                            ".mute-toggle"
                        )
                    ) {

                        return;

                    }


                    selectTrack(
                        index,
                        true,
                        true
                    );

                }
            );

        }
    );

}


/* ============================================================
   AUDIO PLAYING
   ============================================================ */

audioPlayer.addEventListener(
    "play",
    function() {

        playButton.textContent =
            "❚❚ PAUSE";

        qualifyUserByPlay();

        startPlaybackClock();

    }
);


/* ============================================================
   AUDIO PAUSED
   ============================================================ */

audioPlayer.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶ PLAY";

        stopPlaybackClock();

    }
);


/* ============================================================
   AUDIO FINISHED
   ============================================================ */

audioPlayer.addEventListener(
    "ended",
    function() {

        stopPlaybackClock();

        playNext();

    }
);


/* ============================================================
   PAGE HIDDEN / CLOSED
   ============================================================ */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            recordPlaybackTime();

            playbackStartedAt =
                Date.now();

        } else if (
            !audioPlayer.paused &&
            playbackStartedAt === null
        ) {

            playbackStartedAt =
                Date.now();

        }

    }
);


/* ============================================================
   START THE APP
   ============================================================ */

async function startApp() {

    try {

        await loadMasterTaxonomy();


        setupTaxonomyTree(
            genreTree,
            genreTrigger
        );


        setupTaxonomyTree(
            moodTree,
            moodTrigger
        );


        setupEraTree();


        setupRegionTree();


        await loadCatalog();

    } catch (error) {

        console.error(
            "GR8SKUL master taxonomy loading failed:",
            error
        );


        genreTree.querySelector(
            ".taxonomy-panel"
        ).innerHTML =
            "<div class='taxonomy-empty'>" +
            "Taxonomy loading..." +
            "</div>";


        moodTree.querySelector(
            ".taxonomy-panel"
        ).innerHTML =
            "<div class='taxonomy-empty'>" +
            "Taxonomy loading..." +
            "</div>";


        eraTree.querySelector(
            ".taxonomy-panel"
        ).innerHTML =
            "<div class='taxonomy-empty'>" +
            "Taxonomy loading..." +
            "</div>";


        regionTree.querySelector(
            ".taxonomy-panel"
        ).innerHTML =
            "<div class='taxonomy-empty'>" +
            "Taxonomy loading..." +
            "</div>";


        await loadCatalog();

    }


    loadSponsors();

    startSponsorRotation();

}


startApp();

</script>
