             data-artist="GR8SKUL"

            <div class="track-image"
                 style="display:flex;align-items:center;justify-content:center;">
                IMAGE
            </div>

            <div class="track-info">
                <div class="track-title">Track Three</div>
                <div class="track-artist">GR8SKUL</div>
            </div>

        </div>


        <div class="track"
             data-title="Track Four"
             data-artist="GR8SKUL"
             data-file="music/track4.mp3">

            <div class="track-image"
                 style="display:flex;align-items:center;justify-content:center;">
                IMAGE
            </div>

                <div class="track-title">Track Four</div>
                <div class="track-artist">GR8SKUL</div>
            </div>

        <audio id="audioPlayer" controls preload="none"></audio>

    </div>

</div>


<script>

    const tracks = Array.from(document.querySelectorAll(".track"));

    const playButton = document.getElementById("playButton");

    const shuffleButton = document.getElementById("shuffleButton");

    const audioPlayer = document.getElementById("audioPlayer");

    const nowPlaying = document.getElementById("nowPlaying");


    let currentTrack = -1;

    let shuffle = false;


    function selectTrack(index, startPlaying = true) {

        if (index < 0 || index >= tracks.length) {
            return;
        }

        currentTrack = index;

        tracks.forEach(function(track) {
            track.classList.remove("selected");
        });

        const track = tracks[index];

        track.classList.add("selected");

        const title = track.dataset.title;

        const artist = track.dataset.artist;

        const file = track.dataset.file;

        audioPlayer.src = file;

        nowPlaying.textContent = "Now playing: " + title + " — " + artist;

        if (startPlaying) {
            audioPlayer.play()
                .then(function() {
                    playButton.textContent = "❚❚ PAUSE";
                })
                .catch(function() {
                    playButton.textContent = "▶ PLAY";
                });
        }
    }


    function playNext() {

        if (tracks.length === 0) {
            return;
        }

        let nextTrack;

        if (shuffle) {

            if (tracks.length === 1) {
                nextTrack = 0;
            } else {

                do {
                    nextTrack = Math.floor(Math.random() * tracks.length);
                }

                while (nextTrack === currentTrack);
            }

        } else {

            nextTrack = currentTrack + 1;

            if (nextTrack >= tracks.length) {
                nextTrack = 0;
            }
        }

        selectTrack(nextTrack, true);
    }


    playButton.addEventListener("click", function() {

        if (currentTrack === -1) {

            selectTrack(0, true);

            return;
        }


        if (audioPlayer.paused) {

            audioPlayer.play()
                .then(function() {
                    playButton.textContent = "❚❚ PAUSE";
                });

        } else {

            audioPlayer.pause();

            playButton.textContent = "▶ PLAY";
        }

    });


    shuffleButton.addEventListener("click", function() {

        shuffle = !shuffle;

        if (shuffle) {

            shuffleButton.textContent = "SHUFFLE ON";

            shuffleButton.classList.add("active");

        } else {

            shuffleButton.textContent = "SHUFFLE OFF";

            shuffleButton.classList.remove("active");
        }

    });


    tracks.forEach(function(track, index) {

        track.addEventListener("click", function() {

            selectTrack(index, true);

        });

    });


    audioPlayer.addEventListener("play", function() {

        playButton.textContent = "❚❚ PAUSE";

    });


    audioPlayer.addEventListener("pause", function() {

        playButton.textContent = "▶ PLAY";

    });


    audioPlayer.addEventListener("ended", function() {

        playNext();

    });

</script>
