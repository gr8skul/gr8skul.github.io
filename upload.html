<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GR8SKUL Works</title>

<link
    rel="icon"
    type="image/png"
    href="/gr8skul-icon.PNG"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.page {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 20px 40px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    display: block;
    width: 190px;
    max-width: 80%;
    height: auto;
    margin: 0 auto 24px;
}

h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 3px;
}

.section {
    margin-top: 30px;
}

.section-title {
    font-size: 12px;
    letter-spacing: 2px;
    color: #666666;
    margin-bottom: 10px;
}

.works-list {
    border-top: 1px solid #d8d8d8;
}

.work-row {
    display: grid;
    grid-template-columns: 38px 1fr 70px;
    align-items: center;
    min-height: 52px;
    border-bottom: 1px solid #d8d8d8;
    cursor: grab;
    user-select: none;
    background: #ffffff;
    touch-action: none;
}

.work-row.dragging {
    opacity: 0.45;
}

.work-row:active {
    cursor: grabbing;
}

.work-number {
    color: #888888;
    font-size: 12px;
    text-align: left;
}

.work-info {
    min-width: 0;
    padding-right: 10px;
}

.work-artist {
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.work-title {
    font-size: 12px;
    color: #666666;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.work-details {
    display: none;
}

.edit-button {
    justify-self: end;
    width: 58px;
    padding: 6px 0;
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
}

.edit-button:hover {
    background: #111111;
    color: #ffffff;
}

.drag-note {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #999999;
    text-align: center;
}

.order-status {
    min-height: 18px;
    margin-top: 10px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: #666666;
}

.add-button {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 13px 0;
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
}

.add-button:hover {
    background: #111111;
    color: #ffffff;
}

.add-form {
    display: none;
    margin-top: 20px;
    border: 1px solid #d8d8d8;
    padding: 20px;
}

.add-form.visible {
    display: block;
}

.form-heading {
    margin-bottom: 20px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #666666;
}

.form-row {
    margin-bottom: 16px;
}

.form-label {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #666666;
}

.form-input,
.form-select {
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border: 1px solid #cccccc;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}

.form-input:focus,
.form-select:focus {
    outline: none;
    border-color: #111111;
}

.form-select[multiple] {
    min-height: 150px;
    padding: 5px;
}

.form-help {
    margin-top: 5px;
    font-size: 9px;
    line-height: 1.4;
    color: #999999;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.form-button {
    flex: 1;
    height: 40px;
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    font-size: 10px;
    letter-spacing: 1.5px;
    cursor: pointer;
}

.form-button:hover {
    background: #111111;
    color: #ffffff;
}

.form-button:disabled {
    opacity: 0.45;
    cursor: default;
}

.form-button:disabled:hover {
    background: #ffffff;
    color: #111111;
}

.form-status {
    min-height: 18px;
    margin-top: 12px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: #666666;
}

.back {
    display: block;
    margin-top: 40px;
    text-align: center;
    color: #666666;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 1.5px;
}

.back:hover {
    color: #111111;
}

@media (max-width: 500px) {

    .page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .work-row {
        grid-template-columns: 32px 1fr 62px;
    }

}

</style>

</head>


<body>


<div class="page">


    <div class="header">

        <img
            class="logo"
            src="/GR8SKUL-HEADER-LOGO.png"
            alt="GR8SKUL"
        >

        <h1>WORKS</h1>

    </div>


    <div class="section">

        <div class="section-title">
            WORKS
        </div>


        <div
            id="worksList"
            class="works-list"
        ></div>


        <div class="drag-note">
            DRAG TO REARRANGE
        </div>


        <div
            id="orderStatus"
            class="order-status"
        ></div>


        <button
            id="addButton"
            class="add-button"
            type="button"
        >
            + ADD
        </button>


        <div
            id="addForm"
            class="add-form"
        >

            <div
                id="formHeading"
                class="form-heading"
            >
                ADD WORK
            </div>


            <div class="form-row">

                <label
                    class="form-label"
                    for="artistInput"
                >
                    ARTIST(S)
                </label>

                <input
                    id="artistInput"

                    type="text"

            <div class="form-row">

                <label

                    TITLE

            <div class="form-row">

                <label
                    class="form-label"

                >

            </div>


            <div class="form-row">

                <label

                    <option value="Acoustic">

                    <option value="Blues">

                    <option value="Classical">
                        CLASSICAL
                    </option>

                    <option value="Country">
                        COUNTRY
                    </option>

                    <option value="Electronic">
                        ELECTRONIC
                    </option>

                    <option value="Folk">
                        FOLK
                    </option>

                    <option value="Hip-Hop">
                        HIP-HOP
                    </option>

                    <option value="Jazz">
                        JAZZ
                    </option>

                    <option value="Pop">
                        POP
                    </option>

                    <option value="Rock">
                        ROCK

                    <option value="Other">
                        OTHER

                <div class="form-help">
                    Hold CTRL (Windows) or CMD (Mac) to select more than one.
                </div>

            </div>


            <div class="form-row">

                <label
                    class="form-label"
                    for="moodInput"
                >
                    MOOD(S)
                </label>

                <select
                    id="moodInput"
                    class="form-select"
                    multiple
                >

                    <option value="Calm">
                        CALM
                    </option>

                    <option value="Dark">
                        DARK
                    </option>

                    <option value="Energetic">
                        ENERGETIC
                    </option>

                    <option value="Happy">
                        HAPPY
                    </option>

                    <option value="Melancholy">
                        MELANCHOLY
                    </option>

                    <option value="Peaceful">
                        PEACEFUL
                    </option>

                    <option value="Romantic">
                        ROMANTIC
                    </option>

                    <option value="Serious">
                        SERIOUS
                    </option>

                    <option value="Uplifting">
                        UPLIFTING
                    </option>

                </select>

                <div class="form-help">
                    Hold CTRL (Windows) or CMD (Mac) to select more than one.
                </div>

            </div>


            <div class="form-actions">

                <button
                    id="cancelButton"
                    class="form-button"
                    type="button"
                >
                    CANCEL
                </button>

                <button
                    id="uploadButton"
                    class="form-button"
                    type="button"
                >
                    UPLOAD
                </button>

            </div>


            <div
                id="formStatus"
                class="form-status"
            ></div>


        </div>

    </div>


    <a
        class="back"
        href="/"
    >
        BACK TO GR8SKUL
    </a>


</div>


<script>


/* =========================================================
   GR8SKUL
   WORKS
   ========================================================= */


/* ---------------------------------------------------------
   EXISTING CATALOG
   --------------------------------------------------------- */

const CATALOG_URL =
    "/catalog.json";


/* ---------------------------------------------------------
   EXISTING LOCAL ORDER
   --------------------------------------------------------- */

const LOCAL_ORDER_KEY =
    "gr8skul-works-order";


/* ---------------------------------------------------------
   SUPABASE
   --------------------------------------------------------- */

const SUPABASE_URL =
    "https://rijzolipyabfggrrhgab.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm";


/* ---------------------------------------------------------
   EXISTING WORKING REARRANGE FUNCTION
   --------------------------------------------------------- */

const UPDATE_ORDER_FUNCTION =
    SUPABASE_URL +
    "/functions/v1/update-track-order";


/* ---------------------------------------------------------
   NEW UPLOAD FUNCTION
   ---------------------------------------------------------
   The backend will be created next.

   DO NOT change the existing UPDATE_ORDER_FUNCTION.
   --------------------------------------------------------- */

const UPLOAD_WORK_FUNCTION =
    SUPABASE_URL +
    "/functions/v1/upload-work";


/* ---------------------------------------------------------
   STATE
   --------------------------------------------------------- */

let works = [];

let draggedRow = null;

let editingIndex = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const worksList =
    document.getElementById(
        "worksList"
    );


const orderStatus =
    document.getElementById(
        "orderStatus"
    );


const addButton =
    document.getElementById(
        "addButton"
    );


const addForm =
    document.getElementById(
        "addForm"
    );


const formHeading =
    document.getElementById(
        "formHeading"
    );


const artistInput =
    document.getElementById(
        "artistInput"
    );


const titleInput =
    document.getElementById(
        "titleInput"
    );


const mp3Input =
    document.getElementById(
        "mp3Input"
    );


const genreInput =
    document.getElementById(
        "genreInput"
    );


const moodInput =
    document.getElementById(
        "moodInput"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const uploadButton =
    document.getElementById(
        "uploadButton"
    );


const formStatus =
    document.getElementById(
        "formStatus"
    );


/* =========================================================
   NORMALIZE WORK
   =========================================================
   This lets the page understand BOTH:

   OLD:
       "music/song.mp3"

   NEW:
       {
           file: "...",
           title: "...",
           artists: [...],
           genres: [...],
           moods: [...]
       }

   This is important during the transition.
   ========================================================= */

function normalizeWork(work) {

    if (typeof work === "string") {

        const file =
            work;

        const filename =
            file
                .split("/")
                .pop();


        const withoutExtension =
            filename
                ? filename.replace(
                    /\.mp3$/i,
                    ""
                )
                : "";


        return {

            file:
                file,

            title:
                withoutExtension,

            artists:
                [],

            genres:
                [],

            moods:
                []

        };

    }


    if (
        work &&
        typeof work === "object"
    ) {

        return {

            ...work,

            file:
                work.file ||
                work.filename ||
                work.path ||
                work.url ||
                work.src ||
                work.audio ||
                "",

            title:
                work.title ||
                work.track_title ||
                work.name ||
                "",

            artists:
                normalizeArray(
                    work.artists ||
                    work.artist ||
                    work.artist_name
                ),

            genres:
                normalizeArray(
                    work.genres ||
                    work.genre
                ),

            moods:
                normalizeArray(
                    work.moods ||
                    work.mood
                )

        };

    }


    return {

        file: "",

        title: "",

        artists: [],

        genres: [],

        moods: []

    };

}


/* =========================================================
   NORMALIZE ARRAY
   ========================================================= */

function normalizeArray(value) {

    if (Array.isArray(value)) {

        return value
            .map(
                function(item) {

                    return String(item)
                        .trim();

                }
            )
            .filter(Boolean);

    }


    if (
        typeof value ===
        "string"
    ) {

        return value
            .split(",")
            .map(
                function(item) {

                    return item.trim();

                }
            )
            .filter(Boolean);

    }


    return [];

}


/* =========================================================
   LOAD WORKS
   ========================================================= */

async function loadWorks() {

    try {

        const response =
            await fetch(
                CATALOG_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load catalog"
            );

        }


        const data =
            await response.json();


        let loadedWorks;


        if (
            Array.isArray(data)
        ) {

            loadedWorks =
                data;

        } else if (
            data &&
            Array.isArray(data.tracks)
        ) {

            loadedWorks =
                data.tracks;

        } else {

            throw new Error(
                "Invalid catalog format"
            );

        }


        works =
            loadedWorks.map(
                normalizeWork
            );


        applyLocalOrder();

        renderWorks();

    } catch (error) {

        console.error(
            "Could not load works:",
            error
        );


        worksList.innerHTML =
            "<div style=\"padding:20px;text-align:center;color:#888;font-size:12px;\">" +
            "COULD NOT LOAD WORKS" +
            "</div>";

    }

}


/* =========================================================
   WORK KEY
   ========================================================= */

function getWorkKey(work) {

    if (
        typeof work ===
        "string"
    ) {

        return work;

    }


    if (
        !work ||
        typeof work !==
        "object"
    ) {

        return "";

    }


    return (
        work.file ||
        work.filename ||
        work.path ||
        work.url ||
        work.src ||
        work.audio ||
        ""
    );

}


/* =========================================================
   APPLY LOCAL ORDER
   ========================================================= */

function applyLocalOrder() {

    try {

        const saved =
            localStorage.getItem(
                LOCAL_ORDER_KEY
            );


        if (!saved) {

            return;

        }


        const savedWorks =
            JSON.parse(
                saved
            );


        if (
            !Array.isArray(
                savedWorks
            )
        ) {

            return;

        }


        const savedKeys =
            savedWorks
                .map(
                    getWorkKey
                )
                .filter(Boolean);


        if (
            !savedKeys.length
        ) {

            return;

        }


        const byKey =
            new Map();


        works.forEach(
            function(work) {

                const key =
                    getWorkKey(
                        work
                    );


                if (key) {

                    byKey.set(
                        key,
                        work
                    );

                }

            }
        );


        const reordered = [];


        savedKeys.forEach(
            function(key) {

                if (
                    byKey.has(
                        key
                    )
                ) {

                    reordered.push(
                        byKey.get(
                            key
                        )
                    );


                    byKey.delete(
                        key
                    );

                }

            }
        );


        works.forEach(
            function(work) {

                const key =
                    getWorkKey(
                        work
                    );


                if (
                    key &&
                    byKey.has(
                        key
                    )
                ) {

                    reordered.push(
                        work
                    );


                    byKey.delete(
                        key
                    );

                }

            }
        );


        if (
            reordered.length
        ) {

            works =
                reordered;

        }

    } catch (error) {

        console.error(
            "Could not apply local works order:",
            error
        );

    }

}


/* =========================================================
   RENDER WORKS
   ========================================================= */

function renderWorks() {

    worksList.innerHTML =
        "";


    works.forEach(
        function(work, index) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "work-row";


            row.dataset.index =
                index;


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "work-number";


            number.textContent =
                String(
                    index + 1
                ).padStart(
                    2,
                    "0"
                );


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "work-info";


            const artist =
                document.createElement(
                    "div"
                );


            artist.className =
                "work-artist";


            artist.textContent =
                work.artists
                    .join(
                        ", "
                    );


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "work-title";


            title.textContent =
                work.title ||
                getFilenameTitle(
                    work.file
                );


            info.appendChild(
                artist
            );


            info.appendChild(
                title
            );


            const edit =
                document.createElement(
                    "button"
                );


            edit.className =
                "edit-button";


            edit.type =
                "button";


            edit.textContent =
                "EDIT";


            edit.addEventListener(
                "pointerdown",
                function(event) {

                    event.stopPropagation();

                }
            );


            edit.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();


                    editWork(
                        work,
                        index
                    );

                }
            );


            row.appendChild(
                number
            );


            row.appendChild(
                info
            );


            row.appendChild(
                edit
            );


            addPointerDragHandlers(
                row
            );


            worksList.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   FILENAME TITLE
   ========================================================= */

function getFilenameTitle(
    file
) {

    if (!file) {

        return "";

    }


    const filename =
        file
            .split("/")
            .pop();


    return filename
        ? filename.replace(
            /\.mp3$/i,
            ""
        )
        : "";

}


/* =========================================================
   EDIT WORK
   ========================================================= */

function editWork(
    work,
    index
) {

    editingIndex =
        index;


    formHeading.textContent =
        "EDIT WORK";


    artistInput.value =
        work.artists.join(
            ", "
        );


    titleInput.value =
        work.title ||
        getFilenameTitle(
            work.file
        );


    setSelectedValues(
        genreInput,
        work.genres
    );


    setSelectedValues(
        moodInput,
        work.moods
    );


    mp3Input.value =
        "";


    formStatus.textContent =
        "";


    addForm.classList.add(
        "visible"
    );


    window.scrollTo(
        {
            top:
                addForm.offsetTop -
                20,

            behavior:
                "smooth"
        }
    );

}


/* =========================================================
   SET MULTI-SELECT VALUES
   ========================================================= */

function setSelectedValues(
    select,
    values
) {

    const selected =
        new Set(
            values || []
        );


    Array.from(
        select.options
    ).forEach(
        function(option) {

            option.selected =
                selected.has(
                    option.value
                );

        }
    );

}


/* =========================================================
   GET MULTI-SELECT VALUES
   ========================================================= */

function getSelectedValues(
    select
) {

    return Array.from(
        select.selectedOptions
    ).map(
        function(option) {

            return option.value;

        }
    );

}


/* =========================================================
   ARTIST VALUES
   ========================================================= */

function getArtistValues() {

    return artistInput.value
        .split(",")
        .map(
            function(value) {

                return value.trim();

            }
        )
        .filter(Boolean);

}


/* =========================================================
   DRAG TO REARRANGE
   ========================================================= */

function addPointerDragHandlers(
    element
) {

    element.setAttribute(
        "draggable",
        "true"
    );


    /* -----------------------------------------------------
       START DRAG
       ----------------------------------------------------- */

    element.addEventListener(
        "dragstart",
        function(event) {

            if (
                event.target.closest(
                    ".edit-button"
                )
            ) {

                event.preventDefault();

                return;

            }


            draggedRow =
                element;


            element.classList.add(
                "dragging"
            );


            event.dataTransfer.effectAllowed =
                "move";


            event.dataTransfer.setData(
                "text/plain",
                element.dataset.index
            );

        }
    );


    /* -----------------------------------------------------
       DRAG OVER
       ----------------------------------------------------- */

    element.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();


            if (
                !draggedRow ||
                draggedRow === element
            ) {

                return;

            }


            const rect =
                element.getBoundingClientRect();


            const midpoint =
                rect.top +
                rect.height / 2;


            if (
                event.clientY <
                midpoint
            ) {

                worksList.insertBefore(
                    draggedRow,
                    element
                );

            } else {

                worksList.insertBefore(
                    draggedRow,
                    element.nextSibling
                );

            }

        }
    );


    /* -----------------------------------------------------
       DROP
       ----------------------------------------------------- */

    element.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

        }
    );


    /* -----------------------------------------------------
       END DRAG
       ----------------------------------------------------- */

    element.addEventListener(
        "dragend",
        function() {

            if (!draggedRow) {

                return;

            }


            draggedRow.classList.remove(
                "dragging"
            );


            draggedRow =
                null;


            saveCurrentDomOrder();

        }
    );

}


/* =========================================================
   SAVE CURRENT DOM ORDER
   =========================================================
   IMPORTANT:

   This remains compatible with the existing
   update-track-order Edge Function.

   The backend still receives ONLY:

       [
           "music/file-a.mp3",
           "music/file-b.mp3"
       ]

   ========================================================= */

async function saveCurrentDomOrder() {

    const rows =
        Array.from(
            worksList.children
        );


    const previousWorks =
        [
            ...works
        ];


    const reordered =
        rows.map(
            function(row) {

                return works[
                    Number(
                        row.dataset.index
                    )
                ];

            }
        );


    if (
        reordered.length !==
        works.length
    ) {

        return;

    }


    works =
        reordered;


    renderWorks();


    /* -----------------------------------------------------
       LOCAL COPY
       ----------------------------------------------------- */

    try {

        localStorage.setItem(
            LOCAL_ORDER_KEY,
            JSON.stringify(
                works
            )
        );

    } catch (error) {

        console.error(
            "Could not save local works order:",
            error
        );

    }


    /* -----------------------------------------------------
       BUILD TRACK ORDER

       The metadata objects stay on the page,
       but the existing rearrange backend
       receives only their file paths.
       ----------------------------------------------------- */

    const tracks =
        works
            .map(
                getWorkKey
            )
            .filter(
                Boolean
            );


    if (
        tracks.length !==
        works.length
    ) {

        console.error(
            "One or more works has no file path."
        );


        works =
            previousWorks;


        renderWorks();


        setOrderStatus(
            "COULD NOT SAVE ORDER"
        );


        return;

    }


    setOrderStatus(
        "SAVING ORDER..."
    );


    try {

        const response =
            await fetch(
                UPDATE_ORDER_FUNCTION,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    },

                    body:
                        JSON.stringify(
                            {
                                tracks:
                                    tracks
                            }
                        )

                }
            );


        const result =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                result.error ||
                result.message ||
                (
                    "HTTP " +
                    response.status
                )
            );

        }


        if (
            result.success !==
            true
        ) {

            throw new Error(
                result.error ||
                "Order update failed"
            );

        }


        setOrderStatus(
            "ORDER SAVED"
        );


        setTimeout(
            function() {

                setOrderStatus(
                    ""
                );

            },
            2500
        );


    } catch (error) {

        console.error(
            "Could not permanently save works order:",
            error
        );


        works =
            previousWorks;


        try {

            localStorage.setItem(
                LOCAL_ORDER_KEY,
                JSON.stringify(
                    works
                )
            );

        } catch (storageError) {

            console.error(
                storageError
            );

        }


        renderWorks();


        setOrderStatus(
            "COULD NOT SAVE ORDER"
        );

    }

}

) {

}

function setFormStatus(

function resetForm() {

    formHeading.textContent =

    artistInput.value =

    titleInput.value =
        "";


    mp3Input.value =

    );

    );

    );

}


/* =========================================================
   OPEN ADD FORM
   ========================================================= */

addButton.addEventListener(
    "click",
    function() {

        if (
            addForm.classList.contains(
                "visible"
            )
        ) {

            addForm.classList.remove(
                "visible"
            );

            resetForm();

            return;

        }


        resetForm();


        addForm.classList.add(
            "visible"
        );

    }
);


/* =========================================================
   CANCEL
   ========================================================= */

cancelButton.addEventListener(
    "click",
    function() {

        addForm.classList.remove(
            "visible"
        );


        resetForm();

    }
);


/* =========================================================
   UPLOAD / SAVE
   =========================================================
   The actual backend is the next piece.

   This handler collects the complete work record
   and will send it to the new upload-work Edge Function.

   ========================================================= */

uploadButton.addEventListener(
    "click",
    async function() {

        setFormStatus(
            ""
        );


        const artists =
            getArtistValues();


        const title =
            titleInput.value.trim();


        const genres =
            getSelectedValues(
                genreInput
            );


        const moods =
            getSelectedValues(
                moodInput
            );


        const file =
            mp3Input.files[0] ||
            null;


        /* -------------------------------------------------
           ADD VALIDATION
           ------------------------------------------------- */

        if (
            editingIndex === null &&
            !file
        ) {

            setFormStatus(
                "SELECT AN MP3"
            );

            return;

        }


        if (!title) {

            setFormStatus(
                "TITLE REQUIRED"
            );

            return;

        }


        if (!artists.length) {

            setFormStatus(
                "ARTIST REQUIRED"
            );

            return;

        }


        if (!genres.length) {

            setFormStatus(
                "SELECT AT LEAST ONE GENRE"
            );

            return;

        }


        if (!moods.length) {

            setFormStatus(
                "SELECT AT LEAST ONE MOOD"
            );

            return;

        }


        /* -------------------------------------------------
           MP3 VALIDATION
           ------------------------------------------------- */

        if (
            file &&
            !(
                file.type ===
                "audio/mpeg"
                ||
                /\.mp3$/i.test(
                    file.name
                )
            )
        ) {

            setFormStatus(
                "MP3 FILES ONLY"
            );

            return;

        }


        /* -------------------------------------------------
           BUILD TRACK DATA
           ------------------------------------------------- */

        const metadata = {

            title:
                title,

            artists:
                artists,

            genres:
                genres,

            moods:
                moods

        };


        /* -------------------------------------------------
           EDIT EXISTING WORK

           If editing and no replacement MP3 was selected,
           retain the existing file.
           ------------------------------------------------- */

        if (
            editingIndex !== null
        ) {

            const existingWork =
                works[
                    editingIndex
                ];


            metadata.file =
                getWorkKey(
                    existingWork
                );

        }


        /* -------------------------------------------------
           BUILD FORM DATA
           ------------------------------------------------- */

        const formData =
            new FormData();


        formData.append(
            "metadata",
            JSON.stringify(
                metadata
            )
        );


        if (file) {

            formData.append(
                "mp3",
                file,
                file.name
            );

        }


        if (
            editingIndex !== null
        ) {

            formData.append(
                "mode",
                "edit"
            );

        } else {

            formData.append(
                "mode",
                "add"
            );

        }


        /* -------------------------------------------------
           DISABLE BUTTON WHILE WORKING
           ------------------------------------------------- */

        uploadButton.disabled =
            true;


        uploadButton.textContent =
            editingIndex !== null
                ? "SAVING..."
                : "UPLOADING...";


        setFormStatus(
            "PLEASE WAIT..."
        );


        try {

            /*
             * The Edge Function does not exist yet.
             *
             * We are deliberately connecting this page
             * to the endpoint we are about to create:
             *
             *     /functions/v1/upload-work
             */

           ```js
const response =
    await fetch(
        UPLOAD_WORK_FUNCTION,
        {

            method:
                "POST",

            headers: {

                "apikey":
                    SUPABASE_KEY

            },

            body:
                formData

        }
    );


const result =
    await response.json();


if (
    !response.ok
) {

    throw new Error(
        result.error ||
        result.message ||
        (
            "HTTP " +
            response.status
        )
    );

}


if (
    result.success !==
    true
) {

    throw new Error(
        result.error ||
        "Work could not be saved"
    );

}


setFormStatus(
    editingIndex !== null
        ? "WORK SAVED"
        : "WORK UPLOADED"
);


/*
 * Reload from catalog/backend after success.
 */

await loadWorks();


setTimeout(
    function() {

        addForm.classList.remove(
            "visible"
        );


        resetForm();

    },
    1000
);



/* =========================================================
   START
   ========================================================= */

loadWorks();


</script>
