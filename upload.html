<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GR8SKUL Works</title>

<link
    rel="icon"
    type="image/png"
    href="/gr8skul-icon.PNG"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.page {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 20px 40px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    display: block;
    width: 190px;
    max-width: 80%;
    height: auto;
    margin: 0 auto 24px;
}

h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 3px;
}

.section {
    margin-top: 30px;
}

.section-title {
    font-size: 12px;
    letter-spacing: 2px;
    color: #666666;
    margin-bottom: 10px;
}

.works-list {
    border-top: 1px solid #d8d8d8;
}

.work-row {
    display: grid;
    grid-template-columns: 38px 1fr 70px;
    align-items: center;
    min-height: 52px;
    border-bottom: 1px solid #d8d8d8;
    cursor: grab;
    user-select: none;
    background: #ffffff;
    touch-action: none;
}

.work-row.dragging {
    opacity: 0.45;
}

.work-row:active {
    cursor: grabbing;
}

.work-row.dragging {
    opacity: 0.45;
}

.work-number {
    color: #888888;
    font-size: 12px;
    text-align: left;
}

.work-info {
    min-width: 0;
    padding-right: 10px;
}

.work-artist {
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.work-title {
    font-size: 12px;
    color: #666666;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.edit-button {
    justify-self: end;
    width: 58px;
    padding: 6px 0;
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
}

.edit-button:hover {
    background: #111111;
    color: #ffffff;
}

.drag-note {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #999999;
    text-align: center;
}

.order-status {
    min-height: 18px;
    margin-top: 10px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: #666666;
}

.add-button {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 13px 0;
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
}

.add-button:hover {
    background: #111111;
    color: #ffffff;
}

.add-form {
    display: none;
    margin-top: 20px;
    border: 1px solid #d8d8d8;
    padding: 20px;
}

.add-form.visible {
    display: block;
}

.form-row {
    margin-bottom: 16px;
}

.form-label {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #666666;
}

.form-input,
.form-select {
    width: 100%;
    height: 38px;
    padding: 0 10px;
    border: 1px solid #cccccc;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}

.form-input:focus,
.form-select:focus {
    outline: none;
    border-color: #111111;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.form-button {
    flex: 1;
    height: 40px;
    border: 1px solid #111111;
    background: #ffffff;
    color: #111111;
    font-size: 10px;
    letter-spacing: 1.5px;
    cursor: pointer;
}

.form-button:hover {
    background: #111111;
    color: #ffffff;
}

.back {
    display: block;
    margin-top: 40px;
    text-align: center;
    color: #666666;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 1.5px;
}

.back:hover {
    color: #111111;
}

@media (max-width: 500px) {

    .page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .work-row {
        grid-template-columns: 32px 1fr 62px;
    }

}

</style>

</head>


<body>


<div class="page">


    <div class="header">

        <img
            class="logo"
            src="/GR8SKUL-HEADER-LOGO.png"
            alt="GR8SKUL"
        >

        <h1>WORKS</h1>

    </div>


    <div class="section">

        <div class="section-title">
            WORKS
        </div>

        <div
            id="worksList"
            class="works-list"
        ></div>

        <div class="drag-note">
            DRAG TO REARRANGE
        </div>

        <div
            id="orderStatus"
            class="order-status"
        ></div>

        <button
            id="addButton"
            class="add-button"
            type="button"
        >
            + ADD
        </button>


        <div
            id="addForm"
            class="add-form"
        >

            <div class="form-row">

                <label class="form-label">
                    ARTIST
                </label>

                <input
                    id="artistInput"
                    class="form-input"
                    type="text"
                >

            </div>


            <div class="form-row">

                <label class="form-label">
                    TITLE
                </label>

                <input
                    id="titleInput"
                    class="form-input"
                    type="text"
                >

            </div>


            <div class="form-row">

                <label class="form-label">
                    MP3
                </label>

                <input
                    id="mp3Input"
                    class="form-input"
                    type="file"
                    accept=".mp3,audio/mpeg"
                >

            </div>


            <div class="form-row">

                <label class="form-label">
                    GENRE
                </label>

                <select
                    id="genreInput"
                    class="form-select"
                >

                    <option value="">
                        SELECT GENRE
                    </option>

                    <option value="Acoustic">
                        ACOUSTIC
                    </option>

                    <option value="Alternative">
                        ALTERNATIVE
                    </option>

                    <option value="Blues">
                        BLUES
                    </option>

                    <option value="Classical">
                        CLASSICAL
                    </option>

                    <option value="Country">
                        COUNTRY
                    </option>

                    <option value="Electronic">
                        ELECTRONIC
                    </option>

                    <option value="Folk">
                        FOLK
                    </option>

                    <option value="Hip-Hop">
                        HIP-HOP
                    </option>

                    <option value="Jazz">
                        JAZZ
                    </option>

                    <option value="Pop">
                        POP
                    </option>

                    <option value="Rock">
                        ROCK
                    </option>

                    <option value="Other">
                        OTHER
                    </option>

                </select>

            </div>


            <div class="form-row">

                <label class="form-label">
                    MOOD
                </label>

                <select
                    id="moodInput"
                    class="form-select"
                >

                    <option value="">
                        SELECT MOOD
                    </option>

                    <option value="Calm">
                        CALM
                    </option>

                    <option value="Dark">
                        DARK
                    </option>

                    <option value="Energetic">
                        ENERGETIC
                    </option>

                    <option value="Happy">
                        HAPPY
                    </option>

                    <option value="Melancholy">
                        MELANCHOLY
                    </option>

                    <option value="Peaceful">
                        PEACEFUL
                    </option>

                    <option value="Romantic">
                        ROMANTIC
                    </option>

                    <option value="Serious">
                        SERIOUS
                    </option>

                    <option value="Uplifting">
                        UPLIFTING
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <button
                    id="cancelButton"
                    class="form-button"
                    type="button"
                >
                    CANCEL
                </button>

                <button
                    id="uploadButton"
                    class="form-button"
                    type="button"
                >
                    UPLOAD
                </button>

            </div>

        </div>

    </div>


    <a
        class="back"
        href="/"
    >
        BACK TO GR8SKUL
    </a>


</div>


<script>


/* =========================================================
   GR8SKUL
   WORKS
   ========================================================= */


const CATALOG_URL =
    "/catalog.json";


const LOCAL_ORDER_KEY =
    "gr8skul-works-order";


const SUPABASE_URL =
    "https://rijzolipyabfggrrhgab.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpYDjyTMxqW4EgbXfcPzCQ_NFfKiVpm";


const UPDATE_ORDER_FUNCTION =
    SUPABASE_URL +
    "/functions/v1/update-track-order";


let works = [];


let touchDrag = null;


/* =========================================================
   ELEMENTS
   ========================================================= */


const worksList =
    document.getElementById(
        "worksList"
    );


const orderStatus =
    document.getElementById(
        "orderStatus"
    );


const addButton =
    document.getElementById(
        "addButton"
    );


const addForm =
    document.getElementById(
        "addForm"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


/* =========================================================
   LOAD WORKS
   ========================================================= */


async function loadWorks() {

    try {

        const response =
            await fetch(
                CATALOG_URL +
                "?t=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "Could not load catalog"
            );

        }

        const data =
            await response.json();


        if (Array.isArray(data)) {

            works = data;

        } else if (
            data &&
            Array.isArray(data.tracks)
        ) {

            works =
                data.tracks;

        } else {

            throw new Error(
                "Invalid catalog format"
            );

        }


        applyLocalOrder();

        renderWorks();

    } catch (error) {

        console.error(
            "Could not load works:",
            error
        );

        worksList.innerHTML =
            "<div style=\"padding:20px;text-align:center;color:#888;font-size:12px;\">" +
            "COULD NOT LOAD WORKS" +
            "</div>";

    }

}


/* =========================================================
   WORK KEY
   ========================================================= */


function getWorkKey(work) {

    if (typeof work === "string") {

        return work;

    }

    return (
        work.file ||
        work.filename ||
        work.path ||
        work.url ||
        work.src ||
        work.audio ||
        ""
    );

}


/* =========================================================
   APPLY LOCAL ORDER
   ========================================================= */


function applyLocalOrder() {

    try {

        const saved =
            localStorage.getItem(
                LOCAL_ORDER_KEY
            );


        if (!saved) {

            return;

        }


        const savedWorks =
            JSON.parse(saved);


        if (!Array.isArray(savedWorks)) {

            return;

        }


        const savedKeys =
            savedWorks
                .map(getWorkKey)
                .filter(Boolean);


        if (!savedKeys.length) {

            return;

        }


        const byKey =
            new Map();


        works.forEach(
            function(work) {

                const key =
                    getWorkKey(work);

                if (key) {

                    byKey.set(
                        key,
                        work
                    );

                }

            }
        );


        const reordered = [];


        savedKeys.forEach(
            function(key) {

                if (byKey.has(key)) {

                    reordered.push(
                        byKey.get(key)
                    );

                    byKey.delete(key);

                }

            }
        );


        works.forEach(
            function(work) {

                const key =
                    getWorkKey(work);

                if (
                    key &&
                    byKey.has(key)
                ) {

                    reordered.push(
                        work
                    );

                    byKey.delete(key);

                }

            }
        );


        if (reordered.length) {

            works =
                reordered;

        }

    } catch (error) {

        console.error(
            "Could not apply local works order:",
            error
        );

    }

}


/* =========================================================
   RENDER WORKS
   ========================================================= */


function renderWorks() {

    worksList.innerHTML = "";


    works.forEach(
        function(work, index) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "work-row";


            row.dataset.index =
                index;


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "work-number";


            number.textContent =
                String(index + 1)
                    .padStart(2, "0");


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "work-info";


            const artist =
                document.createElement(
                    "div"
                );


            artist.className =
                "work-artist";


            artist.textContent =
                work.artist ||
                work.artists ||
                work.artist_name ||
                "";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "work-title";


            title.textContent =
                work.title ||
                work.track_title ||
                work.name ||
                work.file ||
                "";


            info.appendChild(
                artist
            );


            info.appendChild(
                title
            );


            const edit =
                document.createElement(
                    "button"
                );


            edit.className =
                "edit-button";


            edit.type =
                "button";


            edit.textContent =
                "EDIT";


            edit.addEventListener(
                "pointerdown",
                function(event) {

                    event.stopPropagation();

                }
            );


            edit.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    editWork(
                        work,
                        index
                    );

                }
            );


            row.appendChild(
                number
            );


            row.appendChild(
                info
            );


            row.appendChild(
                edit
            );


            addPointerDragHandlers(
                row
            );


            worksList.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   EDIT
   ========================================================= */


function editWork(
    work,
    index
) {

    console.log(
        "EDIT WORK:",
        index,
        work
    );

    alert(
        "EDIT is not connected yet."
    );

}


/* =========================================================
   DRAG TO REARRANGE
   ========================================================= */

let draggedRow = null;


/* =========================================================
   ADD DRAG HANDLERS
   ========================================================= */

function addPointerDragHandlers(element) {

    element.setAttribute(
        "draggable",
        "true"
    );


    /* -----------------------------------------------------
       START DRAG
       ----------------------------------------------------- */

    element.addEventListener(
        "dragstart",
        function(event) {

            if (
                event.target.closest(
                    ".edit-button"
                )
            ) {

                event.preventDefault();

                return;

            }


            draggedRow =
                element;


            element.classList.add(
                "dragging"
            );


            event.dataTransfer.effectAllowed =
                "move";


            event.dataTransfer.setData(
                "text/plain",
                element.dataset.index
            );

        }
    );


    /* -----------------------------------------------------
       DRAG OVER
       ----------------------------------------------------- */

    element.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();


            if (
                !draggedRow ||
                draggedRow === element
            ) {

                return;

            }


            const rect =
                element.getBoundingClientRect();


            const midpoint =
                rect.top +
                rect.height / 2;


            if (
                event.clientY <
                midpoint
            ) {

                worksList.insertBefore(
                    draggedRow,
                    element
                );

            } else {

                worksList.insertBefore(
                    draggedRow,
                    element.nextSibling
                );

            }

        }
    );


    /* -----------------------------------------------------
       DROP
       ----------------------------------------------------- */

    element.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

        }
    );


    /* -----------------------------------------------------
       END DRAG
       ----------------------------------------------------- */

    element.addEventListener(
        "dragend",
        function() {

            if (!draggedRow) {

                return;

            }


            draggedRow.classList.remove(
                "dragging"
            );


            draggedRow = null;


            saveCurrentDomOrder();

        }
    );

}


async function saveCurrentDomOrder() {

    const rows =
        Array.from(
            worksList.children
        );


    const previousWorks =
        [...works];


    const reordered =
        rows.map(
            function(row) {

                return works[
                    Number(
                        row.dataset.index
                    )
                ];

            }
        );


    if (
        reordered.length !==
        works.length
    ) {

        return;

    }


    works =
        reordered;


    renderWorks();


    /* -----------------------------------------------------
       Keep a local copy immediately.
       ----------------------------------------------------- */


    try {

        localStorage.setItem(
            LOCAL_ORDER_KEY,
            JSON.stringify(
                works
            )
        );

    } catch (error) {

        console.error(
            "Could not save local works order:",
            error
        );

    }


    /* -----------------------------------------------------
       Build the exact track-order.json array.
       ----------------------------------------------------- */


    const tracks =
        works
            .map(
                getWorkKey
            )
            .filter(
                Boolean
            );


    if (
        tracks.length !==
        works.length
    ) {

        console.error(
            "One or more works has no file path."
        );


        works =
            previousWorks;

        renderWorks();

        setOrderStatus(
            "COULD NOT SAVE ORDER"
        );

        return;

    }


    setOrderStatus(
        "SAVING ORDER..."
    );


    try {

        const response =
            await fetch(
                UPDATE_ORDER_FUNCTION,
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    },

                    body:
                        JSON.stringify({
                            tracks:
                                tracks
                        })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                result.message ||
                (
                    "HTTP " +
                    response.status
                )
            );

        }


        if (
            result.success !== true
        ) {

            throw new Error(
                result.error ||
                "Order update failed"
            );

        }


        setOrderStatus(
            "ORDER SAVED"
        );


        setTimeout(
            function() {

                setOrderStatus(
                    ""
                );

            },
            2500
        );


    } catch (error) {

        console.error(
            "Could not permanently save works order:",
            error
        );


        works =
            previousWorks;


        try {

            localStorage.setItem(
                LOCAL_ORDER_KEY,
                JSON.stringify(
                    works
                )
            );

        } catch (storageError) {

            console.error(
                storageError
            );

        }


        renderWorks();


        setOrderStatus(
            "COULD NOT SAVE ORDER"
        );

    }

}


/* =========================================================
   STATUS
   ========================================================= */


function setOrderStatus(
    message
) {

    orderStatus.textContent =
        message;

}


/* =========================================================
   ADD FORM
   ========================================================= */


addButton.addEventListener(
    "click",
    function() {

        addForm.classList.toggle(
            "visible"
        );

    }
);


cancelButton.addEventListener(
    "click",
    function() {

        addForm.classList.remove(
            "visible"
        );

    }
);


/* =========================================================
   START
   ========================================================= */


loadWorks();


</script>


</body>

</html>
