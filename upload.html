async function checkAuthentication() {

    const result =
        await supabaseClient.auth.getSession();

    const session =
        result.data &&
        result.data.session
            ? result.data.session
            : null;

    if (session) {

        await showAuthenticatedPage(
            session
        );

    } else {

        showLogin();

    }

}


async function signIn() {

    const email =
        authEmail.value.trim();

    const password =
        authPassword.value;

    if (
        !email ||
        !password
    ) {

        authMessage.textContent =
            "ENTER AN EMAIL AND PASSWORD";

        return;

    }

    signInButton.disabled =
        true;

    authMessage.textContent =
        "SIGNING IN...";

    try {

        const result =
            await supabaseClient.auth.signInWithPassword(
                {
                    email:
                        email,

                    password:
                        password
                }
            );

        if (
            result.error
        ) {

            throw result.error;

        }

        authMessage.textContent =
            "";

        await showAuthenticatedPage(
            result.data.session
        );

    } catch (error) {

        console.error(
            "GR8SKUL Works sign in failed:",
            error
        );

        authMessage.textContent =
            error.message ||
            "SIGN IN FAILED";

    } finally {

        signInButton.disabled =
            false;

    }

}


async function signOut() {

    try {

        await supabaseClient.auth.signOut();

    } catch (error) {

        console.error(
            "GR8SKUL Works sign out failed:",
            error
        );

    }

    authEmail.value =
        "";

    authPassword.value =
        "";

    authMessage.textContent =
        "";

    showLogin();

}

async function getAccessToken() {

    const result =
        await supabaseClient.auth.getSession();

    if (
        result.error
    ) {

        throw result.error;

    }

    const session =
        result.data &&
        result.data.session
            ? result.data.session
            : null;

    if (
        !session ||
        !session.access_token
    ) {

        throw new Error(
            "YOUR WORKS SESSION HAS EXPIRED. PLEASE SIGN IN AGAIN."
        );

    }

    return session.access_token;

}


/* =========================================================
   NORMALIZE ARRAY
   ========================================================= */

function normalizeArray(
    value
) {

    if (
        Array.isArray(value)
    ) {

        return value
            .map(
                function(item) {

                    return String(
                        item
                    ).trim();

                }
            )
            .filter(Boolean);

    }

    if (
        typeof value ===
        "string"
    ) {

        return value
            .split(",")
            .map(
                function(item) {

                    return item.trim();

                }
            )
            .filter(Boolean);

    }

    return [];

}


/* =========================================================
   CENTRAL TAXONOMY NORMALIZATION
   ========================================================= */

function normalizeTaxonomyParents(
    value,
    childKeys
) {

    if (
        !Array.isArray(value)
    ) {

        return [];

    }

    return value
        .map(
            function(item) {

                if (
                    typeof item ===
                    "string"
                ) {

                    return {

                        name:
                            item.trim(),

                        types:
                            []

                    };

                }

                if (
                    !item ||
                    typeof item !==
                    "object"
                ) {

                    return null;

                }

                const name =
                    String(
                        item.name ||
                        item.genre ||
                        item.mood ||
                        item.parent ||
                        item.title ||
                        ""
                    ).trim();

                if (!name) {

                    return null;

                }

                let types =
                    [];

                for (
                    const key of childKeys
                ) {

                    if (
                        Array.isArray(
                            item[key]
                        )
                    ) {

                        types =
                            item[key];

                        break;

                    }

                }

                if (
                    !types.length &&
                    Array.isArray(
                        item.children
                    )
                ) {

                    types =
                        item.children;

                }

                types =
                    types
                        .map(
                            function(type) {

                                if (
                                    typeof type ===
                                    "string"
                                ) {

                                    return type.trim();

                                }

                                if (
                                    type &&
                                    typeof type ===
                                    "object"
                                ) {

                                    return String(
                                        type.name ||
                                        type.type ||
                                        type.genreType ||
                                        type.moodType ||
                                        ""
                                    ).trim();

                                }

                                return "";

                            }
                        )
                        .filter(Boolean);

                return {

                    name:
                        name,

                    types:
                        types

                };

            }
        )
        .filter(Boolean);

}


/* =========================================================
   NORMALIZE ERA TAXONOMY
   ========================================================= */

function normalizeEras(
    value
) {

    if (
        !Array.isArray(value)
    ) {

        return [];

    }

    return value
        .map(
            function(item) {

                if (
                    typeof item ===
                    "string"
                ) {

                    return {

                        name:
                            item.trim(),

                        types:
                            []

                    };

                }

                if (
                    !item ||
                    typeof item !==
                    "object"
                ) {

                    return null;

                }

                const name =
                    String(
                        item.name ||
                        item.era ||
                        item.parent ||
                        ""
                    ).trim();

                if (!name) {

                    return null;

                }

                let types =
                    [];

                if (
                    Array.isArray(
                        item.types
                    )
                ) {

                    types =
                        item.types;

                } else if (
                    Array.isArray(
                        item.eraTypes
                    )
                ) {

                    types =
                        item.eraTypes;

                } else if (
                    Array.isArray(
                        item.children
                    )
                ) {

                    types =
                        item.children;

                }

                types =
                    types
                        .map(
                            function(type) {

                                if (
                                    typeof type ===
                                    "string"
                                ) {

                                    return type.trim();

                                }

                                if (
                                    type &&
                                    typeof type ===
                                    "object"
                                ) {

                                    return String(
                                        type.name ||
                                        type.type ||
                                        ""
                                    ).trim();

                                }

                                return "";

                            }
                        )
                        .filter(Boolean);

                return {

                    name:
                        name,

                    types:
                        types

                };

            }
        )
        .filter(Boolean);

}


/* =========================================================
   NORMALIZE REGION TAXONOMY
   ========================================================= */

function normalizeRegions(
    value
) {

    if (
        !Array.isArray(value)
    ) {

        return [];

    }

    function normalizeNode(
        node
    ) {

        if (
            typeof node ===
            "string"
        ) {

            return {

                name:
                    node.trim(),

                children:
                    []

            };

        }

        if (
            !node ||
            typeof node !==
            "object"
        ) {

            return null;

        }

        const name =
            String(
                node.name ||
                node.region ||
                node.title ||
                ""
            ).trim();

        if (!name) {

            return null;

        }

        const rawChildren =
            Array.isArray(
                node.children
            )
                ? node.children
                : [];

        return {

            name:
                name,

            children:
                rawChildren
                    .map(
                        normalizeNode
                    )
                    .filter(Boolean)

        };

    }

    return value
        .map(
            normalizeNode
        )
        .filter(Boolean);

}


/* =========================================================
   NORMALIZE CENTRAL TAXONOMY
   ========================================================= */

function normalizeCentralTaxonomy(
    value
) {

    if (
        !value ||
        typeof value !==
        "object"
    ) {

        return {

            genres: [],

            moods: [],

            eras: [],

            regions: []

        };

    }

    const rawGenres =
        value.genres ||
        value.genre ||
        [];

    const rawMoods =
        value.moods ||
        value.mood ||
        [];

    const rawEras =
        value.eras ||
        value.era ||
        [];

    const rawRegions =
        value.regions ||
        value.region ||
        [];

    return {

        genres:
            normalizeTaxonomyParents(
                rawGenres,
                [
                    "types",
                    "genreTypes",
                    "genre_types",
                    "subgenres",
                    "subGenres"
                ]
            ),

        moods:
            normalizeTaxonomyParents(
                rawMoods,
                [
                    "types",
                    "moodTypes",
                    "mood_types",
                    "submoods",
                    "subMoods"
                ]
            ),

        eras:
            normalizeEras(
                rawEras
            ),

        regions:
            normalizeRegions(
                rawRegions
            )

    };

}

   LOAD CENTRAL TAXONOMY

async function loadTaxonomy() {

    try {

        const result =
            await supabaseClient
                .from(
                    "gr8skul_taxonomy"
                )
                .select(
                    "taxonomy"
                )
                .eq(
                    "id",
                    TAXONOMY_ID
                )
                .maybeSingle();

        if (
            result.error
        ) {

            throw result.error;

        }

        if (
            !result.data ||
            !result.data.taxonomy
        ) {

            throw new Error(
                "TAXONOMY COULD NOT BE LOADED"
            );

        }

        taxonomy =
            normalizeCentralTaxonomy(
                result.data.taxonomy
            );

        renderTaxonomyTrees();

    } catch (error) {

        console.error(
            "Could not load GR8SKUL taxonomy:",
            error
        );

        taxonomy = {

            genres: [],

            moods: [],

            eras: [],

            regions: []

        };

        renderTaxonomyTrees();

        setFormStatus(
            "COULD NOT LOAD TAXONOMY"
        );

    }

}

/* =========================================================
   REGION PATH HELPERS
   ========================================================= */

function getRegionNodePath(
    node
) {

    const path = [];

    let current =
        node;

    while (
        current &&
        current.classList &&
        current.classList.contains(
            "region-node"
        )
    ) {

        path.unshift(
            current.dataset.name
        );

        current =
            current.parentElement &&
            current.parentElement.closest(
                ".region-node"
            );

    }

    return path;

}

        expand.className =
            "region-expand";

        expand.type =
            "button";

        expand.textContent =
            "▼";

        expand.setAttribute(
            "aria-label",
            "Show " +
            regionData.name +
            " children"
        );

        row.appendChild(
            expand
        );


        const childrenContainer =
            document.createElement(
                "div"
            );

        childrenContainer.className =
            "region-children";


        children.forEach(
            function(child) {

                const childNode =
                    createRegionNode(
                        child
                    );

                if (childNode) {

                    childrenContainer.appendChild(
                        childNode
                    );

                }

            }
        );

        node.appendChild(
            row
        );

        node.appendChild(
            childrenContainer
        );


        expand.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                if (
                    !checkbox.checked
                ) {

                    checkbox.checked =
                        true;

                }

                node.classList.toggle(
                    "expanded"
                );

                updateRegionSummary();

            }
        );

    } else {

        node.appendChild(
            row
        );

    }


    checkbox.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

        }
    );


    checkbox.addEventListener(
        "change",
        function() {

            if (
                checkbox.checked
            ) {

                node.classList.add(
                    "expanded"
                );

            } else {

                node.classList.remove(
                    "expanded"
                );

                node
                    .querySelectorAll(
                        ".region-check"
                    )
                    .forEach(
                        function(childCheckbox) {

                            childCheckbox.checked =
                                false;

                        }
                    );

            }

            updateRegionSummary();

        }
    );


    label.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            checkbox.checked =
                !checkbox.checked;

            checkbox.dispatchEvent(
                new Event(
                    "change"
                )
            );

        }
    );


    return node;

}


/* =========================================================
   GET TREE PARENTS
   ========================================================= */

function getTreeParents(
    tree
) {

    return Array.from(
        tree.querySelectorAll(
            ".taxonomy-parent"
        )
    );

}


/* =========================================================
   GET TREE SELECTED PARENTS
   ========================================================= */

function getTreeSelectedParents(
    tree
) {

    return getTreeParents(
        tree
    )
        .filter(
            function(parent) {

                const checkbox =
                    parent.querySelector(
                        ".taxonomy-check"
                    );

                return checkbox &&
                    checkbox.checked;

            }
        )
        .map(
            function(parent) {

                return parent.dataset.parent;

            }
        );

}


/* =========================================================
   GET TREE SELECTED TYPES
   ========================================================= */

function getTreeSelectedTypes(
    tree
) {

    return Array.from(
        tree.querySelectorAll(
            ".taxonomy-type-check:checked"
        )
    )
        .map(
            function(input) {

                return {

                    parent:
                        input.dataset.parent,

                    type:
                        input.dataset.type

                };

            }
        );

}


/* =========================================================
   SET TREE SELECTED PARENTS
   ========================================================= */

function setTreeSelectedParents(
    tree,
    values
) {

    const selected =
        new Set(
            normalizeArray(
                values
            )
        );

    getTreeParents(
        tree
    ).forEach(
        function(parent) {

            const parentName =
                parent.dataset.parent;

            const checkbox =
                parent.querySelector(
                    ".taxonomy-check"
                );

            const shouldSelect =
                selected.has(
                    parentName
                );

            checkbox.checked =
                shouldSelect;

            if (shouldSelect) {

                parent.classList.add(
                    "expanded"
                );

            } else {

                parent.classList.remove(
                    "expanded"
                );

                parent
                    .querySelectorAll(
                        ".taxonomy-type-check"
                    )
                    .forEach(
                        function(typeInput) {

                            typeInput.checked =
                                false;

                        }
                    );

            }

        }
    );

    updateTreeSummary(
        tree
    );

}


/* =========================================================
   SET TREE SELECTED TYPES
   ========================================================= */

function setTreeSelectedTypes(
    tree,
    typeValues
) {

    const normalized =
        tree === genreTree
            ? normalizeGenreTypes(
                typeValues
            )
            : tree === moodTree
                ? normalizeMoodTypes(
                    typeValues
                )
                : normalizeEraTypes(
                    typeValues
                );

    const selectedParents =
        new Set(
            getTreeSelectedParents(
                tree
            )
        );


    tree
        .querySelectorAll(
            ".taxonomy-type-check"
        )
        .forEach(
            function(input) {

                const inputParent =
                    input.dataset.parent;

                const inputType =
                    input.dataset.type;

                let matches =
                    normalized.some(
                        function(item) {

                            const itemParent =
                                tree === genreTree
                                    ? item.genre
                                    : tree === moodTree
                                        ? item.mood
                                        : item.era;

                            return (
                                itemTypeEquals(
                                    item.type,
                                    inputType
                                ) &&
                                itemParent ===
                                inputParent
                            );

                        }
                    );


                /*
                 * Backward compatibility:
                 * restore child values whose
                 * parent was not previously stored.
                 */

                if (
                    !matches &&
                    selectedParents.has(
                        inputParent
                    )
                ) {

                    matches =
                        normalized.some(
                            function(item) {

                                const itemParent =
                                    tree === genreTree
                                        ? item.genre
                                        : tree === moodTree
                                            ? item.mood
                                            : item.era;

                                return (
                                    !itemParent &&
                                    itemTypeEquals(
                                        item.type,
                                        inputType
                                    )
                                );

                            }
                        );

                }

                input.checked =
                    matches;

            }
        );

    updateTreeSummary(
        tree
    );

}


/* =========================================================
   SET ERA SELECTION

function setEraSelections(

/* =========================================================
   ITEM TYPE EQUALITY
   ========================================================= */

function itemTypeEquals(
    first,
    second
) {

    return String(
        first || ""
    ).trim() ===
    String(
        second || ""
    ).trim();

}


/* =========================================================
   UPDATE TREE SUMMARY
   ========================================================= */

function updateTreeSummary(
    tree
) {

    const isGenre =
        tree === genreTree;

    const isMood =
        tree === moodTree;

    const isEra =
        tree === eraTree;

    const summary =
        isGenre
            ? genreSummary
            : isMood
                ? moodSummary
                : eraSummary;

    const triggerText =
        isGenre
            ? genreTriggerText
            : isMood
                ? moodTriggerText
                : eraTriggerText;

    const parents =
        getTreeSelectedParents(
            tree
        );

    const types =
        getTreeSelectedTypes(
            tree
        );


    if (!parents.length) {

        triggerText.textContent =
            isGenre
                ? "SELECT GENRE(S)"
                : isMood
                    ? "SELECT MOOD(S)"
                    : "SELECT ERA(S)";

        summary.textContent =
            "";

        return;

    }


    triggerText.textContent =
        parents.join(
            ", "
        );


    if (types.length) {

        summary.textContent =
            types.length +
            " " +
            (
                isEra
                    ? "ERA TYPE"
                    : "SUBCATEGORY"
            ) +
            (
                types.length === 1
                    ? ""
                    : "S"
            ) +
            " SELECTED";

    } else {

        summary.textContent =
            parents.length +
            " " +
            (
                isGenre
                    ? "GENRE"
                    : isMood
                        ? "MOOD"
                        : "ERA"
            ) +
            (
                parents.length === 1
                    ? ""
                    : "S"
            ) +
            " SELECTED";

    }

}


/* =========================================================
   UPDATE REGION SUMMARY
   ========================================================= */

function updateRegionSummary() {

    const selected =
        getSelectedRegionPaths();

    if (!selected.length) {

        regionTriggerText.textContent =
            "SELECT REGION(S)";

        regionSummary.textContent =
            "";

        return;

    }


    const names =
        selected.map(
            function(item) {

                return item.path[
                    item.path.length - 1
                ];

            }
        );


    regionTriggerText.textContent =
        names.join(
            ", "
        );


    regionSummary.textContent =
        selected.length +
        " REGION" +
        (
            selected.length === 1
                ? ""
                : "S"
        ) +
        " SELECTED";

}

/* =========================================================
   INCLUDE PARENT VALUES
   ========================================================= */

function includeParentValues(
    parents,
    types,
    tree
) {

    const result =
        normalizeArray(
            parents
        );

    const existing =
        new Set(
            result
        );

    types.forEach(
        function(item) {

            const parent =
                tree === genreTree
                    ? item.genre
                    : tree === moodTree
                        ? item.mood
                        : item.era;

            if (
                parent &&
                !existing.has(
                    parent
                )
            ) {

                result.push(
                    parent
                );

                existing.add(
                    parent
                );

            }

        }
    );

    return result;

}

/* =========================================================
   ERA METADATA
   ========================================================= */

function normalizeEraTypes(
    value
) {

    if (
        !value
    ) {

        return [];

    }

    if (
        typeof value ===
        "string"
    ) {

        value =
            value
                .split(",")
                .map(
                    function(item) {

                        return item.trim();

                    }
                )
                .filter(Boolean);

    }

    if (
        !Array.isArray(value)
    ) {

        return [];

    }

    return value
        .map(
            function(item) {

                if (
                    item &&
                    typeof item ===
                    "object"
                ) {

                    const era =
                        String(
                            item.era ||
                            item.parent ||
                            ""
                        ).trim();

                    const type =
                        String(
                            item.type ||
                            item.eraType ||
                            item.name ||
                            ""
                        ).trim();

                    if (!type) {

                        return null;

                    }

                    return {

                        era:
                            era,

                        type:
                            type

                    };

                }

                const text =
                    String(
                        item
                    ).trim();

                if (!text) {

                    return null;

                }

                if (
                    text.includes("::")
                ) {

                    const parts =
                        text.split("::");

                    return {

                        era:
                            parts[0].trim(),

                        type:
                            parts
                                .slice(1)
                                .join("::")
                                .trim()

                    };

                }

                return {

                    era:
                        "",

                    type:
                        text

                };

            }
        )
        .filter(
            function(item) {

                return item &&
                    item.type;

            }
        );

}


function getEraMetadata() {

    const selectedParents =
        getTreeSelectedParents(

        getTreeSelectedTypes(

    const eras =

/* =========================================================
   TAXONOMY TREE EVENTS
   ========================================================= */

function setupTaxonomyTree(
    tree,
    trigger,
    summary
) {

    trigger.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            const currentlyOpen =
                tree.classList.contains(
                    "open"
                );


            /*
             * Close every other taxonomy tree.
             */

            const allTrees = [
                genreTree,
                moodTree,
                eraTree,
                regionTree
            ];

            allTrees.forEach(
                function(otherTree) {

                    if (
                        otherTree !== tree
                    ) {

                        otherTree.classList.remove(
                            "open"
                        );

                    }

                }
            );


            genreTrigger.setAttribute(
                "aria-expanded",
                genreTree.classList.contains(
                    "open"
                )
            );

            moodTrigger.setAttribute(
                "aria-expanded",
                moodTree.classList.contains(
                    "open"
                )
            );

            eraTrigger.setAttribute(
                "aria-expanded",
                eraTree.classList.contains(
                    "open"
                )
            );

            regionTrigger.setAttribute(
                "aria-expanded",
                regionTree.classList.contains(
                    "open"
                )
            );


            tree.classList.toggle(
                "open",
                !currentlyOpen
            );

            trigger.setAttribute(
                "aria-expanded",
                String(
                    !currentlyOpen
                )
            );

        }
    );

}


/* =========================================================
   TAXONOMY TREE PARENT EVENTS
   ========================================================= */

function setupTaxonomyTreeParents(
    tree
) {

    const parents =
        getTreeParents(
            tree
        );

    parents.forEach(
        function(parent) {

            const parentCheckbox =
                parent.querySelector(
                    ".taxonomy-check"
                );

            const parentLabel =
                parent.querySelector(
                    ".taxonomy-parent-label"
                );

            const expandButton =
                parent.querySelector(
                    ".taxonomy-expand"
                );


            if (
                !parentCheckbox
            ) {

                return;

            }


            parentCheckbox.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                }
            );


            parentCheckbox.addEventListener(
                "change",
                function() {

                    if (
                        parentCheckbox.checked
                    ) {

                        parent.classList.add(
                            "expanded"
                        );

                    } else {

                        parent.classList.remove(
                            "expanded"
                        );

                        parent
                            .querySelectorAll(
                                ".taxonomy-type-check"
                            )
                            .forEach(
                                function(typeInput) {

                                    typeInput.checked =
                                        false;

                                }
                            );

                    }

                    updateTreeSummary(
                        tree
                    );

                }
            );


            if (
                parentLabel
            ) {

                parentLabel.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        parentCheckbox.checked =
                            !parentCheckbox.checked;

                        parentCheckbox.dispatchEvent(
                            new Event(
                                "change"
                            )
                        );

                    }
                );

            }


            if (
                expandButton
            ) {

                expandButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        if (
                            !parentCheckbox.checked
                        ) {

                            parentCheckbox.checked =
                                true;

                            parentCheckbox.dispatchEvent(
                                new Event(
                                    "change"
                                )
                            );

                        }

                        parent.classList.toggle(
                            "expanded"
                        );

                    }
                );

            }


            parent
                .querySelectorAll(
                    ".taxonomy-type-check"
                )
                .forEach(
                    function(typeInput) {

                        typeInput.addEventListener(
                            "click",
                            function(event) {

                                event.stopPropagation();

                            }
                        );

                        typeInput.addEventListener(
                            "change",
                            function() {

                                if (
                                    typeInput.checked &&
                                    !parentCheckbox.checked
                                ) {

                                    parentCheckbox.checked =
                                        true;

                                    parent.classList.add(
                                        "expanded"
                                    );

                                }

                                updateTreeSummary(
                                    tree
                                );

                            }
                        );

                    }
                );

        }
    );

}

) {

    ) {

    }

    if (
        typeof value ===
        "string"
    ) {

        return value
            .split(",")
            .map(

                                .filter(Boolean)

                    };

                }
            )
            .filter(
                function(item) {

                    return item.path.length;

                }
            );

    }

    if (
        !Array.isArray(value)
    ) {

        return [];

    }

    return value
        .map(
            function(item) {

                if (
                    item &&
                    typeof item ===
                    "object" &&
                    Array.isArray(
                        item.path
                    )
                ) {

                    return {

                        path:
                            item.path
                                .map(
                                    function(part) {

                                        return String(
                                            part
                                        ).trim();

                                    }
                                )
                                .filter(Boolean)

                    };

                }

                if (
                    Array.isArray(
                        item
                    )
                ) {

                    return {

                        path:
                            item
                                .map(
                                    function(part) {

                                        return String(
                                            part
                                        ).trim();

                                    }
                                )
                                .filter(Boolean)

                    };

                }

                if (
                    typeof item ===
                    "string"
                ) {

                    return {

                        path:
                            item
                                .split("::")
                                .map(
                                    function(part) {

                                        return part.trim();

                                    }
                                )
                                .filter(Boolean)

                    };

                }

                return null;

            }
        )
        .filter(
            function(item) {

                return item &&
                    item.path &&
                    item.path.length;

            }
        );

}


/* =========================================================
   RESTORE REGION SELECTIONS
   ========================================================= */

function setRegionSelections(
    values
) {

    const normalized =
        normalizeRegionsMetadata(
            values
        );


    clearRegionTree();


    normalized.forEach(
        function(regionData) {

            const path =
                regionData.path;

            if (
                !path.length
            ) {

                return;

            }


            let currentContainer =
                regionTree;

            let currentNode =
                null;


            path.forEach(
                function(
                    pathName
                ) {

                    const nodes =
                        Array.from(
                            currentContainer.querySelectorAll(
                                ":scope > .region-node"
                            )
                        );

                    currentNode =
                        nodes.find(
                            function(node) {

                                return (
                                    node.dataset.name ===
                                    pathName
                                );

                            }
                        );


                    if (!currentNode) {

                        return;

                    }


                    const checkbox =
                        currentNode.querySelector(
                            ":scope > .region-node-row .region-check"
                        );

                    if (
                        checkbox
                    ) {

                        checkbox.checked =
                            true;

                        currentNode.classList.add(
                            "expanded"
                        );

                    }


                    const children =
                        currentNode.querySelector(
                            ":scope > .region-children"
                        );

                    if (
                        children
                    ) {

                        currentContainer =
                            children;

                    }

                }
            );

        }
    );


    updateRegionSummary();

}

/* =========================================================
   WORK KEY
   ========================================================= */

function getWorkKey(
    work
) {

    if (
        typeof work ===
        "string"
    ) {

        return work;

    }

    if (
        !work ||
        typeof work !==
        "object"
    ) {

        return "";

    }

    return (
        work.file ||
        work.filename ||
        work.path ||
        work.url ||
        work.src ||
        work.audio ||
        ""
    );

}


/* =========================================================
   NORMALIZE WORK
   ========================================================= */

function normalizeWork(
    work
) {

    if (
        typeof work ===
        "string"
    ) {

        const file =
            work;

        const filename =
            file
                .split("/")
                .pop();

        const withoutExtension =
            filename
                ? filename.replace(
                    /\.mp3$/i,
                    ""
                )
                : "";

        return {

            file:
                file,

            title:
                withoutExtension,

            artists:
                [],

            genres:
                [],

            genreTypes:
                [],

            moods:
                [],

            moodTypes:
                [],

            eras:
                [],

            eraTypes:
                [],

            regions:
                []

        };

    }

    if (
        work &&
        typeof work ===
        "object"
    ) {

        return {

            ...work,

            file:
                work.file ||
                work.filename ||
                work.path ||
                work.url ||
                work.src ||
                work.audio ||
                "",

            title:
                work.title ||
                work.track_title ||
                work.name ||
                "",

            artists:
                normalizeArray(
                    work.artists ||
                    work.artist ||
                    work.artist_name
                ),

            genres:
                normalizeArray(
                    work.genres ||
                    work.genre
                ),

            genreTypes:
                normalizeGenreTypes(
                    work.genreTypes ||
                    work.genre_types ||
                    work.genreType ||
                    work.genre_type
                ),

            moods:
                normalizeArray(
                    work.moods ||
                    work.mood
                ),

            moodTypes:
                normalizeMoodTypes(
                    work.moodTypes ||
                    work.mood_types ||
                    work.moodType ||
                    work.mood_type
                ),

            eras:
                normalizeArray(
                    work.eras ||
                    work.era
                ),

            eraTypes:
                normalizeEraTypes(
                    work.eraTypes ||
                    work.era_types ||
                    work.eraType ||
                    work.era_type
                ),

            regions:
                normalizeRegionsMetadata(
                    work.regions ||
                    work.region
                )

        };

    }

    return {

        file:
            "",

        title:
            "",

        artists:
            [],

        genres:
            [],

        genreTypes:
            [],

        moods:
            [],

        moodTypes:
            [],

        eras:
            [],

        eraTypes:
            [],

        regions:
            []

    };

}

/* =========================================================
   APPLY LOCAL ORDER
   ========================================================= */

function applyLocalOrder() {

    try {

        const saved =
            localStorage.getItem(
                LOCAL_ORDER_KEY
            );

        if (!saved) {

            return;

        }

        const savedWorks =
            JSON.parse(
                saved
            );

        if (
            !Array.isArray(
                savedWorks
            )
        ) {

            return;

        }

        const savedKeys =
            savedWorks
                .map(
                    getWorkKey
                )
                .filter(Boolean);

        if (
            !savedKeys.length
        ) {

            return;

        }

        const byKey =
            new Map();

        works.forEach(
            function(work) {

                const key =
                    getWorkKey(
                        work
                    );

                if (key) {

                    byKey.set(
                        key,
                        work
                    );

                }

            }
        );

        const reordered =
            [];

        savedKeys.forEach(
            function(key) {

                if (
                    byKey.has(
                        key
                    )
                ) {

                    reordered.push(
                        byKey.get(
                            key
                        )
                    );

                    byKey.delete(
                        key
                    );

                }

            }
        );

        works.forEach(
            function(work) {

                const key =
                    getWorkKey(
                        work
                    );

                if (
                    key &&
                    byKey.has(
                        key
                    )
                ) {

                    reordered.push(
                        work
                    );

                    byKey.delete(
                        key
                    );

                }

            }
        );

        if (
            reordered.length
        ) {

            works =
                reordered;

        }

    } catch (error) {

        console.error(
            "Could not apply local works order:",
            error
        );

    }

}

/* =========================================================
   DRAG TO REARRANGE
   ========================================================= */

function addPointerDragHandlers(
    element
) {

    element.setAttribute(
        "draggable",
        "true"
    );

    element.addEventListener(
        "dragstart",
        function(event) {

            if (
                event.target.closest(
                    ".edit-button"
                )
            ) {

                event.preventDefault();

                return;

            }

            draggedRow =
                element;

            element.classList.add(
                "dragging"
            );

            event.dataTransfer.effectAllowed =
                "move";

            event.dataTransfer.setData(
                "text/plain",
                element.dataset.index
            );

        }
    );

    element.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();

            if (
                !draggedRow ||
                draggedRow === element
            ) {

                return;

            }

            const rect =
                element.getBoundingClientRect();

            const midpoint =
                rect.top +
                rect.height / 2;

            if (
                event.clientY <
                midpoint
            ) {

                worksList.insertBefore(
                    draggedRow,
                    element
                );

            } else {

                worksList.insertBefore(
                    draggedRow,
                    element.nextSibling
                );

            }

        }
    );

    element.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

        }
    );

    element.addEventListener(
        "dragend",
        function() {

            if (!draggedRow) {

                return;

            }

            draggedRow.classList.remove(
                "dragging"
            );

            draggedRow =
                null;

            saveCurrentDomOrder();

        }
    );

}


/* =========================================================
   SAVE CURRENT DOM ORDER
   ========================================================= */

async function saveCurrentDomOrder() {

    const rows =
        Array.from(
            worksList.children
        ).filter(
            function(element) {

                return element.classList.contains(
                    "work-row"
                );

            }
        );

    const previousWorks =
        [
            ...works
        ];

    const reordered =
        rows.map(
            function(row) {

                return works[
                    Number(
                        row.dataset.index
                    )
                ];

            }
        );

    if (
        reordered.length !==
        works.length
    ) {

        return;

    }

    works =
        reordered;

    renderWorks();


    try {

        localStorage.setItem(
            LOCAL_ORDER_KEY,
            JSON.stringify(
                works
            )
        );

    } catch (error) {

        console.error(
            "Could not save local works order:",
            error
        );

    }


    const tracks =
        works
            .map(
                getWorkKey
            )
            .filter(
                Boolean
            );


    if (
        tracks.length !==
        works.length
    ) {

        console.error(
            "One or more works has no file path."
        );

        works =
            previousWorks;

        renderWorks();

        setOrderStatus(
            "COULD NOT SAVE ORDER"
        );

        return;

    }


    setOrderStatus(
        "SAVING ORDER..."
    );


    try {

        const accessToken =
            await getAccessToken();

        const response =
            await fetch(
                UPDATE_ORDER_FUNCTION,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken

                    },

                    body:
                        JSON.stringify(
                            {
                                tracks:
                                    tracks
                            }
                        )

                }
            );


        const result =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                result.error ||
                result.message ||
                (
                    "HTTP " +
                    response.status
                )
            );

        }


        if (
            result.success !==
            true
        ) {

            throw new Error(
                result.error ||
                "Order update failed"
            );

        }


        setOrderStatus(
            "ORDER SAVED"
        );


        setTimeout(
            function() {

                setOrderStatus(
                    ""
                );

            },
            2500
        );


    } catch (error) {

        console.error(
            "Could not permanently save works order:",
            error
        );

        works =
            previousWorks;

        try {

            localStorage.setItem(
                LOCAL_ORDER_KEY,
                JSON.stringify(
                    works
                )
            );

        } catch (storageError) {

            console.error(
                storageError
            );

        }

        renderWorks();

        setOrderStatus(
            "COULD NOT SAVE ORDER"
        );

    }

}

        addForm.classList.remove(
            "visible"
        );

        resetForm();

        return;

    }

    resetForm();


    /*
     * Always return the form to its position
     * directly beneath the ADD button.
     */

    addButton.insertAdjacentElement(
        "afterend",
        addForm
    );

    addForm.classList.add(
        "visible"
    );

}


/* =========================================================
   ADD BUTTON
   ========================================================= */

addButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        openAddForm();

    }
);


/* =========================================================
   CANCEL
   ========================================================= */

cancelButton.addEventListener(
    "click",
    function() {

        addForm.classList.remove(
            "visible"
        );

        resetForm();


        /*
         * Return the form to the ADD position
         * after it has been used for editing.
         */

        addButton.insertAdjacentElement(
            "afterend",
            addForm
        );

    }
);


/* =========================================================
   UPLOAD / SAVE
   ========================================================= */

uploadButton.addEventListener(
    "click",
    async function() {

        setFormStatus(
            ""
        );


        const artists =
            getArtistValues();

        const title =
            titleInput.value.trim();


        /*
         * Read the hierarchical trees.
         */

        const genreData =
            getGenreMetadata();

        const moodData =
            getMoodMetadata();

        const eraData =
            getEraMetadata();

        const regionData =
            getRegionMetadata();


        const genres =
            genreData.genres;

        const genreTypes =
            genreData.genreTypes;

        const moods =
            moodData.moods;

        const moodTypes =
            moodData.moodTypes;

        const eras =
            eraData.eras;

        const eraTypes =
            eraData.eraTypes;

        const regions =
            regionData;


        const file =
            mp3Input.files[0] ||
            null;


        if (
            editingIndex === null &&
            !file
        ) {

            setFormStatus(
                "PLEASE SELECT AN MP3"
            );

            return;

        }


        if (!title) {

            setFormStatus(
                "TITLE IS REQUIRED"
            );

            return;

        }


        if (!artists.length) {

            setFormStatus(
                "ARTIST IS REQUIRED"
            );

            return;

        }


        if (!genres.length) {

            setFormStatus(
                "SELECT AT LEAST ONE GENRE"
            );

            return;

        }


        if (!moods.length) {

            setFormStatus(
                "SELECT AT LEAST ONE MOOD"
            );

            return;

        }


        if (!eras.length) {

            setFormStatus(
                "SELECT AT LEAST ONE ERA"
            );

            return;

        }


        if (!regions.length) {

            setFormStatus(
                "SELECT AT LEAST ONE REGION"
            );

            return;

        }


        if (
            file &&
            file.type !== "audio/mpeg" &&
            !/\.mp3$/i.test(
                file.name
            )
        ) {

            setFormStatus(
                "MP3 FILES ONLY"
            );

            return;

        }


        /*
         * The broad parent arrays remain
         * exactly where the existing system
         * expects them.
         *
         * Child selections are stored
         * separately.
         */

        const metadata = {

            title:
                title,

            artists:
                artists,

            genres:
                genres,

            genreTypes:
                genreTypes,

            moods:
                moods,

            moodTypes:
                moodTypes,

            eras:
                eras,

            eraTypes:
                eraTypes,

            regions:
                regions

        };


        let existingFile =
            "";


        if (
            editingIndex !== null
        ) {

            const existingWork =
                works[
                    editingIndex
                ];

            existingFile =
                getWorkKey(
                    existingWork
                );

            if (!existingFile) {

                setFormStatus(
                    "COULD NOT IDENTIFY EXISTING MP3"
                );

                return;

            }

        }


        const formData =
            new FormData();


        formData.append(
            "metadata",
            JSON.stringify(
                metadata
            )
        );


        formData.append(
            "mode",
            editingIndex !== null
                ? "edit"
                : "add"
        );


        if (
            editingIndex !== null
        ) {

            formData.append(
                "existingFile",
                existingFile
            );

        }


        if (file) {

            formData.append(
                "mp3",
                file
            );

        }


        uploadButton.disabled =
            true;

        uploadButton.textContent =
            editingIndex !== null
                ? "SAVING..."
                : "UPLOADING...";

        setFormStatus(
            editingIndex !== null
                ? "SAVING..."
                : "UPLOADING..."
        );


        try {

            const accessToken =
                await getAccessToken();


            const response =
                await fetch(
                    UPLOAD_WORK_FUNCTION,
                    {

                        method:
                            "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                accessToken

                        },

                        body:
                            formData

                    }
                );


            const result =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    result.error ||
                    result.message ||
                    (
                        "HTTP " +
                        response.status
                    )
                );

            }


            if (
                result.success !==
                true
            ) {

                throw new Error(
                    result.error ||
                    "Work could not be saved"
                );

            }


            setFormStatus(
                editingIndex !== null
                    ? (
                        result.replacedAudio
                            ? "WORK AND MP3 SAVED"
                            : "WORK SAVED"
                    )
                    : "WORK UPLOADED"
            );


            await loadWorks();


            setTimeout(
                function() {

                    addForm.classList.remove(
                        "visible"
                    );

                    resetForm();

                    addButton.insertAdjacentElement(
                        "afterend",
                        addForm
                    );

                },
                1000
            );


        } catch (error) {

            console.error(
                "Could not save work:",
                error
            );

            setFormStatus(
                error.message ||
                "WORK COULD NOT BE SAVED"
            );

        } finally {

            uploadButton.disabled =
                false;

            uploadButton.textContent =
                editingIndex !== null
                    ? "SAVE"
                    : "UPLOAD";

        }

    }
);


/* =========================================================
   INITIAL AUTH CHECK
   ========================================================= */

checkAuthentication();

</script>
