<script>

/*
    ============================================================
    GR8SKUL WORKS
    ============================================================
*/

const CATALOG_URL =
    "/catalog.json";

const LOCAL_ORDER_KEY =
    "gr8skul-works-order";


let works = [];

let draggedIndex = null;

let touchDrag = null;


/*
    ============================================================
    DOM
    ============================================================
*/

const worksList =
    document.getElementById(
        "worksList"
    );


const addButton =
    document.getElementById(
        "addButton"
    );


const addForm =
    document.getElementById(
        "addForm"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const uploadButton =
    document.getElementById(
        "uploadButton"
    );


const formMessage =
    document.getElementById(
        "formMessage"
    );


/*
    ============================================================
    LOAD CURRENT WORKS
    ============================================================
*/

async function loadWorks() {

    try {

        const response =
            await fetch(
                CATALOG_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load the works catalog."
            );

        }


        const data =
            await response.json();


        if (
            Array.isArray(data)
        ) {

            works = data;

        } else if (
            Array.isArray(data.tracks)
        ) {

            works = data.tracks;

        } else {

            works = [];

        }


        /*
            Apply locally saved order.

            This allows the page to remember a rearrangement
            until the GitHub publishing connection is added.
        */

        applyLocalOrder();


        renderWorks();


    } catch (error) {

        console.error(
            "GR8SKUL works could not be loaded:",
            error
        );


        works = [];

        renderWorks();

    }

}


/*
    ============================================================
    APPLY LOCAL ORDER
    ============================================================
*/

function applyLocalOrder() {

    try {

        const saved =
            localStorage.getItem(
                LOCAL_ORDER_KEY
            );


        if (!saved) {

            return;

        }


        const savedWorks =
            JSON.parse(
                saved
            );


        if (
            !Array.isArray(savedWorks)
        ) {

            return;

        }


        /*
            Match saved works to the current catalog
            using the MP3/file identity.

            This means the metadata stays attached
            to the work while its position changes.
        */

        const currentByFile =
            new Map();


        works.forEach(
            function(work) {

                const key =
                    getWorkKey(
                        work
                    );

                if (key) {

                    currentByFile.set(
                        key,
                        work
                    );

                }

            }
        );


        const reordered = [];


        savedWorks.forEach(
            function(savedWork) {

                const key =
                    getWorkKey(
                        savedWork
                    );


                if (
                    key &&
                    currentByFile.has(key)
                ) {

                    reordered.push(
                        currentByFile.get(key)
                    );

                    currentByFile.delete(
                        key
                    );

                }

            }
        );


        /*
            Any newly added works that were not
            present in the saved order are added
            to the beginning.
        */

        const newWorks =
            Array.from(
                currentByFile.values()
            );


        works =
            newWorks.concat(
                reordered
            );

    } catch (error) {

        console.error(
            "Could not apply saved works order:",
            error
        );

    }

}


/*
    ============================================================
    WORK IDENTITY
    ============================================================
*/

function getWorkKey(
    work
) {

    if (!work) {

        return "";

    }


    return (
        work.file ||
        work.filename ||
        work.path ||
        work.url ||
        work.src ||
        work.audio ||
        ""
    );

}


/*
    ============================================================
    RENDER WORKS
    ============================================================
*/

function renderWorks() {

    worksList.innerHTML = "";


    works.forEach(
        function(
            work,
            index
        ) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "work";


            row.dataset.index =
                index;


            row.setAttribute(
                "role",
                "button"
            );


            row.setAttribute(
                "aria-label",
                "Drag to rearrange " +
                (
                    work.title ||
                    work.track_title ||
                    work.name ||
                    work.file ||
                    "work"
                )
            );


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "work-number";


            number.textContent =
                String(
                    index + 1
                ).padStart(
                    2,
                    "0"
                );


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "work-info";


            const artist =
                document.createElement(
                    "div"
                );


            artist.className =
                "work-artist";


            artist.textContent =
                work.artist ||
                work.artists ||
                work.artist_name ||
                "";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "work-title";


            title.textContent =
                work.title ||
                work.track_title ||
                work.name ||
                work.file ||
                "";


            info.appendChild(
                artist
            );


            info.appendChild(
                title
            );


            const edit =
                document.createElement(
                    "button"
                );


            edit.type =
                "button";


            edit.className =
                "edit-button";


            edit.textContent =
                "EDIT";


            edit.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    editWork(
                        index
                    );

                }
            );


            row.appendChild(
                number
            );


            row.appendChild(
                info
            );


            row.appendChild(
                edit
            );


            addPointerDragHandlers(
                row
            );


            worksList.appendChild(
                row
            );

        }
    );

}


/*
    ============================================================
    POINTER / TOUCH DRAG
    ============================================================

    This replaces the desktop-only HTML5 drag system.

    Pointer events work with:

        mouse
        trackpad
        iPhone
        iPad
        Android
        touch screens
*/

function addPointerDragHandlers(
    element
) {

    element.addEventListener(
        "pointerdown",
        function(event) {

            /*
                Do not start a drag when the EDIT button
                is pressed.
            */

            if (
                event.target.closest(
                    "button"
                )
            ) {

                return;

            }


            const index =
                Number(
                    element.dataset.index
                );


            touchDrag = {

                element:
                    element,

                index:
                    index,

                pointerId:
                    event.pointerId,

                startY:
                    event.clientY,

                active:
                    false

            };


            try {

                element.setPointerCapture(
                    event.pointerId
                );

            } catch (error) {

                /*
                    Some browsers may not support
                    pointer capture in every situation.
                */

            }

        }
    );


    element.addEventListener(
        "pointermove",
        function(event) {

            if (!touchDrag) {

                return;

            }


            if (
                event.pointerId !==
                touchDrag.pointerId
            ) {

                return;

            }


            const movement =
                Math.abs(
                    event.clientY -
                    touchDrag.startY
                );


            /*
                Small movements are ignored so
                normal tapping remains normal.
            */

            if (
                !touchDrag.active &&
                movement < 8
            ) {

                return;

            }


            if (
                !touchDrag.active
            ) {

                touchDrag.active =
                    true;

                touchDrag.element.classList.add(
                    "dragging"
                );

            }


            event.preventDefault();


            moveTouchRow(
                event.clientY
            );

        },
        {
            passive: false
        }
    );


    element.addEventListener(
        "pointerup",
        function(event) {

            if (!touchDrag) {

                return;

            }


            if (
                event.pointerId !==
                touchDrag.pointerId
            ) {

                return;

            }


            finishPointerDrag();

        }
    );


    element.addEventListener(
        "pointercancel",
        function(event) {

            if (!touchDrag) {

                return;

            }


            if (
                event.pointerId !==
                touchDrag.pointerId
            ) {

                return;

            }


            finishPointerDrag();

        }
    );

}


/*
    ============================================================
    MOVE TOUCH ROW
    ============================================================
*/

function moveTouchRow(
    pointerY
) {

    if (!touchDrag) {

        return;

    }


    const draggedElement =
        touchDrag.element;


    const rows =
        Array.from(
            worksList.children
        );


    for (
        const row of rows
    ) {

        if (
            row ===
            draggedElement
        ) {

            continue;

        }


        const rect =
            row.getBoundingClientRect();


        const midpoint =
            rect.top +
            rect.height / 2;


        if (
            pointerY <
            midpoint
        ) {

            worksList.insertBefore(
                draggedElement,
                row
            );

            return;

        }

    }


    /*
        If the pointer is below all rows,
        put the dragged row at the bottom.
    */

    worksList.appendChild(
        draggedElement
    );

}


/*
    ============================================================
    FINISH POINTER DRAG
    ============================================================
*/

function finishPointerDrag() {

    if (!touchDrag) {

        return;

    }


    const draggedElement =
        touchDrag.element;


    const wasDragging =
        touchDrag.active;


    draggedElement.classList.remove(
        "dragging"
    );


    touchDrag =
        null;


    if (!wasDragging) {

        return;

    }


    saveCurrentDomOrder();

}


/*
    ============================================================
    SAVE CURRENT DOM ORDER
    ============================================================
*/

function saveCurrentDomOrder() {

    const rows =
        Array.from(
            worksList.children
        );


    const reordered =
        rows.map(
            function(row) {

                return works[
                    Number(
                        row.dataset.index
                    )
                ];

            }
        );


    works =
        reordered;


    /*
        Store the actual new order.

        The page is now using this order as
        the playlist order represented by
        the Works list.
    */

    try {

        localStorage.setItem(
            LOCAL_ORDER_KEY,
            JSON.stringify(
                works
            )
        );

    } catch (error) {

        console.error(
            "Could not save local works order:",
            error
        );

    }


    /*
        Re-render immediately so the numbers
        become 01, 02, 03, etc. in the new order.
    */

    renderWorks();

}


/*
    ============================================================
    EDIT
    ============================================================
*/

function editWork(
    index
) {

    const work =
        works[index];


    if (!work) {

        return;

    }


    document.getElementById(
        "artistName"
    ).value =
        work.artist ||
        work.artists ||
        work.artist_name ||
        "";


    document.getElementById(
        "trackTitle"
    ).value =
        work.title ||
        work.track_title ||
        work.name ||
        "";


    document.getElementById(
        "genre"
    ).value =
        work.genre ||
        "";


    document.getElementById(
        "mood"
    ).value =
        work.mood ||
        "";


    formMessage.textContent =
        "Editing works will be connected to the publishing system next.";


    addForm.classList.add(
        "visible"
    );


    addButton.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


/*
    ============================================================
    ADD FORM
    ============================================================
*/

addButton.addEventListener(
    "click",
    function() {

        addForm.classList.toggle(
            "visible"
        );


        if (
            addForm.classList.contains(
                "visible"
            )
        ) {

            document.getElementById(
                "artistName"
            ).focus();

        }

    }
);


/*
    ============================================================
    CANCEL
    ============================================================
*/

cancelButton.addEventListener(
    "click",
    function() {

        clearForm();


        addForm.classList.remove(
            "visible"
        );

    }
);


/*
    ============================================================
    CLEAR FORM
    ============================================================
*/

function clearForm() {

    document.getElementById(
        "artistName"
    ).value =
        "";


    document.getElementById(

}

uploadButton.addEventListener(

    function() {

        const artist =
            document.getElementById(

            document.getElementById(

        const genre =
            document.getElementById(
